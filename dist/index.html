      ctx.moveTo(-0.45, 0.10);
      ctx.lineTo(0.45, 0.10);
      ctx.quadraticCurveTo(0.38, 0.47, 0.00, 0.47);
      ctx.quadraticCurveTo(-0.38, 0.47, -0.45, 0.10);
      ctx.closePath();
      ctx.clip();
      ctx.globalAlpha = A * 0.55;
      ctx.fillStyle = '#ffffff';
      rrect(ctx, -0.20, 0.12, 0.075, 0.34, 0.035);
      ctx.fill();
      ctx.globalAlpha = A * 0.30;
      rrect(ctx, 0.07, 0.14, 0.045, 0.26, 0.022);
      ctx.fill();
      ctx.globalAlpha = A * 0.35;
      ctx.fillStyle = '#e9eef7';
      epath(ctx, 0.0, 0.44, 0.26, 0.045);
      ctx.fill();
      ctx.globalAlpha = A;
      ctx.restore();
      ctx.strokeStyle = A_DENT;
      lw(ctx, px, 0.016, 0.7);
      ctx.beginPath(); ctx.moveTo(-0.34, 0.26); ctx.quadraticCurveTo(0, 0.34, 0.34, 0.26); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-0.22, 0.38); ctx.quadraticCurveTo(0, 0.44, 0.22, 0.38); ctx.stroke();
    } else {
      /* 陶碗：一条淡淡的暗边 */
      ctx.strokeStyle = 'rgba(120,126,146,0.45)';
      lw(ctx, px, 0.014, 0.6);
      ctx.beginPath(); ctx.moveTo(-0.30, 0.32); ctx.quadraticCurveTo(0, 0.38, 0.30, 0.32); ctx.stroke();
    }

    /* 碗沿：一圈亮边 */
    ctx.fillStyle = metal ? '#dfe6f1' : '#f4f6fa';
    epath(ctx, 0, 0.085, 0.465, 0.055);
    ctx.fill();
    if (metal) {
      ctx.strokeStyle = '#ffffff';
      lw(ctx, px, 0.016, 0.7);
      ctx.globalAlpha = A * 0.85;
      ctx.beginPath();
      if (HAS_ELLIPSE) {
        ctx.ellipse(0, 0.078, 0.452, 0.042, 0, PI, TAU);
      } else {
        ctx.arc(0, 0.078, 0.30, PI, TAU);
      }
      ctx.stroke();
      ctx.globalAlpha = A;
    }
  }

  function drawSteam(ctx, t, px) {
    if (px < 18) return;
    var A = ctx.globalAlpha;
    ctx.strokeStyle = '#ffffff';
    ctx.lineCap = 'round';
    lw(ctx, px, 0.028, 0.9);
    for (var i = 0; i < 3; i++) {
      var ph = ((t * 0.55) + i * 0.33) % 1;
      var y0 = -0.42 - ph * 0.62;
      var x0 = STEAM_X[i] + Math.sin(ph * 6.4 + i * 1.7) * 0.055;
      ctx.globalAlpha = A * Math.sin(ph * PI) * 0.40;
      ctx.beginPath();
      ctx.moveTo(x0 - 0.015, y0 + 0.16);
      ctx.quadraticCurveTo(x0 + 0.065, y0 + 0.08, x0 - 0.010, y0);
      ctx.quadraticCurveTo(x0 - 0.065, y0 - 0.08, x0 + 0.020, y0 - 0.17);
      ctx.stroke();
    }
    ctx.globalAlpha = A;
  }

  function drawRiceGlow(ctx, o, t) {
    var glow = clamp01(num(o.glow, 0));
    if (glow <= 0) return;
    var A = ctx.globalAlpha;
    ctx.fillStyle = C.gold;
    ctx.globalAlpha = A * 0.18 * glow;
    epath(ctx, 0, -0.06, 0.60 + 0.04 * Math.sin(t * 4), 0.60);
    ctx.fill();
    ctx.globalAlpha = A * 0.22 * glow;
    epath(ctx, 0, -0.06, 0.46, 0.46);
    ctx.fill();
    ctx.globalAlpha = A;
  }

  function rice(ctx, x, y, s, o) {
    if (!ctx || !(s > 0) || !finite2(x) || !finite2(y)) return;
    o = o || {};
    var a = clamp01(num(o.alpha, 1));
    if (a <= 0) return;
    var px = s * clamp(num(o.scale, 1), 0.05, 6);
    var t = timeOf(o);
    ctx.save();
    try {
      ctx.globalAlpha *= a;
      ctx.translate(x, y);
      ctx.scale(px, px);
      drawRiceGlow(ctx, o, t);
      drawMound(ctx, o, t, px);
      drawBowl(ctx, false, t, px);
      drawSteam(ctx, t, px);
    } finally {
      ctx.restore();
    }
  }

  function bowlRice(ctx, x, y, s, o) {
    if (!ctx || !(s > 0) || !finite2(x) || !finite2(y)) return;
    o = o || {};
    var a = clamp01(num(o.alpha, 1));
    if (a <= 0) return;
    var px = s * clamp(num(o.scale, 1), 0.05, 6);
    var t = timeOf(o);
    ctx.save();
    try {
      ctx.globalAlpha *= a;
      ctx.translate(x, y);
      ctx.scale(px, px);
      drawRiceGlow(ctx, o, t);
      drawMound(ctx, o, t, px);
      drawBowl(ctx, true, t, px);
      drawSteam(ctx, t, px);
    } finally {
      ctx.restore();
    }
  }

  /* ════════════════════════════════════════════════════════════
     6. token（金色硬币）
     ════════════════════════════════════════════════════════════ */
  function drawToken(ctx, o, t, px) {
    var A = ctx.globalAlpha;
    var spin = Math.cos(t * 2.1);
    var rx = Math.abs(spin);
    var R = 0.40;
    var w = R * (0.10 + 0.90 * rx);

    /* 光晕 */
    if (px >= 16) {
      ctx.fillStyle = C.gold;
      ctx.globalAlpha = A * (0.12 + 0.05 * Math.sin(t * 3));
      epath(ctx, 0, 0, R * 1.55, R * 1.55);
      ctx.fill();
      ctx.globalAlpha = A * 0.14;
      epath(ctx, 0, 0, R * 1.20, R * 1.20);
      ctx.fill();
      ctx.globalAlpha = A;
    }

    /* 侧面厚度（转到侧面时露出的金边） */
    if (rx > 0.30) {
      ctx.fillStyle = C.goldDeep;
      epath(ctx, 0.022 * spin, 0, w, R);
      ctx.fill();
    }

    /* 币面 */
    epath(ctx, 0, 0, w, R);
    ctx.fillStyle = coinGrad(ctx);
    ctx.fill();
    ctx.strokeStyle = C.goldDeep;
    lw(ctx, px, 0.022, 0.9);
    ctx.stroke();

    if (rx > 0.42) {
      /* 内圈 */
      ctx.strokeStyle = 'rgba(184,128,26,0.75)';
      lw(ctx, px, 0.016, 0.7);
      epath(ctx, 0, 0, w * 0.80, R * 0.80);
      ctx.stroke();

      /* 旋转高光：一条扫过的斜光带 */
      if (px >= 16) {
        ctx.save();
        epath(ctx, 0, 0, w * 0.97, R * 0.97);
        ctx.clip();
        var sweep = ((t * 0.42) % 1) * 2.4 - 1.2;
        ctx.globalAlpha = A * 0.42;
        ctx.fillStyle = '#ffffff';
        ctx.save();
        ctx.translate(sweep * 0.5, 0);
        ctx.rotate(-0.5);
        ctx.fillRect(-0.09, -0.6, 0.18, 1.2);
        ctx.restore();
        ctx.restore();
        ctx.globalAlpha = A;
      }

      /* x 与 = 两个符号（跟着硬币一起透视压缩） */
      if (px >= 14 && rx > 0.48) {
        ctx.save();
        epath(ctx, 0, 0, w * 0.96, R * 0.96);
        ctx.clip();
        ctx.scale(Math.max(0.35, rx), 1);
        ctx.fillStyle = C.goldDark;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        var fs = Math.round(px * 0.42);
        textPx(ctx, px, 'x', fs, -R * 0.38, 0.01, 800, 1);
        textPx(ctx, px, '=', fs, R * 0.38, 0.01, 800, 1);
        ctx.restore();
      }
    }

    /* 随机星点闪光（确定性伪随机，s 不够大就不画粒子） */
    if (px >= 20) {
      ctx.strokeStyle = '#fff6d0';
      for (var i = 0; i < SPARK.length; i++) {
        var sp = SPARK[i];
        var ph = ((t * 0.42) + sp.ph) % 1;
        if (ph > 0.32) continue;
        var a2 = Math.sin(ph / 0.32 * PI);
        var sxp = sp.x * (0.55 + 0.85 * rx);
        star4(ctx, sxp, sp.y, sp.r * (0.55 + 0.55 * a2), A * a2 * 0.95);
      }
      ctx.globalAlpha = A;
    }
  }

  function token(ctx, x, y, s, o) {
    if (!ctx || !(s > 0) || !finite2(x) || !finite2(y)) return;
    o = o || {};
    var a = clamp01(num(o.alpha, 1));
    if (a <= 0) return;
    var px = s * clamp(num(o.scale, 1), 0.05, 6);
    var t = timeOf(o);
    ctx.save();
    try {
      ctx.globalAlpha *= a;
      ctx.translate(x, y);
      ctx.scale(px, px);
      drawToken(ctx, o, t, px);
    } finally {
      ctx.restore();
    }
  }

  /* ════════════════════════════════════════════════════════════
     7. Claude 娘
     ════════════════════════════════════════════════════════════ */
  var fmtCache = {};
  function fmtFactor(f) {
    var v = num(f, 1);
    var hit = fmtCache[v];
    if (hit !== undefined) return hit;
    var out;
    if (G.expr && typeof G.expr.fmtNum === 'function') {
      try { out = String(G.expr.fmtNum(v)); } catch (e) { out = null; }
    }
    if (out === null || out === undefined) {
      out = (Math.abs(v - Math.round(v)) < 1e-9) ? String(Math.round(v)) : String(Math.round(v * 100) / 100);
    }
    var n = 0;
    for (var k in fmtCache) { if (Object.prototype.hasOwnProperty.call(fmtCache, k)) n++; }
    if (n > 64) fmtCache = {};
    fmtCache[v] = out;
    return out;
  }

  /** 星芒发饰：8 根短射线（米白） */
  function drawStarPin(ctx, px, t, happy) {
    var A = ctx.globalAlpha;
    ctx.save();
    ctx.translate(0.09, -0.40);
    ctx.rotate(t * 0.28);
    ctx.strokeStyle = C.rice;
    ctx.lineCap = 'round';
    lw(ctx, px, 0.026, 0.8);
    ctx.beginPath();
    for (var i = 0; i < 8; i++) {
      var a = i * TAU / 8;
      var r0 = 0.036, r1 = 0.036 + (i % 2 === 0 ? 0.062 : 0.040);
      ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0);
      ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1);
    }
    ctx.stroke();
    ctx.fillStyle = happy ? C.gold : C.rice;
    epath(ctx, 0, 0, 0.030, 0.030);
    ctx.fill();
    ctx.globalAlpha = A * 0.55;
    ctx.strokeStyle = '#ffffff';
    lw(ctx, px, 0.012, 0.5);
    epath(ctx, 0, 0, 0.014, 0.014);
    ctx.stroke();
    ctx.globalAlpha = A;
    ctx.restore();
  }

  function drawClaude(ctx, o, t, px) {
    var A = ctx.globalAlpha;
    var happy = !!o.happy;
    var factorTxt = '×' + fmtFactor(o.factor);
    var bob = Math.sin(t * 1.8) * 0.035;
    var sway = Math.sin(t * 1.3) * 0.022;

    ctx.translate(0, bob);
    ctx.rotate(sway);

    /* ── 腿 / 鞋 ─────────────────────────────────────────── */
    ctx.fillStyle = C.skin;
    rrect(ctx, -0.105, 0.20, 0.075, 0.20, 0.036); ctx.fill();
    rrect(ctx, 0.030, 0.20, 0.075, 0.20, 0.036); ctx.fill();
    ctx.fillStyle = '#4a3340';
    rrect(ctx, -0.125, 0.375, 0.115, 0.085, 0.038); ctx.fill();
    rrect(ctx, 0.015, 0.375, 0.115, 0.085, 0.038); ctx.fill();

    /* ── 后发（在身体后面） ───────────────────────────────── */
    ctx.fillStyle = hairGrad(ctx, true);
    ctx.beginPath();
    ctx.moveTo(-0.235, -0.24);
    ctx.quadraticCurveTo(-0.31, -0.02, -0.22, 0.12);
    ctx.quadraticCurveTo(-0.10, 0.18, 0.00, 0.12);
    ctx.quadraticCurveTo(0.10, 0.18, 0.22, 0.12);
    ctx.quadraticCurveTo(0.31, -0.02, 0.235, -0.24);
    ctx.quadraticCurveTo(0.0, -0.44, -0.235, -0.24);
    ctx.closePath();
    ctx.fill();

    /* ── 吊带裙（橙色） + 白衬衫 ─────────────────────────── */
    ctx.fillStyle = '#fbf8f0';
    rrect(ctx, -0.155, -0.11, 0.31, 0.20, 0.055); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-0.045, -0.10); ctx.lineTo(0.0, -0.01); ctx.lineTo(0.045, -0.10);
    ctx.lineTo(0.0, -0.06); ctx.closePath();
    ctx.fillStyle = '#e9e2d2';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-0.135, -0.02);
    ctx.lineTo(0.135, -0.02);
    ctx.quadraticCurveTo(0.20, 0.18, 0.245, 0.30);
    ctx.lineTo(-0.245, 0.30);
    ctx.quadraticCurveTo(-0.20, 0.18, -0.135, -0.02);
    ctx.closePath();
    ctx.fillStyle = dressGrad(ctx);
    ctx.fill();
    /* 裙摆暗边 + 褶 */
    ctx.fillStyle = 'rgba(140,70,48,0.55)';
    ctx.fillRect(-0.245, 0.268, 0.49, 0.034);
    if (px >= DETAIL_S) {
      ctx.strokeStyle = 'rgba(140,70,48,0.40)';
      lw(ctx, px, 0.010, 0.5);
      ctx.beginPath();
      ctx.moveTo(-0.09, 0.02); ctx.lineTo(-0.13, 0.28);
      ctx.moveTo(0.09, 0.02); ctx.lineTo(0.13, 0.28);
      ctx.stroke();
    }
    /* 吊带 */
    ctx.strokeStyle = C.orangeDeep;
    lw(ctx, px, 0.020, 0.7);
    ctx.beginPath();
    ctx.moveTo(-0.10, -0.10); ctx.lineTo(-0.075, 0.02);
    ctx.moveTo(0.10, -0.10); ctx.lineTo(0.075, 0.02);
    ctx.stroke();

    /* ── 手臂（把牌子抱在胸前） ───────────────────────────── */
    ctx.strokeStyle = C.skin;
    ctx.lineCap = 'round';
    lw(ctx, px, 0.062, 1.6);
    ctx.beginPath();
    ctx.moveTo(-0.145, -0.045); ctx.lineTo(-0.20, 0.14);
    ctx.moveTo(0.145, -0.045); ctx.lineTo(0.20, 0.14);
    ctx.stroke();
    /* 白衬衫袖口 */
    ctx.strokeStyle = '#fbf8f0';
    lw(ctx, px, 0.075, 1.8);
    ctx.beginPath();
    ctx.moveTo(-0.165, 0.015); ctx.lineTo(-0.185, 0.075);
    ctx.moveTo(0.165, 0.015); ctx.lineTo(0.185, 0.075);
    ctx.stroke();

    /* ── 牌子 ─────────────────────────────────────────────── */
    var sw = 0.50, sh = 0.235, sy = 0.115;
    ctx.save();
    ctx.translate(0, sy);
    ctx.rotate(Math.sin(t * 2.4) * 0.02);
    ctx.fillStyle = 'rgba(8,14,26,0.30)';
    rrect(ctx, -sw / 2 + 0.012, -sh / 2 + 0.020, sw, sh, 0.045); ctx.fill();
    ctx.fillStyle = C.rice;
    rrect(ctx, -sw / 2, -sh / 2, sw, sh, 0.045); ctx.fill();
    ctx.strokeStyle = C.orangeDeep;
    lw(ctx, px, 0.020, 0.8);
    rrect(ctx, -sw / 2, -sh / 2, sw, sh, 0.045); ctx.stroke();
    ctx.fillStyle = C.orangeDeep;
    ctx.fillRect(-sw / 2 + 0.025, -sh / 2 + 0.030, sw - 0.05, 0.018);
    if (px >= 14) {
      var fs = px * 0.20 * Math.min(1, 3.4 / (factorTxt.length + 0.8));
      ctx.fillStyle = C.orangeDark;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      textPx(ctx, px, factorTxt, fs, 0, 0.020, 800, 0);
    }
    ctx.restore();
    /* 手（抱牌） */
    ctx.fillStyle = C.skin;
    epath(ctx, -0.235, 0.135, 0.038, 0.038); ctx.fill();
    epath(ctx, 0.235, 0.135, 0.038, 0.038); ctx.fill();

    /* ── 头 ───────────────────────────────────────────────── */
    ctx.fillStyle = C.skin;
    epath(ctx, 0, -0.225, 0.185, 0.195); ctx.fill();
    ctx.fillStyle = 'rgba(224,183,156,0.55)';
    epath(ctx, 0.0, -0.13, 0.12, 0.06); ctx.fill();

    /* 侧发（会轻轻飘） */
    var swayH = Math.sin(t * 1.6) * 0.055;
    ctx.fillStyle = hairGrad(ctx, false);
    ctx.save();
    ctx.translate(-0.175, -0.24); ctx.rotate(swayH * 0.6);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-0.075, 0.14, -0.055, 0.30);
    ctx.quadraticCurveTo(0.005, 0.22, 0.035, 0.03);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.translate(0.175, -0.24); ctx.rotate(-swayH * 0.6);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(0.075, 0.14, 0.055, 0.30);
    ctx.quadraticCurveTo(-0.005, 0.22, -0.035, 0.03);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    /* 刘海：三团蓬松的弧 + 呆毛 */
    ctx.fillStyle = hairGrad(ctx, false);
    epath(ctx, -0.095, -0.290, 0.115, 0.105); ctx.fill();
    epath(ctx, 0.095, -0.290, 0.115, 0.105); ctx.fill();
    epath(ctx, 0.0, -0.320, 0.135, 0.115); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-0.19, -0.30);
    ctx.quadraticCurveTo(-0.02, -0.46, 0.19, -0.30);
    ctx.quadraticCurveTo(0.02, -0.38, -0.19, -0.30);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = hairGrad(ctx, false);
    lw(ctx, px, 0.026, 0.8);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0.03, -0.40);
    ctx.quadraticCurveTo(0.10 + swayH, -0.50, 0.055, -0.55);
    ctx.stroke();

    /* 星芒发饰 */
    drawStarPin(ctx, px, t, happy);
    /* 高兴时发饰周围冒两点八芒星 */
    if (happy && px >= 18) {
      ctx.strokeStyle = C.goldLight;
      for (var hi = 0; hi < 2; hi++) {
        var hph = ((t * 0.6) + hi * 0.5) % 1;
        star8(ctx, -0.10 + hi * 0.30, -0.42 - Math.sin(hph * PI) * 0.10, 0.05, A * Math.sin(hph * PI) * 0.9);
      }
      ctx.globalAlpha = A;
    }

    /* ── 脸 ───────────────────────────────────────────────── */
    var blink = (t % 3.3) > 3.18;
    if (happy && !blink) {
      ctx.strokeStyle = C.eye;
      lw(ctx, px, 0.020, 0.7);
      ctx.beginPath();
      ctx.moveTo(-0.105, -0.205); ctx.quadraticCurveTo(-0.075, -0.245, -0.045, -0.205);
      ctx.moveTo(0.045, -0.205); ctx.quadraticCurveTo(0.075, -0.245, 0.105, -0.205);
      ctx.stroke();
    } else if (blink) {
      ctx.strokeStyle = C.eye;
      lw(ctx, px, 0.018, 0.7);
      ctx.beginPath();
      ctx.moveTo(-0.105, -0.215); ctx.lineTo(-0.045, -0.215);
      ctx.moveTo(0.045, -0.215); ctx.lineTo(0.105, -0.215);
      ctx.stroke();
    } else {
      ctx.fillStyle = C.eye;
      epath(ctx, -0.075, -0.215, 0.028, 0.034); ctx.fill();
      epath(ctx, 0.075, -0.215, 0.028, 0.034); ctx.fill();
      ctx.fillStyle = '#ffffff';
      epath(ctx, -0.084, -0.228, 0.011, 0.010); ctx.fill();
      epath(ctx, 0.066, -0.228, 0.011, 0.010); ctx.fill();
    }
    if (px >= DETAIL_S) {
      ctx.globalAlpha = A * 0.35;
      ctx.fillStyle = '#f08a72';
      epath(ctx, -0.125, -0.165, 0.038, 0.024); ctx.fill();
      epath(ctx, 0.125, -0.165, 0.038, 0.024); ctx.fill();
      ctx.globalAlpha = A;
    }
    ctx.strokeStyle = 'rgba(90,42,30,0.9)';
    lw(ctx, px, 0.017, 0.7);
    ctx.beginPath();
    if (happy) {
      ctx.moveTo(-0.030, -0.150);
      ctx.quadraticCurveTo(0.0, -0.100, 0.030, -0.150);
    } else {
      ctx.moveTo(-0.026, -0.140);
      ctx.quadraticCurveTo(0.0, -0.165, 0.026, -0.140);
    }
    ctx.stroke();
  }

  function claude(ctx, x, y, s, o) {
    if (!ctx || !(s > 0) || !finite2(x) || !finite2(y)) return;
    o = o || {};
    var a = clamp01(num(o.alpha, 1));
    if (a <= 0) return;
    var px = s * clamp(num(o.scale, 1), 0.05, 6);
    var t = timeOf(o);
    ctx.save();
    try {
      ctx.globalAlpha *= a;
      ctx.translate(x, y);
      var entry = assetEntry('claude');
      if (entry) { drawAssetImage(ctx, entry, px, num(o.hurt, 0)); return; }
      ctx.scale(px, px);
      drawClaude(ctx, o, t, px);
    } finally {
      ctx.restore();
    }
  }

  /* ════════════════════════════════════════════════════════════
     8. 用户（深青绿小人剪影 + 判定气泡标记）
     ════════════════════════════════════════════════════════════ */
  function userBodyPath(ctx) {
    ctx.beginPath();
    ctx.moveTo(-0.150, -0.015);
    ctx.quadraticCurveTo(-0.215, 0.10, -0.195, 0.26);
    ctx.quadraticCurveTo(-0.170, 0.44, 0.0, 0.44);
    ctx.quadraticCurveTo(0.170, 0.44, 0.195, 0.26);
    ctx.quadraticCurveTo(0.215, 0.10, 0.150, -0.015);
    ctx.closePath();
  }

  function drawUser(ctx, o, t, px) {
    var A = ctx.globalAlpha;
    var happy = (o.happy === true) ? 1 : (o.happy === false ? -1 : 0);
    var blame = happy < 0;
    var bob = Math.sin(t * 2.2) * 0.028;
    ctx.translate(0, bob);

    /* 影子 */
    if (px >= 20) {
      ctx.globalAlpha = A * 0.20;
      ctx.fillStyle = '#04070f';
      epath(ctx, 0, 0.47, 0.22, 0.045);
      ctx.fill();
      ctx.globalAlpha = A;
    }

    /* 身体 */
    userBodyPath(ctx);
    ctx.fillStyle = bodyGradTeal(ctx, blame);
    ctx.fill();
    ctx.strokeStyle = blame ? C.dangerDeep : C.okDeep;
    lw(ctx, px, 0.022, 0.8);
    ctx.stroke();

    /* 手臂 */
    if (px >= 16) {

      if (showRiceValue && (el.type === 'rice' || el.type === 'bowl_rice')) {
        this.drawValueOnRice(ctx, p.x, p.y, tile, el);
      }
    }

    /* 已通过的门留一圈淡痕 */
    for (var g = 0; g < lv.doors.length; g++) {
      var dr = lv.doors[g];
      if (!eng.gone[dr.id]) continue;
      if (dr.x < x0 || dr.x > x1 || dr.y < y0 || dr.y > y1) continue;
      var pp = this.screenOf(dr.x, dr.y);
      ctx.globalAlpha = 0.16;
      ctx.strokeStyle = '#7aa9ff';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(pp.x, pp.y, tile * 0.36, 0, 6.2832);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    /* 大肥鱼 */
    var pos = this.playerDrawPos();
    var sp = this.screenOf(pos.x - 0.5, pos.y - 0.5);
    this._playerScreen = sp;
    S.fish(ctx, sp.x, sp.y, tile * 1.12, {
      t: this.t,
      value: eng.value,
      facing: eng.facing,
      bowl: eng.bowl,
      moving: !!this.moving,
      stepT: this.playerAnim.stepT,
      spawn: this.playerAnim.spawn,
      winT: this.playerAnim.winT,
      deadT: this.playerAnim.deadT,
      hurt: this.hurt,
      dead: eng.status === 'lost'
    });

    if (detail) this.drawDoorLabels(ctx, x0, y0, x1, y1);

    var goal = lv.goal;
    if (goal && goal.type === 'hidden' && eng.isRevealed(goal) && !eng.gone[goal.id]) {
      var gp = this.screenOf(goal.x, goal.y);
      ctx.globalAlpha = 0.5 + 0.35 * Math.sin(this.t * 4);
      ctx.strokeStyle = '#a06bff';
      ctx.lineWidth = Math.max(1.4, tile * 0.07);
      ctx.beginPath();
      ctx.arc(gp.x, gp.y, tile * (0.55 + 0.08 * Math.sin(this.t * 4)), 0, 6.2832);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    if (this.following) {
      if (lv.goal && !eng.gone[lv.goal.id]) this.drawGoalArrow(ctx);
      this.drawMini(ctx);
    }

    ctx.save();
    FX.draw(ctx);
    ctx.restore();
    FX.drawFlash(ctx, this.w, this.h);
  };

  /* 白饭身上的数值：每颗饭的数值都是关卡数据单独给的 */
  Renderer.prototype.drawValueOnRice = function (ctx, cx, cy, tile, el) {
    var txt = G.expr.fmtNum(el.value);
    var fs = Math.max(7, Math.min(19, tile * 0.42));
    var key = (fs | 0) + '|' + txt;
    var tw = this._tw[key];
    ctx.font = '800 ' + fs + 'px ui-monospace, "Cascadia Mono", Consolas, monospace';
    if (tw === undefined) { tw = ctx.measureText(txt).width; this._tw[key] = tw; }
    /* 数字太宽就缩一号，保证不糊出格子 */
    if (tw > tile * 1.05 && fs > 7) {
      fs = Math.max(7, fs * (tile * 1.05) / tw);
      ctx.font = '800 ' + fs + 'px ui-monospace, "Cascadia Mono", Consolas, monospace';
      tw = ctx.measureText(txt).width;
    }
    var y = cy + tile * (el.type === 'bowl_rice' ? 0.06 : 0.04);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (tile >= 22) {
      /* 格子够大：给个随文字宽度自适应的底 */
      var padX = fs * 0.34, padY = fs * 0.16, w = tw + padX * 2, h = fs + padY * 2;
      var rx = cx - w / 2, ry = y - h / 2, rr = Math.min(h / 2, 6);
      ctx.beginPath();
      ctx.moveTo(rx + rr, ry);
      ctx.arcTo(rx + w, ry, rx + w, ry + h, rr);
      ctx.arcTo(rx + w, ry + h, rx, ry + h, rr);
      ctx.arcTo(rx, ry + h, rx, ry, rr);
      ctx.arcTo(rx, ry, rx + w, ry, rr);
      ctx.closePath();
      ctx.fillStyle = 'rgba(10,16,28,.55)';
      ctx.fill();

    ctx.strokeStyle = 'rgba(5,9,18,.92)';
    ctx.strokeText(txt, cx, y);

  /* 文字气泡：背景宽度 = 实测文字宽度 + 内边距 */
  Renderer.prototype.textBubble = function (ctx, cx, cy, text, opts) {

    var tw = ctx.measureText(text).width;

    ctx.arcTo(x + w, y, x + w, y + h, r);

  Renderer.prototype.drawDoorLabels = function (ctx, x0, y0, x1, y1) {
    var lv = this.level, eng = this.engine;
    var fs = Math.max(8, Math.min(14, this.tile * 0.30));
    /* 只写明"门槛 + 通过后怎么运算"，不透露当前数值能不能过 —— 让玩家自己算 */
    for (var i = 0; i < lv.doors.length; i++) {
      var d = lv.doors[i];
      if (eng.gone[d.id]) continue;
      if (d.x < x0 || d.x > x1 || d.y < y0 || d.y > y1) continue;
      var p = this.screenOf(d.x, d.y);
      var txt = '≥' + d.req + '　' + R.doorFormula(d);
      this.textBubble(ctx, p.x, p.y + this.tile * 0.74, txt, {
        fs: fs,
        bg: 'rgba(10,18,32,.90)',
        fg: '#dce9ff',
        stroke: 'rgba(122,170,255,.5)'

    }
    var goal = lv.goal;
    if (goal && !eng.gone[goal.id] && !(goal.type === 'hidden' && !eng.isRevealed(goal))) {
      if (goal.x >= x0 && goal.x <= x1 && goal.y >= y0 && goal.y <= y1) {
        var gp = this.screenOf(goal.x, goal.y);
        this.textBubble(ctx, gp.x, gp.y + this.tile * 0.74, '终点 ≥' + goal.req, {
          fs: fs, bg: 'rgba(30,22,6,.92)', fg: '#ffe6a8', stroke: 'rgba(255,206,92,.55)'
        });
      }
    }
  };

  Renderer.prototype.drawGoalArrow = function (ctx) {
    var lv = this.level, v = this.view;
    var g = this.screenOf(lv.goal.x, lv.goal.y);
    if (g.x > v.x + 30 && g.x < v.x + v.w - 30 && g.y > v.y + 30 && g.y < v.y + v.h - 30) return;
    var cxp = v.x + v.w / 2, cyp = v.y + v.h / 2;
    var ang = Math.atan2(g.y - cyp, g.x - cxp);
    var rx = v.w / 2 - 26, ry = v.h / 2 - 26;
    var t = Math.min(Math.abs(rx / Math.cos(ang)), Math.abs(ry / Math.sin(ang)));
    var ax = cxp + Math.cos(ang) * t, ay = cyp + Math.sin(ang) * t;

    ctx.translate(ax, ay);
    ctx.rotate(ang);
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = '#ffce5c';
    ctx.beginPath();
    ctx.moveTo(14, 0); ctx.lineTo(-8, -9); ctx.lineTo(-3, 0); ctx.lineTo(-8, 9);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 0.9;
    ctx.font = '700 11px ui-monospace, Consolas, monospace';
    ctx.fillStyle = '#ffe6a8';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('终点 ≥' + lv.goal.req, ax + Math.cos(ang) * -34, ay + Math.sin(ang) * -34);
    ctx.globalAlpha = 1;
  };

  /* 左下角小地图 */
  Renderer.prototype.drawMini = function (ctx) {
    var lv = this.level, eng = this.engine, v = this.view;
    if (!this.mini) return;
    var maxW = Math.min(190, v.w * 0.26), maxH = Math.min(190, v.h * 0.30);
    var scale = Math.min(maxW / lv.w, maxH / lv.h);
    var mw = lv.w * scale, mh = lv.h * scale;
    var mx = v.x + 12, my = v.y + v.h - mh - 12;
    ctx.save();
    ctx.globalAlpha = 0.88;
    ctx.fillStyle = 'rgba(6,10,20,.72)';
    rrect(ctx, mx - 5, my - 5, mw + 10, mh + 10, 8);
    ctx.fill();
    ctx.strokeStyle = 'rgba(122,170,255,.28)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(this.mini, mx, my, mw, mh);
    ctx.imageSmoothingEnabled = true;

    /* 视口框 */
    var visW = v.w / this.tile, visH = v.h / this.tile;
    ctx.strokeStyle = 'rgba(255,255,255,.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(
      mx + (this.camX - visW / 2) * scale, my + (this.camY - visH / 2) * scale,
      visW * scale, visH * scale
    );

    /* 终点 */
    if (lv.goal && !eng.gone[lv.goal.id]) {
      ctx.fillStyle = '#ffce5c';
      ctx.beginPath();
      ctx.arc(mx + (lv.goal.x + 0.5) * scale, my + (lv.goal.y + 0.5) * scale, Math.max(2.4, scale), 0, 6.2832);
      ctx.fill();
    }
    /* 未通过的门（统一颜色，不透露数值够不够） */
    for (var i = 0; i < lv.doors.length; i++) {
      var d = lv.doors[i];
      if (eng.gone[d.id]) continue;
      ctx.fillStyle = '#7aa9ff';
      ctx.fillRect(mx + d.x * scale - 1, my + d.y * scale - 1, Math.max(2, scale * 1.6), Math.max(2, scale * 1.6));
    }
    /* 大肥鱼 */
    var p = this.playerPos || { x: eng.px, y: eng.py };
    ctx.fillStyle = '#7cc0ff';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(mx + (p.x + 0.5) * scale, my + (p.y + 0.5) * scale, Math.max(2.6, scale * 1.5), 0, 6.2832);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  };

  function rrect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ── 给 UI 用的：需要显示气泡的元素 ─────────────────────
     返回 [{el, x, y, cls, text}]，UI 负责渲染成 DOM 气泡
     （DOM 气泡宽度用 max-content，天然适配表达式长度）
     ────────────────────────────────────────────────────── */

    var out = [];
    var lv = this.level, eng = this.engine;
    if (!lv || !eng) return out;
    var near = this.following ? 2 : 1;
    var tile = this.tile;
    var needDom = tile < 15;
    var list = [];
    for (var i = 0; i < lv.elements.length; i++) {
      var el = lv.elements[i];
      if (eng.gone[el.id]) continue;
      if (el.type === 'rice' || el.type === 'bowl_rice') continue;   /* 数值已经画在饭上了 */
      if (el.type === 'hidden' && !eng.isRevealed(el)) continue;
      var d = Math.max(Math.abs(el.x - eng.px), Math.abs(el.y - eng.py));
      if (d <= near || (el.type === 'goal' && d <= near + 2)) list.push({ el: el, d: d });
    }
    list.sort(function (a, b) { return a.d - b.d; });
    var max = needDom ? 4 : 2;
    for (var k = 0; k < list.length && out.length < max; k++) {
      var el2 = list[k].el;

        el: el2, x: p.x, y: p.y - tile * 0.66,
        cls: el2.type === 'claude' ? 'claude' : (el2.type === 'user' ? 'user' : (R.isDoorType(el2.type) ? 'door' : '')),
        text: bubbleText(el2, eng)

    }
    return out;
  };

  /* 元素气泡：只写规则（门槛 / 表达式 / 倍率 / 条件），
     绝不预告"算出来是多少"或"现在能不能过" —— 那是玩家自己要算的部分 */
  function bubbleText(el, eng) {
    switch (el.type) {
      case 'rice': return '🍚 +' + el.value;
      case 'bowl_rice': return '🍚+' + el.value + ' +🥣';
      case 'token': return '<b>x =</b> ' + el.expr;
      case 'claude': return '<b>x × ' + el.factor + '</b>';
      case 'user': {
        var pen = typeof el.penalty === 'number' ? el.penalty : el.bonus;
        return '若 <b>' + el.cond + '</b>　则 <b style="color:#48e5a3">+' + el.bonus +
          '</b>，否则 <b style="color:#ff5d6c">−' + pen + '</b>';
      }
      case 'door':
        return R.doorTierName(el) + ' <b>≥' + el.req + '</b>　通过后 <b>' + R.doorFormula(el) + '</b>';
      case 'goal':
        return '终点门 <b>≥' + el.req + '</b>';
      case 'hidden':
        return '隐藏通关格 <b>≥' + el.req + '</b>　(数值到 ' + el.reveal + ' 显形)';
      default: return R.formula(el);
    }
  }

  G.Renderer = Renderer;
})(typeof window !== 'undefined' ? (window.DSF = window.DSF || {}) : (globalThis.DSF = globalThis.DSF || {}));

</script>

    bowl:    function () { tone(300, 0.12, 'square', 0.3, 520); tone(880, 0.22, 'triangle', 0.26, 1320, 0.05); },
    coin:    function () { tone(760, 0.08, 'square', 0.3, 1180); tone(1180, 0.14, 'sine', 0.24, 1560, 0.05); },

    win:     function () {

<script>
/* ─────────────────────────────────────────────────────────────
   act1.js —— 第 1~6 关关卡数据（1~5 关「入门」，第 6 关「初级」）
   ------------------------------------------------------------------
   教学主线（每关只引入一个新元素 / 一个新机制）：
     L1 白饭初尝      rice、减法门、终点门      —— 数值门槛
     L2 铁盆护体      bowl_rice                —— 铁盆免疫一次失败（故意撞门）
     L3 倍率之宴      claude、除法门            —— 除法门在最前面，倍率留在门后
     L4 变量重写      token                   —— x = 表达式，堆最大值不再是唯一解
     L5 用户的审视    user、复杂运算门          —— 条件判断 + 三级门齐全
     L6 铁盆与隐藏格  hidden                  —— 先故意碎盆、再靠隐藏格通关
   ------------------------------------------------------------------
   与 docs/LEVEL_SCHEMA.md、js/map.js 对齐的写法约定：
     · 房间用 rect / round(k)（含切角），房间矩形之间至少留 3 格；
       房间之间一律靠 links 连接（不互相接触），门由构建器放在走廊中段（房间之外）。
     · 填充：fill { type:'rice', value:1, density:0.15, clearance:1 }
       → 每个房间最终密度 = round(格数 × 0.15) / 格数 ≈ 14.7% ~ 15.5%，落在 (10%, 30%) 内。
     · 每关手放的特殊元素彼此至少隔 2 格（不紧贴），且都不落在被切掉的角上。
     · 门的 req 全部写死具体数字（每关 3~4 扇门，满足「至少 2 扇写死」）；
       终点 goal 的 req 统一写 'auto'，由构建器按最优解路线把真实数值写成门槛。
     · 每关的手算过程写在该关 spec 之前的块注释里；所有门槛都保证
       「一口填充白饭都不吃」也能按 solution 顺序通过（填充只会让数值更高），
       因此即使填充随机结果不理想，六关依然可通关。
   ───────────────────────────────────────────────────────────── */
(function (G) {
  'use strict';
  G.levelSpecs = G.levelSpecs || [];

  /* ── 第 1 关 白饭初尝 ─────────────────────────────────────────
     尺寸 34×34 ｜ 3 房间 3 门
     房间：r0 前厅   [2,2]  12×10 矩形（120 格）
           r1 中庭   [21,2] 11×11 round k=3（97 格）
           r2 终点厅 [2,17] 16×13 矩形（208 格）
     门：  door_r0_r1 @(17,5)  减法门 需 x≥12，通过后 x−4

<script>
/* ─────────────────────────────────────────────────────────────
   verify.js —— 关卡校验器 / 最优解追踪 / 终点门槛反推
   ------------------------------------------------------------------
   1) trace(level)：按 level.solution 给出的最优解顺序，
      用 BFS 在「未消耗的非填充元素视为障碍」的地图上逐段寻路，
      再把整条路径交给真实规则引擎逐步模拟，得到每一步的真实数值。
   2) resolveAutoReqs(level)：把 req:'auto' 的门槛，
      按最优解到达该元素时的真实数值反推出来
         · 中转站门：floor(到达值 × reqFrac)，默认 0.8
         · 终点门 / 隐藏通关格：到达值本身（策划案要求：最优值即标准值）
      然后带着真实门槛再跑一次 trace 复核，确保一定可通关。
   3) checkAll(specs)：把全部关卡建出来跑一遍，输出可读报告。
   ───────────────────────────────────────────────────────────── */
(function (G) {
  'use strict';

  var M = G.map, R = G.rules;
  var FLOOR = M.FLOOR;

  /* 各关规模下限（对应策划案第 6 节） */
  function sizeMinFor(id) {
    if (id <= 5) return [31, 31];        /* > 30×30 */
    if (id <= 8) return [41, 41];        /* > 40×40 */
    if (id <= 10) return [51, 51];       /* > 50×50 */
    if (id === 11) return [76, 76];      /* > 75×75 */
    if (id === 12) return [121, 121];    /* > 120×120 */
    return [0, 0];                       /* 自定义关卡不做规模限制 */
  }

  /* ── BFS 最短路 ───────────────────────────────────────── */
  function bfsPath(level, sx, sy, tx, ty, blocked) {
    var W = level.w, H = level.h;
    if (sx === tx && sy === ty) return [[sx, sy]];
    var start = sy * W + sx, goal = ty * W + tx;
    if (level.tiles[goal] !== FLOOR) return null;
    var prev = new Int32Array(W * H).fill(-1);
    var seen = new Uint8Array(W * H);
    var q = [start];
    seen[start] = 1;
    var head = 0;
    while (head < q.length) {
      var cur = q[head++];
      var cx = cur % W, cy = (cur - cx) / W;
      var nbs = [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]];
      for (var n = 0; n < 4; n++) {
        var nx = nbs[n][0], ny = nbs[n][1];
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        var k = ny * W + nx;
        if (seen[k]) continue;
        if (level.tiles[k] !== FLOOR) continue;
        if (k !== goal && blocked && blocked(nx, ny)) continue;
        seen[k] = 1;
        prev[k] = cur;
        if (k === goal) {
          var path = [], p = goal;
          while (p !== -1) { var px = p % W, py = (p - px) / W; path.push([px, py]); p = prev[p]; }
          path.reverse();
          return path;
        }
        q.push(k);
      }
    }
    return null;
  }

  function byId(level, id) {
    for (var i = 0; i < level.elements.length; i++) if (level.elements[i].id === id) return level.elements[i];
    return null;
  }

  /* ── 追踪最优解 ───────────────────────────────────────── */
  function trace(level, opts) {
    opts = opts || {};
    var eng = new G.Engine(level);
    var records = [], warnings = [], errors = [], fullPath = [[eng.px, eng.py]];
    var ids = (level.solution || []).slice();
    if (!ids.length) errors.push('关卡 ' + level.id + ' 没有写 solution（最优解顺序）');

    for (var i = 0; i < ids.length; i++) {
      var id = ids[i];
      var el = byId(level, id);
      if (!el) { errors.push('solution 里的 "' + id + '" 在地图上不存在'); break; }
      if (eng.gone[el.id]) { warnings.push(id + ' 在到达之前已被顺路吃掉，跳过'); continue; }

      var blocked = (function (e0) {
        return function (x, y) {
          var e = level.cellMap[y * level.w + x];
          if (!e) return false;
          if (e.filler) return false;
          if (eng.gone[e.id]) return false;
          if (e.id === e0.id) return false;
          return true;
        };
      })(el);

      var path = bfsPath(level, eng.px, eng.py, el.x, el.y, blocked);
      if (!path) {
        /* 宽松模式：允许穿过其它元素（会改变数值，记录下来） */
        path = bfsPath(level, eng.px, eng.py, el.x, el.y, null);
        if (path) {
          var crossed = [];
          for (var pc = 1; pc < path.length - 1; pc++) {
            var ce = eng.elementAt(path[pc][0], path[pc][1]);
            if (ce && !ce.filler) crossed.push(ce.id);
          }
          warnings.push('前往 ' + id + ' 的干净路线不存在，被迫穿过：' + (crossed.join(', ') || '（未知）'));
        }
      }
      if (!path) { errors.push('从当前位置走不到 ' + id + '（' + el.x + ',' + el.y + '）'); break; }

      var preVal = eng.value, lossless = true;
      for (var p = 1; p < path.length; p++) {
        preVal = eng.value;
        var ev = eng.step(path[p][0] - eng.px, path[p][1] - eng.py);
        fullPath.push([eng.px, eng.py]);
        if (ev.kind === 'bowl-block') lossless = false;
        if (eng.status !== 'playing') break;
      }
      records.push({
        id: id, type: el.type, at: [el.x, el.y],
        before: preVal, after: eng.value,
        gainedBowl: !!eng.bowl, status: eng.status, lossless: lossless
      });
      if (eng.status !== 'playing') break;
    }

    return {
      ok: eng.status === 'won',
      status: eng.status,
      reason: eng.reason,
      value: eng.value,
      records: records,
      warnings: warnings,
      errors: errors,
      path: fullPath,
      engine: eng,
      steps: eng.steps
    };
  }

  /* ── 门槛反推：把 'auto' 变成真实数字 ──────────────────
     两遍法：
       第一遍把所有 auto 门槛临时置 0（保证一定能过），跑出每一步的真实到达值；
       第二遍按到达值算出真实门槛，再跑一次复核。
     ──────────────────────────────────────────────────── */
  function resolveAutoReqs(level) {
    var autos = [];
    level.elements.forEach(function (el) {
      var dirty = false;
      if (el.req === 'auto') { el.reqAuto = true; el.req = 0; dirty = true; }
      if (el.reveal === 'auto') { el.revealAuto = true; el.reveal = 0; dirty = true; }
      if (dirty) autos.push(el);
    });
    if (!autos.length) return { tuned: 0, pass1: null, pass2: null };

    var pass1 = trace(level);
    var report = { tuned: 0, pass1: pass1, pass2: null, failed: false };

    if (!pass1.ok) {
      /* 反推失败：给一个保守门槛，保证还能玩，并让校验器大声报错 */
      autos.forEach(function (el) {
        if (el.reqAuto) el.req = (el.type === 'door') ? 1 : 1;
        if (el.revealAuto) el.reveal = 1;
      });
      report.failed = true;
      report.reason = pass1.errors.length ? pass1.errors.join('；') : ('最优解路线在 ' + pass1.status + ' 结束（' + pass1.reason + '）');
      return report;
    }

    var byRecord = {};
    pass1.records.forEach(function (r) { byRecord[r.id] = r; });

    autos.forEach(function (el) {
      var r = byRecord[el.id];
      if (!r) return;
      if (el.reqAuto) {
        var frac = typeof el.reqFrac === 'number' ? el.reqFrac
                 : (el.type === 'door' ? 0.8 : 1.0);
        var req = Math.floor(r.before * frac);
        /* 门的门槛至少 1，避免出现"0 也能过"的退化门 */
        if (el.type === 'door' && req < 1) req = 1;
        if (el.type === 'goal' && req < 1) req = 1;
        el.req = req;
        el.reqResolved = r.before;
      }
      if (el.revealAuto) {
        var rf = typeof el.revealFrac === 'number' ? el.revealFrac : 0.5;
        el.reveal = Math.max(1, Math.floor(r.before * rf));
      }
      report.tuned++;
    });

    var pass2 = trace(level);
    report.pass2 = pass2;
    if (!pass2.ok) report.failed = true;
    return report;
  }

  /* ── 单关完整校验 ─────────────────────────────────────── */
  function checkLevel(level) {
    var base = M.validate(level);
    var errors = base.errors.slice(), warns = base.warns.slice();

    /* 规模 */
    var mn = sizeMinFor(level.id);
    if (level.w < mn[0] || level.h < mn[1]) {
      errors.push('[' + level.id + '] 地图 ' + level.w + '×' + level.h + ' 不满足下限 >' + (mn[0] - 1) + '×' + (mn[1] - 1));
    }

    /* 最优解追踪 */
    var t = trace(level);
    errors = errors.concat(t.errors);
    warns = warns.concat(t.warnings);
    if (!t.ok) {
      errors.push('[' + level.id + '] 最优解路线没能通关（结束状态 ' + t.status + '：' + t.reason + '）');
    }

    /* 终点门槛 = 最优值（或 ≤ 最优值） */
    var goal = level.goal;
    var intended = null;
    if (t.ok) {
      var last = t.records[t.records.length - 1];
      intended = last ? last.before : t.value;
      if (goal) {
        if (goal.req > intended) {
          errors.push('[' + level.id + '] 终点门槛 ' + goal.req + ' > 最优解可达值 ' + intended + '，无法通关');
        } else if (goal.req < intended * 0.7) {
          warns.push('[' + level.id + '] 终点门槛 ' + goal.req + ' 明显低于最优值 ' + intended + '（偏松）');
        }
      }
    }

    /* 门口不能"过了就死" */
    level.doors.forEach(function (d) {
      if (d.type !== 'door') return;
      var probe = [d.req, Math.max(d.req, 1), d.req * 2 + 1, d.req * 4 + 3];
      var killers = probe.filter(function (x) { return !(R.doorValue(x, d) > 0); });
      if (killers.length) {
        warns.push('[' + level.id + '] 门 ' + d.id + ' 在 x=' + killers.join('/') + ' 时通过后的数值 ≤ 0（过门即死）');
      }
    });

    /* 每关至少介绍一个新元素 */
    if (!level.intro || !level.intro.length) warns.push('[' + level.id + '] 没有配置开局元素介绍 intro');

    /* 元素类型清单 */
    var types = {};
    level.elements.forEach(function (e) { types[e.type] = (types[e.type] || 0) + 1; });

    return {
      id: level.id, name: level.name, w: level.w, h: level.h,
      ok: errors.length === 0, errors: errors, warns: warns,
      info: base.info, intendedValue: intended,
      goalReq: goal ? goal.req : null,
      trace: {
        status: t.status, steps: t.steps, value: t.value,
        records: t.records.map(function (r) {
          return r.id + '(' + r.before + '→' + r.after + ')';
        })
      },
      types: types,
      autoTune: level.autoTuneReport || null
    };
  }

  /* ── 批量校验 ─────────────────────────────────────────── */
  function checkAll(specs, buildFn) {
    var out = [];
    specs.slice().sort(function (a, b) { return a.id - b.id; }).forEach(function (spec) {
      try {
        var lv = buildFn(spec);
        out.push(checkLevel(lv));
      } catch (e) {
        out.push({
          id: spec.id, name: spec.name, ok: false,
          errors: ['构建失败：' + e.message], warns: [], info: {},
          types: {}, trace: null, intendedValue: null, goalReq: null
        });
      }
    });
    return out;
  }

  function formatReport(reports) {
    var lines = [];
    var bad = 0;
    reports.forEach(function (r) {
      var head = (r.ok ? '✅' : '❌') + ' 第' + r.id + '关 ' + (r.name || '') +
        '　' + r.w + '×' + r.h + '　门槛=' + r.goalReq + '　最优值=' + r.intendedValue;
      if (!r.ok) bad++;
      lines.push(head);
      r.errors.slice(0, 12).forEach(function (e) { lines.push('   ✗ ' + e); });
      r.warns.slice(0, 8).forEach(function (w) { lines.push('   ! ' + w); });
      if (r.trace && r.trace.records && r.trace.records.length) {
        lines.push('   路线：' + r.trace.records.slice(0, 24).join(' → '));
      }
      if (r.types) {
        var ts = Object.keys(r.types).map(function (k) { return k + '×' + r.types[k]; }).join(' ');
        lines.push('   元素：' + ts);
      }
    });
    lines.unshift(bad === 0 ? '全部 ' + reports.length + ' 关通过校验 ✅' : ('有 ' + bad + ' 关未通过 ❌'));

})(typeof window !== 'undefined' ? (window.DSF = window.DSF || {}) : (globalThis.DSF = globalThis.DSF || {}));

<script>
/* ─────────────────────────────────────────────────────────────
   levels.js —— 关卡注册表
   ------------------------------------------------------------------
   · 收集 js/levels/act*.js 里 push 进来的 spec
   · 懒构建：真正进入某一关时才生成地图 + 反推终点门槛（保证可通关）
   · 记录通关进度（localStorage）
   ───────────────────────────────────────────────────────────── */
(function (G) {
  'use strict';

  var M = G.map;
  var STORE_KEY = 'dsf.fish.rice.progress.v1';

  var cache = {};
  var specs = [];

  /* 校验器要延迟取（脚本加载顺序不能成为隐患） */
  function V() {
    var v = G.verify;
    if (!v) throw new Error('verify.js 还没加载：请确认 index.html 里它在 levels.js 之前');
    return v;
  }

  function refresh() {
    specs = (G.levelSpecs || []).slice().sort(function (a, b) { return a.id - b.id; });
    return specs;
  }

  function specById(id) {
    if (!specs.length) refresh();
    for (var i = 0; i < specs.length; i++) if (specs[i].id === id) return specs[i];
    return null;
  }

  function buildSpec(spec) {
    var lv = M.buildLevel(spec);
    lv.autoTuneReport = V().resolveAutoReqs(lv);
    return lv;
  }

  function get(id) {
    if (cache[id]) return cache[id];
    var spec = specById(id);
    if (!spec) return null;
    var lv = buildSpec(spec);
    cache[id] = lv;
    return lv;
  }

  /** 强制重建（改了 spec 之后用） */
  function rebuild(id) {
    delete cache[id];
    return get(id);
  }

  /* ── 进度 ─────────────────────────────────────────────── */
  var progress = { cleared: {}, unlocked: 1 };

  function load() {
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      if (raw) {
        var p = JSON.parse(raw);
        if (p && typeof p === 'object') {
          progress.cleared = p.cleared || {};
          progress.unlocked = p.unlocked || 1;
        }
      }
    } catch (e) { /* file:// 或隐私模式，忽略 */ }
    return progress;
  }

  function save() {
    try { window.localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) { }
  }

  function markCleared(id) {
    progress.cleared[id] = 1;
    var next = Math.min(count(), id + 1);
    if (next > progress.unlocked) progress.unlocked = next;
    save();
  }

  function unlockAll() {
    progress.unlocked = count();
    save();
  }

  function resetProgress() {
    progress.cleared = {};
    progress.unlocked = 1;
    save();
  }

  function isUnlocked(id) { return id <= progress.unlocked; }
  function isCleared(id) { return !!progress.cleared[id]; }
  function count() { return specs.length || refresh().length; }

  /** 校验全部关卡（开发面板用） */
  function checkAll() {
    refresh();
    return V().checkAll(specs, buildSpec);
  }

  G.levels = {
    refresh: refresh,
    specs: function () { return specs.length ? specs : refresh(); },
    specById: specById,
    get: get,
    rebuild: rebuild,
    count: count,
    progress: progress,
    load: load,
    save: save,
    markCleared: markCleared,
    unlockAll: unlockAll,
    resetProgress: resetProgress,
    isUnlocked: isUnlocked,
    isCleared: isCleared,
    checkAll: checkAll,
    buildSpec: buildSpec
  };

  refresh();
})(typeof window !== 'undefined' ? (window.DSF = window.DSF || {}) : (globalThis.DSF = globalThis.DSF || {}));

</script>
<script>
/* ─────────────────────────────────────────────────────────────
   ui.js —— HUD / 气泡 / 弹窗 / 判定范围 / 飘字 / 图鉴 / 关卡选择 / 校验面板
   ───────────────────────────────────────────────────────────── */
(function (G) {
  'use strict';

  var R = G.rules, E = G.expr;
  var game = null;
  var dom = {};
  var bubbles = {};
  var judgeEl = null, judgeTimer = 0;
  var overlayOpen = false;

  /* ── 元素缩略图 ───────────────────────────────────────── */
  function sampleEl(type) {
    var s = { type: type, id: 'sample', x: 0, y: 0 };
    switch (type) {
      case 'rice': s.value = 8; break;
      case 'bowl_rice': s.value = 8; break;
      case 'token': s.expr = '(x + 4) * 2'; break;
      case 'claude': s.factor = 3; break;
      case 'user': s.cond = 'x >= 20'; s.bonus = 15; s.penalty = 15; break;
      case 'door': s.op = 'sub'; s.amount = 7; s.req = 30; s.tier = 1; break;
      case 'goal': s.req = 60; break;
      case 'hidden': s.req = 60; s.reveal = 30; break;
    }
    return s;
  }

  function iconCanvas(el, size) {
    size = size || 54;
    if (G.sprites && G.sprites.icon) {
      try { return G.sprites.icon(el, size); } catch (e) { }
    }
    var cv = document.createElement('canvas');
    var dpr = 2;
    cv.width = size * dpr; cv.height = size * dpr;
    cv.style.width = size + 'px'; cv.style.height = size + 'px';
    var c = cv.getContext('2d');
    c.scale(dpr, dpr);
    var t = R.TYPES[el.type] || { color: '#888', tag: '?' };
    c.fillStyle = t.color;
    c.globalAlpha = 0.22;
    c.fillRect(0, 0, size, size);
    c.globalAlpha = 1;
    c.fillStyle = t.color;
    c.font = '700 ' + Math.round(size * 0.5) + 'px sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(t.tag || '?', size / 2, size / 2);
    return cv;
  }

  /* ── 初始化 ───────────────────────────────────────────── */
  function init(g) {
    game = g;
    dom.app = document.getElementById('app');
    dom.valueNum = document.getElementById('value-num');
    dom.valueBox = document.getElementById('value-box');
    dom.valueSub = document.getElementById('value-sub');
    dom.bowlChip = document.getElementById('bowl-chip');
    dom.levelNo = document.getElementById('level-no');
    dom.levelName = document.getElementById('level-name');
    dom.bubbleLayer = document.getElementById('canvas-layer');
    dom.overlay = document.getElementById('overlay');
    dom.card = document.getElementById('overlay-card');
    dom.toastLayer = document.getElementById('toast-layer');
    dom.hintBar = document.getElementById('hint-bar');
    dom.pad = document.getElementById('pad');

    var bind = function (id, fn) {
      var el = document.getElementById(id);
      if (el) el.addEventListener('click', function () { G.audio.unlock(); G.audio.play('click'); fn(); });
    };
    bind('btn-reset', function () { game.restart(); });
    bind('btn-codex', function () { showCodex(); });
    bind('btn-zoom', function () { game.toggleZoom(); });
    bind('btn-mute', function () { var m = game.toggleMute(); syncMute(m); });
    bind('btn-levels', function () { showLevels(); });

    initArtDrop();

    dom.overlay.addEventListener('click', function (e) {
      if (e.target === dom.overlay && game.canDismissOverlay && game.canDismissOverlay()) closeOverlay();
    });
  }

  function syncMute(muted) {
    var b = document.getElementById('btn-mute');
    if (b) { b.textContent = muted ? '🔇' : '🔊'; b.classList.toggle('off', muted); }
  }

  /* ── HUD ──────────────────────────────────────────────── */
  var lastValue = null;
  function sync(engine, level) {
    if (!engine || !level) return;
    dom.levelNo.textContent = (level.id < 10 ? '0' : '') + level.id;
    dom.levelName.textContent = level.name;
    var v = E.fmtNum(engine.value);
    if (lastValue !== v) {
      dom.valueNum.textContent = v;
      var gi = game && game.lastGain !== undefined ? game.lastGain : 0;
      dom.valueBox.classList.remove('good', 'bad');
      if (lastValue !== null && gi > 0) dom.valueBox.classList.add('good');
      else if (lastValue !== null && gi < 0) dom.valueBox.classList.add('bad');
      dom.valueBox.classList.add('pop');
      setTimeout(function () { dom.valueBox.classList.remove('pop'); }, 140);
      lastValue = v;
    }
    dom.bowlChip.classList.toggle('hidden', !engine.bowl);
    if (level.spec && level.spec.hint) setHint(level.spec.hint);
  }

  function setValueSub(t) { if (dom.valueSub) dom.valueSub.textContent = t || ''; }

  var lastHintHTML = null;
  function setHint(t) {
    if (!dom.hintBar) return;
    if (t === lastHintHTML) return;
    lastHintHTML = t;
    if (!t) { dom.hintBar.classList.add('hidden'); dom.hintBar.innerHTML = ''; return; }
    dom.hintBar.classList.remove('hidden');
    dom.hintBar.innerHTML = t;
  }

  /* ── 飘字 ─────────────────────────────────────────────── */
  function float(text, cls, sx, sy) {
    if (!dom.bubbleLayer) return;
    var d = document.createElement('div');
    d.className = 'float-num ' + (cls || 'good');
    d.textContent = text;
    d.style.left = sx + 'px';
    d.style.top = sy + 'px';
    dom.bubbleLayer.appendChild(d);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 1050);
  }

  /* ── Toast ────────────────────────────────────────────── */
  function toast(text, cls) {
    if (!dom.toastLayer) return;
    var d = document.createElement('div');
    d.className = 'toast ' + (cls || '');
    d.textContent = text;
    dom.toastLayer.appendChild(d);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 2600);
  }

  /* ── 画布气泡（表达式宽度自适应） ─────────────────────── */
  function syncBubbles(list) {
    if (!dom.bubbleLayer) return;
    var seen = {};
    (list || []).forEach(function (b) {
      var id = b.el.id;
      seen[id] = true;
      var d = bubbles[id];
      if (!d) {
        d = document.createElement('div');
        d.className = 'expr-bubble';
        dom.bubbleLayer.appendChild(d);
        bubbles[id] = d;
      }
      if (d._html !== b.text) { d.innerHTML = b.text; d._html = b.text; }
      d.className = 'expr-bubble ' + (b.cls || '');
      d.style.left = Math.round(b.x) + 'px';
      d.style.top = Math.round(b.y) + 'px';
    });
    for (var k in bubbles) {
      if (!seen[k]) { if (bubbles[k].parentNode) bubbles[k].parentNode.removeChild(bubbles[k]); delete bubbles[k]; }
    }
  }
  function clearBubbles() {
    for (var k in bubbles) { if (bubbles[k].parentNode) bubbles[k].parentNode.removeChild(bubbles[k]); delete bubbles[k]; }
  }

  /* ── 判定范围弹出（失败时） ───────────────────────────── */
  function judge(sx, sy, o) {
    clearJudge();
    o = o || {};
    var d = document.createElement('div');
    d.className = 'judge';
    var html = '';
    html += '<div class="jt">' + (o.title || '判定失败') + '</div>';
    if (o.formula) html += '<div class="jr">' + o.formula + '</div>';
    if (typeof o.need === 'number' && typeof o.have === 'number') {
      var max = Math.max(o.need, o.have, 1);
      var pw = Math.max(2, Math.min(100, (o.have / max) * 100));
      var nw = Math.max(2, Math.min(100, (o.need / max) * 100));
      html += '<div class="range-bar"><i class="need" style="width:' + nw + '%"></i>' +
        '<i class="have" style="width:' + pw + '%"></i></div>' +
        '<div class="range-legend"><span>当前 <b class="jv">' + E.fmtNum(o.have) + '</b></span>' +
        '<span>要求 <b class="jp">' + E.fmtNum(o.need) + '</b></span></div>';
    } else if (o.text) {
      html += '<div class="jr">' + o.text + '</div>';
    }
    d.innerHTML = html;
    d.style.left = Math.round(sx) + 'px';
    d.style.top = Math.round(sy) + 'px';
    dom.bubbleLayer.appendChild(d);
    judgeEl = d;
    /* 把弹窗夹在视口里，别飞出屏幕 */
    requestAnimationFrame(function () {
      var r = d.getBoundingClientRect();
      var w = window.innerWidth, h = window.innerHeight;
      var dx = 0, dy = 0;
      if (r.left < 8) dx = 8 - r.left;
      if (r.right > w - 8) dx = (w - 8) - r.right;
      if (r.top < 8) dy = 8 - r.top;
      if (r.bottom > h - 8) dy = (h - 8) - r.bottom;
      if (dx || dy) {
        d.style.left = (parseFloat(d.style.left) + dx) + 'px';
        d.style.top = (parseFloat(d.style.top) + dy) + 'px';
      }
    });
    clearTimeout(judgeTimer);
    judgeTimer = setTimeout(clearJudge, 3200);
  }
  function clearJudge() {
    if (judgeEl && judgeEl.parentNode) judgeEl.parentNode.removeChild(judgeEl);
    judgeEl = null;
  }

  /* ── 弹窗基础 ─────────────────────────────────────────── */
  function openOverlay(html, wire, dismissible) {
    dom.card.innerHTML = html;
    dom.overlay.classList.remove('hidden');
    dom.overlay.dataset.dismissible = dismissible ? '1' : '0';
    overlayOpen = true;
    if (wire) wire(dom.card);
    G.audio.play('click');
  }
  function closeOverlay() {
    dom.overlay.classList.add('hidden');
    dom.card.innerHTML = '';
    overlayOpen = false;
  }
  function isOverlayOpen() { return overlayOpen; }

  /* ── 关卡介绍 ─────────────────────────────────────────── */
  function seenTypesBefore(id) {
    var seen = {};
    G.levels.specs().forEach(function (sp) {
      if (sp.id >= id) return;
      (sp.intro || []).forEach(function (it) {
        if (typeof it === 'string') seen[it] = 1;
        else if (it && it.icon) seen[it.icon + '@' + (it.key || it.title)] = 1;
      });
    });
    return seen;
  }

  function introItemHTML(el, isNew, titleOverride, descOverride) {
    var t = R.TYPES[el.type] || {};
    var html = '<div class="intro-item' + (isNew ? ' new' : '') + '" data-icon="' + el.type + '">';
    html += '<div class="it-body"><div class="it-t">' + (titleOverride || t.name) +
      (isNew ? ' <em>NEW</em>' : '') + '</div>';
    html += '<div class="it-d">' + (descOverride || t.rule || '') + '</div>';
    html += '</div></div>';
    return html;
  }

  function showIntro(level, onStart) {
    var seen = seenTypesBefore(level.id);
    var html = '<h1>第 ' + level.id + ' 关 · ' + level.name + '</h1>';
    html += '<div class="sub">' + (level.subtitle || '') +
      '　地图 ' + level.w + '×' + level.h + '　·　元素 ' + level.elements.length +
      '　·　门 ' + level.doors.length + '</div>';

    var items = '', hasNew = false;
    (level.intro || []).forEach(function (it) {
      if (typeof it === 'string') {
        var isNew = !seen[it];
        if (isNew) hasNew = true;
        items += introItemHTML(sampleEl(it), isNew);
      } else if (it && it.icon) {
        var key = it.icon + '@' + (it.key || it.title);
        var nw = it.new === true && !seen[key];
        if (nw) hasNew = true;
        var el = sampleEl(it.icon);
        items += introItemHTML(el, nw, it.title, (it.desc || '') + (it.formula ? '<br><code>' + it.formula + '</code>' : ''));
      }
    });
    if (items) html += '<div class="intro-grid">' + items + '</div>';

    if (level.tips && level.tips.length) {
      html += '<div class="sub" style="margin-top:12px">';
      level.tips.forEach(function (t) { html += '· ' + t + '<br>'; });
      html += '</div>';
    }
    html += '<div class="row right">' +
      '<button class="btn ghost" data-act="codex">元素图鉴</button>' +
      '<button class="btn" data-act="start">' + (hasNew ? '开始（有新元素）' : '开始') + '</button></div>';

    openOverlay(html, function (card) {
      Array.prototype.forEach.call(card.querySelectorAll('.intro-item'), function (node) {
        var cv = iconCanvas(sampleEl(node.getAttribute('data-icon')), 54);
        node.insertBefore(cv, node.firstChild);
      });
      card.querySelector('[data-act="codex"]').onclick = function () { showCodex(function () { showIntro(level, onStart); }); };
      card.querySelector('[data-act="start"]').onclick = function () { closeOverlay(); onStart && onStart(); };
    }, false);
  }

  /* ── 失败 / 通关 ──────────────────────────────────────── */
  function showFail(engine, level, ev, cb) {
    var d = (ev && ev.detail) || {};
    var html = '<h2 class="fail-big">✖ 失败</h2>';
    html += '<div class="sub">' + (d.title || '判定未通过') + '　—— ' + (ev && ev.reason ? ev.reason : '') + '</div>';
    if (typeof d.need === 'number') {
      var max = Math.max(d.need, d.have, 1);
      html += '<div class="range-bar" style="margin-top:14px"><i class="need" style="width:' +
        Math.max(2, Math.min(100, d.need / max * 100)) + '%"></i><i class="have" style="width:' +
        Math.max(2, Math.min(100, d.have / max * 100)) + '%"></i></div>';
      html += '<div class="range-legend"><span>当前数值 <b class="jv">' + E.fmtNum(d.have) +
        '</b></span><span>要求 <b class="jp">' + E.fmtNum(d.need) + '</b></span></div>';
    }
    if (d.formula) html += '<div class="sub" style="margin-top:12px"><code>' + d.formula + '</code></div>';
    html += '<div class="sub" style="margin-top:10px">提示：' + (level.spec.tips && level.spec.tips[0] ? level.spec.tips[0] : '数值 ≤ 0 或撞上过不去的门都会失败。') + '</div>';
    html += '<div class="row right">' +
      '<button class="btn ghost" data-act="levels">关卡选择</button>' +
      '<button class="btn warn" data-act="restart">重开本关</button></div>';
    openOverlay(html, function (card) {
      card.querySelector('[data-act="restart"]').onclick = function () { closeOverlay(); cb && cb('restart'); };
      card.querySelector('[data-act="levels"]').onclick = function () { closeOverlay(); cb && cb('levels'); };
    }, false);
  }

  function showWin(engine, level, cb) {
    var goal = level.goal;
    var req = goal ? goal.req : '?';
    var perfect = goal && engine.value >= req;
    var html = '<h2 class="big-end">🏁 通关！</h2>';
    html += '<div class="sub">第 ' + level.id + ' 关 · ' + level.name + '　·　用了 ' + engine.steps + ' 步</div>';
    html += '<div class="big-end">数值 ' + E.fmtNum(engine.value) + '</div>';
    html += '<div class="sub">终点门槛（本关最优解标准值）：<code>' + E.fmtNum(req) + '</code>' +
      (perfect ? '　✅ 达标' : '') + '</div>';
    if (engine.bowl) html += '<div class="sub">🥣 通关时铁盆还完好</div>';
    var last = level.id >= G.levels.count();
    html += '<div class="row right"><button class="btn ghost" data-act="replay">再玩玩</button>' +
      '<button class="btn ghost" data-act="levels">关卡选择</button>' +
      (last ? '<button class="btn" data-act="levels">全部关卡完成 🎉</button>'
            : '<button class="btn" data-act="next">下一关 →</button>') + '</div>';
    openOverlay(html, function (card) {
      card.querySelector('[data-act="replay"]').onclick = function () { closeOverlay(); cb && cb('replay'); };
      card.querySelector('[data-act="levels"]').onclick = function () { closeOverlay(); cb && cb('levels'); };
      var nx = card.querySelector('[data-act="next"]');
      if (nx) nx.onclick = function () { closeOverlay(); cb && cb('next'); };
    }, false);
  }

  /* ── 关卡选择 ─────────────────────────────────────────── */
  function showLevels() {
    var total = G.levels.count();
    var html = '<h1>关卡选择</h1><div class="sub">共 ' + total + ' 关　·　已通关 ' +
      Object.keys(G.levels.progress.cleared).length + ' 关</div><div class="level-grid">';
    G.levels.specs().forEach(function (sp) {
      var unlocked = G.levels.isUnlocked(sp.id);
      var done = G.levels.isCleared(sp.id);
      html += '<button class="level-cell' + (done ? ' done' : '') + (unlocked ? '' : ' locked') + '" data-id="' + sp.id + '">' +
        '<div class="lc-no">LEVEL ' + (sp.id < 10 ? '0' : '') + sp.id + '</div>' +
        '<div class="lc-nm">' + sp.name + '</div>' +
        '<div class="lc-meta">' + (sp.tier || '') + '　' + sp.size[0] + '×' + sp.size[1] + '</div>' +
        '</button>';
    });
    html += '</div><div class="row right">' +
      '<button class="btn ghost" data-act="unlock">解锁全部</button>' +
      '<button class="btn ghost" data-act="reset">重置进度</button>' +
      '<button class="btn" data-act="close">返回游戏</button></div>';
    openOverlay(html, function (card) {
      Array.prototype.forEach.call(card.querySelectorAll('.level-cell'), function (node) {
        node.onclick = function () {
          var id = parseInt(node.getAttribute('data-id'), 10);
          if (!G.levels.isUnlocked(id)) { toast('这一关还没解锁，先通关前面的关卡吧', 'warn'); G.audio.play('warn'); return; }
          closeOverlay();
          game.goLevel(id);
        };
      });
      card.querySelector('[data-act="unlock"]').onclick = function () {
        G.levels.unlockAll(); toast('已解锁全部关卡', 'good'); showLevels();
      };
      card.querySelector('[data-act="reset"]').onclick = function () {
        G.levels.resetProgress(); toast('进度已重置', 'warn'); showLevels();
      };
      card.querySelector('[data-act="close"]').onclick = closeOverlay;
    }, true);
  }

  /* ── 图鉴 ─────────────────────────────────────────────── */
  function showCodex(onBack) {
    var html = '<h1>元素图鉴</h1><div class="sub">大肥鱼碰到元素后，用自己的数值参与该元素的运算。</div><div class="codex-list">';
    R.ORDER.forEach(function (t) {
      var T = R.TYPES[t];
      html += '<div class="codex-row" data-icon="' + t + '"><div>' +
        '<div class="cx-t">' + T.name + '</div>' +
        '<div class="cx-d">' + T.rule + '<br>示例：<code>' + T.example + '</code></div>' +
        '</div></div>';
    });
    html += '</div>';
    html += '<div class="sub" style="margin-top:14px">表达式可用：<code>+ - * / % **</code>、比较 <code>== != &lt; &lt;= &gt; &gt;=</code>、' +
      '逻辑 <code>&amp;&amp; || !</code>、变量 <code>x</code>、常量 <code>pi e</code>。<br>' +
      '函数：<code>' + E.funcList.join(' ') + '</code><br>' +
      '<b>除法是向下取整的整数除法</b>，取模结果永远非负，所有结果四舍五入到 3 位小数。</div>';
    html += '<div class="sub" style="margin-top:10px">🥣 铁盆：可免疫一次失败（数值不变、元素不消失、大肥鱼被弹出），最多同时持有 1 个。</div>';
    html += '<div class="row right">' +
      '<button class="btn ghost" data-act="art">换形象素材</button>' +
      '<button class="btn" data-act="close">返回</button></div>';
    openOverlay(html, function (card) {
      Array.prototype.forEach.call(card.querySelectorAll('.codex-row'), function (node) {
        var cv = iconCanvas(sampleEl(node.getAttribute('data-icon')), 48);
        node.insertBefore(cv, node.firstChild);
      });
      card.querySelector('[data-act="art"]').onclick = function () { showArt(); };
      card.querySelector('[data-act="close"]').onclick = function () {
        if (onBack) { onBack(); } else closeOverlay();
      };
    }, true);
  }

  /* ── 校验面板（开发用，按 V） ─────────────────────────── */
  function showVerify() {
    openOverlay('<h1>关卡校验</h1><div class="sub" id="vf-status">正在构建 12 张地图并追踪最优解路线……</div>' +
      '<pre id="vf-out" style="max-height:52vh;overflow:auto;font-size:11.5px;line-height:1.6;white-space:pre-wrap;' +
      'background:rgba(0,0,0,.32);padding:12px;border-radius:12px;margin-top:12px"></pre>' +
      '<div class="row right"><button class="btn" data-act="close">关闭</button></div>',
      function (card) {
        card.querySelector('[data-act="close"]').onclick = closeOverlay;
        setTimeout(function () {
          var t0 = Date.now();
          var reports, err = null;
          try { reports = G.levels.checkAll(); } catch (e) { err = e; }

    /* ── 到达格心后决定下一步 ────────────────────────────
       按住方向键 -> 继续走（想转弯被墙挡住就先直行）
       只点了一下/滑了一下 -> 走完这一格就停
       什么都没按 -> 滑到格心停住
       ─────────────────────────────────────────────────── */
    var next = null;
    if (hold) {
      if (hold === mv.dir) next = hold;
      else if (canGo(hold)) next = hold;
      else if (canGo(mv.dir)) next = mv.dir;
    } else if (tapDir && canGo(tapDir)) {
      next = tapDir;
    }
    tapDir = null;
    if (!next) { resetMove(); renderer.moving = false; return; }

    var turned = (next !== mv.dir);
    if (turned) engine.facing = next;
    mv.dir = next;
    mv.active = true;
    /* 直行时把这一帧多走的一点带过去，速度才连续；转弯就重新起步 */
    mv.t = turned ? 0 : Math.min(0.99, carry);
    renderer.moving = true;
  }

  function screenOfCell(x, y) {
    var p = renderer.screenOf(x, y);
    return p;
  }

  function handleEvent(ev) {
    if (!ev) return;
    var pp = screenOfCell(engine.px, engine.py);
    var detail = ev.detail || {};
    var before = ev.valueBefore, after = ev.valueAfter;
    game.lastGain = (typeof after === 'number' && typeof before === 'number') ? (after - before) : 0;

    /* 数值 ≤ 0 这种"运算失败"也要先把它本身的效果演出来（先演出，再处理失败） */
    var fxKind = (ev.kind === 'lose') ? (ev.cause || '') : ev.kind;
    switch (fxKind) {
      case 'move': break;

      case 'rice':
        G.audio.play('eat');
        G.fx.burst('rice', pp.x, pp.y, { n: 8 });
        G.ui.float('+' + E.fmtNum(detail.delta !== undefined ? detail.delta : 0), 'good', pp.x, pp.y - renderer.tile * 0.5);
        break;

      case 'bowl_rice':
        G.audio.play('bowl');
        G.fx.burst('bowl', pp.x, pp.y, { n: 12 });
        G.fx.ring(pp.x, pp.y, '#cfd6e2', 6, renderer.tile * 1.4, 0.5);
        G.ui.float('+' + E.fmtNum(detail.delta) + ' 🥣', 'good', pp.x, pp.y - renderer.tile * 0.5);
        if (detail.gainBowl) G.ui.toast('获得铁盆 🥣 可免疫一次失败', 'good');
        break;

      case 'token':
        G.audio.play('coin');
        G.fx.burst('coin', pp.x, pp.y, { n: 14 });
        G.ui.float('token 改写', 'mul', pp.x, pp.y - renderer.tile * 0.5);
        G.ui.toast('token 改写了数值', 'good');
        break;

      case 'claude':
        G.audio.play('mul');
        G.fx.burst('claude', pp.x, pp.y, { n: 16, lift: 40 });
        G.ui.float('×' + E.fmtNum(detail.factor), 'mul', pp.x, pp.y - renderer.tile * 0.5);
        break;

      case 'user-ok':
        G.audio.play('if-ok');
        G.fx.burst('user', pp.x, pp.y, { n: 14 });
        G.ui.float('✓ +' + E.fmtNum(detail.bonus), 'good', pp.x, pp.y - renderer.tile * 0.5);
        G.ui.toast('用户很满意：' + detail.cond + ' ✔', 'good');
        break;

      case 'user-bad':
        G.audio.play('if-bad');
        G.fx.burst('hit', pp.x, pp.y, { n: 12 });
        G.fx.shake(6);
        G.ui.float('✗ −' + E.fmtNum(detail.penalty), 'bad', pp.x, pp.y - renderer.tile * 0.5);
        G.ui.toast('用户开始责备：' + detail.cond + ' ✘', 'warn');
        break;

      case 'door':
        if (ev.lost) break;      /* 门拒绝放行时不要放"开门"音效 */
        G.audio.play('door');
        G.fx.burst('door', pp.x, pp.y, { n: 20 });
        G.fx.ring(pp.x, pp.y, '#7aa9ff', 6, renderer.tile * 1.8, 0.55);
        G.fx.shake(5);
        G.ui.float('通过', 'good', pp.x, pp.y - renderer.tile * 0.5);
        break;

      case 'bowl-block': {
        G.audio.play('bowlbreak');
        G.fx.burst('bowl', pp.x, pp.y, { n: 26, power: 1.3 });
        G.fx.shake(13);
        G.ui.flashHit();
        renderer.hurt = 1;
        /* 铁盆碎了：大肥鱼从门口被弹回自己那一格 */
        mv.lastDir = ev.dx > 0 ? 'right' : ev.dx < 0 ? 'left' : ev.dy > 0 ? 'down' : 'up';
        mv.recoil = 0.92;
        var target = engine.elementAt(ev.el.x, ev.el.y);
        var tp = target ? screenOfCell(target.x, target.y) : pp;
        G.ui.judge(tp.x, tp.y - renderer.tile * 0.7, {
          title: '🥣 铁盆碎了',
          formula: detail.formula || '免疫一次失败',
          text: (detail.text || '') + '<br>元素还在原地，数值不变。',
          need: detail.need, have: detail.have
        });
        G.ui.toast('铁盆替你挡下了这次失败！', 'warn');
        break;
      }

      case 'lose': break;   /* 统一由下面的 ev.lost 处理 */

    }

    /* 失败 / 通关：无论走的是哪种元素，只看引擎给的结果 */
    if (ev.lost) doLose(ev, pp, detail);
    else if (ev.win) doWin(pp);

    refreshSub();
  }

  /* ── 失败演出：受击动画 + 判定范围弹窗 + 失败面板 ───────── */
  function doLose(ev, pp, detail) {
    G.audio.play('fail');
    G.fx.burst('hit', pp.x, pp.y, { n: 30, power: 1.25 });
    G.fx.shake(16);
    G.fx.flash('#ff3b50', 0.55);
    G.ui.flashHit();
    renderer.hurt = 1;
    state = 'lost';
    animT.dead = 0;                 /* 翻倒动画 */
    var jx = pp.x, jy = pp.y;
    if (detail.need !== undefined && ev.el) { var q = screenOfCell(ev.el.x, ev.el.y); jx = q.x; jy = q.y; }
    var text = '';
    if (detail.need === undefined) {
      text = detail.text || ('数值变成了 ' + E.fmtNum(engine.value) + '，≤ 0 就出局');
    }
    G.ui.judge(jx, jy - renderer.tile * 0.7, {
      title: '✖ ' + (detail.title || '失败'),
      formula: detail.formula || ('数值 ' + E.fmtNum(engine.value)),
      need: detail.need, have: detail.have,
      text: text
    });
    setTimeout(function () {
      if (state === 'lost') {
        G.ui.showFail(engine, level, ev, function (act) {
          if (act === 'restart') loadLevel(currentId, { skipIntro: true });
          else if (act === 'levels') G.ui.showLevels();
        });
      }
    }, 950);
  }

  /* ── 通关演出 ─────────────────────────────────────────── */
  function doWin(pp) {
    G.audio.play('win');
    G.fx.burst('win', pp.x, pp.y, { n: 80, power: 1.2 });
    G.fx.ring(pp.x, pp.y, '#ffce5c', 8, renderer.tile * 3.2, 0.8);
    G.fx.shake(7);
    state = 'won';
    animT.win = 0;                  /* 跳起来转两圈 */
    G.levels.markCleared(level.id);
    setTimeout(function () {
      if (state === 'won') {
        G.ui.showWin(engine, level, function (act) {
          if (act === 'next') {
            var nid = level.id + 1;
            if (nid <= G.levels.count()) game.goLevel(nid);
            else G.ui.showLevels();
          } else if (act === 'replay') loadLevel(currentId, { skipIntro: true });
          else if (act === 'levels') G.ui.showLevels();
        });
      }
    }, 800);
  }

  /* ── 主循环 ───────────────────────────────────────────── */
  function loop(ts) {
    var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
    last = ts;

    if (renderer && level && engine) {
      updateMovement(dt);
      if (!mv.active && mv.recoil > 0) mv.recoil = Math.max(0, mv.recoil - dt * 4.2);
      var pp = playerContinuous();
      renderer.setPlayerPos(pp.x, pp.y);

      /* ── 动画计时：出生弹入 / 通关跳起转圈 / 失败翻倒 ── */
      if (animT.spawn < 1) animT.spawn = Math.min(1, animT.spawn + dt / 0.42);
      if (animT.win >= 0) animT.win = Math.min(1, animT.win + dt / 0.85);
      if (animT.dead >= 0) animT.dead = Math.min(1, animT.dead + dt / 0.7);
      renderer.setPlayerAnim({
        stepT: mv.active ? Math.min(1, mv.t) : 0,
        spawn: animT.spawn,
        winT: animT.win < 0 ? 0 : animT.win,
        deadT: animT.dead < 0 ? 0 : animT.dead
      });

      /* 每走到一个新格子 → 脚下扬一小撮尘 */
      if (lastCell.x !== engine.px || lastCell.y !== engine.py) {
        if (lastCell.x >= 0 && mv.active && engine.status === 'playing') {
          var fp = renderer.screenOf(engine.px, engine.py);
          G.fx.burst('dust', fp.x, fp.y + renderer.tile * 0.34, { n: 3, lift: 6 });
        }
        lastCell.x = engine.px; lastCell.y = engine.py;
      }

      renderer.update(dt);
      renderer.draw();
      G.fx.update(dt);

      if (Math.abs(renderer.tile - lastBakeTile) / Math.max(1, lastBakeTile) > 0.14) {
        renderer.bakeStatic();
        lastBakeTile = renderer.tile;
      }
      G.ui.syncBubbles(state === 'playing' ? renderer.focusBubbles() : []);
      G.ui.sync(engine, level);
    }
    requestAnimationFrame(loop);
  }

  /* ── 启动 ─────────────────────────────────────────────── */
  function boot() {
    canvas = document.getElementById('stage');
    renderer = new G.Renderer(canvas);
    G.levels.load();

    /* 打开页面就告知玩法 */
    G.ui.init(game);
    G.ui.syncMute(G.audio.isMuted());

    if (G.levels.count() === 0) {
      document.getElementById('overlay').classList.remove('hidden');
      document.getElementById('overlay-card').innerHTML =
        '<h1>关卡数据没加载出来</h1><div class="sub">' +
        '请确认 <code>js/levels/act1.js</code> 与 <code>js/levels/act2.js</code> 存在，' +
        '并且是双击 <code>index.html</code> 打开（用浏览器打开文件夹里的 index.html，而不是直接打开 js 文件）。' +
        '</div><div class="sub">也可以跑 <code>node tools/serve.mjs</code> 起一个本地服务器再访问。</div>';
      return;
    }

    /* 立绘素材：
       ① 单文件版会把图片以 base64 内嵌到 window.DSF_ASSETS，优先用；
       ② 否则去 assets/ 找图（找不到就静默用程序化画法，不会报错）；
       ③ 最后再套上浏览器本地存的（拖拽换的）形象，优先级最高。 */
    var embedded = window.DSF_ASSETS || null;
    if (embedded && embedded.fish && G.sprites && G.sprites.installArt) {
      G.sprites.installArt('fish', embedded.fish, function (ok) {
        if (ok && embedded.fish_bowl) {
          G.sprites.installArt('fish_bowl', embedded.fish_bowl, function () { G.ui.loadSavedArt(); });
        } else {
          G.ui.loadSavedArt();
        }
      });
      if (embedded.claude) G.sprites.installArt('claude', embedded.claude, function () { });
      if (embedded.user) G.sprites.installArt('user', embedded.user, function () { });
    } else if (USE_IMAGE_ASSETS && G.sprites && G.sprites.installArt) {
      G.sprites.installArt('fish', 'assets/fish.png', function (ok) {
        if (!ok) { G.ui.loadSavedArt(); return; }   /* 没有 assets 目录就静默走程序化画法 */
        G.sprites.installArt('claude', 'assets/claude.png', function () { });
        G.sprites.installArt('user', 'assets/user.png', function () { });
        G.sprites.installArt('fish_bowl', 'assets/fish_bowl.png', function () {
          G.ui.loadSavedArt();                     /* 本地拖拽保存的形象优先级最高 */
        });
      });
    } else {
      G.ui.loadSavedArt();
    }

    var touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    G.input.setPadVisible(touch);
    G.ui.setHint(touch
      ? '按住方向键连续移动 · 滑动走一格 · 左下角是小地图'
      : '按住方向键 / WASD 连续移动 · 点相邻格走一格 · Z 切全图 · R 重开 · U 撤销 · C 图鉴');

    G.input.init({
      onAction: function (act) {
        if (act === 'restart') game.restart();
        else if (act === 'codex') G.ui.showCodex();
        else if (act === 'zoom') game.toggleZoom();
        else if (act === 'mute') G.ui.syncMute(game.toggleMute());
        else if (act === 'levels') G.ui.showLevels();
        else if (act === 'verify') G.ui.showVerify();
        else if (act === 'art') G.ui.showArt();
        else if (act === 'escape') { if (G.ui.isOverlayOpen()) G.ui.closeOverlay(); else G.ui.showLevels(); }
        else if (act === 'confirm') { if (G.ui.isOverlayOpen()) { var b = document.querySelector('#overlay-card .btn'); if (b) b.click(); } }
      },
      onTap: function (x, y) {
        /* 点一下相邻的地板 = 朝那个方向走一格 */
        if (state !== 'playing' || G.ui.isOverlayOpen() || !engine) return;
        var c = renderer.cellAt(x, y);
        var dx = c.x - engine.px, dy = c.y - engine.py;
        if (Math.abs(dx) + Math.abs(dy) !== 1) return;
        tapDir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
      }
    });

    var onResize = function () {
      renderer.setInsets(computeInsets());
      if (level) renderer.bakeStatic();
      lastBakeTile = renderer.tile;
    };
    var rt = null;
    window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(onResize, 180); });
    window.addEventListener('orientationchange', function () { setTimeout(onResize, 260); });
    document.addEventListener('visibilitychange', function () { last = 0; });

    /* URL 支持：#7 直接进第 7 关；?all=1 解锁全部 */
    try {
      if (/[?&]all=1/.test(location.search)) G.levels.unlockAll();
    } catch (e) { }
    var m = /#(\d+)/.exec(location.hash || '');
    var startId = m ? Math.max(1, Math.min(G.levels.count(), parseInt(m[1], 10))) : 1;
    if (!G.levels.isUnlocked(startId)) startId = 1;

    loadLevel(startId);
    requestAnimationFrame(function (ts) { last = ts; requestAnimationFrame(loop); });

    /* 方便调试：控制台里执行 DSF.debugState() 就能看到实时状态 */
    window.DSF.debugState = function () {
      var p = renderer.playerPos;
      return {
        level: level && level.id, px: engine && engine.px, py: engine && engine.py,
        fx: p ? Math.round(p.x * 100) / 100 : null,
        fy: p ? Math.round(p.y * 100) / 100 : null,
        moving: !!mv.active, dir: mv.dir,
        value: engine && engine.value, bowl: engine && engine.bowl,
        status: engine && engine.status, state: state, tile: renderer.tile,
        following: renderer.following, elements: level && level.elements.length,
        particles: G.fx.count()
      };
    };
    window.DSF.debugRefs = { get engine() { return engine; }, get level() { return level; }, get renderer() { return renderer; } };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof window !== 'undefined' ? (window.DSF = window.DSF || {}) : (globalThis.DSF = globalThis.DSF || {}));

</script>
</body>
</html>
