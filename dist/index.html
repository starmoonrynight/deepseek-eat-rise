<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- 单文件版：样式、脚本、立绘全部内联，双击即玩 -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0b1220" />
<meta name="description" content="蓝色大肥鱼吃大白饭 —— 一个纯前端数值解谜游戏。吃掉大白饭、改写 token、和 Claude 娘倍乘、穿过中转站门。" />
<title>蓝色大肥鱼吃大白饭</title>
<style>
/* ─────────────────────────────────────────────────────────────
   蓝色大肥鱼吃大白饭 —— 样式表
   深色中转站风格：深海蓝 + Claude 橙 + 白饭米白
   ───────────────────────────────────────────────────────────── */
:root {
  --bg: #070c17;
  --bg-2: #0d1526;
  --panel: rgba(14, 22, 40, 0.86);
  --panel-line: rgba(120, 170, 255, 0.18);
  --ink: #e8f0ff;
  --ink-dim: #8fa4c8;
  --blue: #4d9bff;
  --blue-deep: #1d5fd6;
  --orange: #d97757;
  --gold: #ffce5c;
  --rice: #f6f1e2;
  --danger: #ff5d6c;
  --ok: #48e5a3;
  --radius: 14px;
  --hud-h: 58px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* 通用隐藏：.overlay / .pad / .hint-bar / .bowl-chip 都靠它切换显隐 */
.hidden { display: none !important; }

html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  overflow: hidden; position: fixed; inset: 0;
  background: radial-gradient(120% 90% at 50% 0%, #142544 0%, var(--bg-2) 45%, var(--bg) 100%);
  color: var(--ink);
  font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei UI", "Microsoft YaHei",
               "Noto Sans SC", "Source Han Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px;
  user-select: none; -webkit-user-select: none;
  touch-action: none;
  overscroll-behavior: none;
}

#app { position: absolute; inset: 0; }

#stage {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
  touch-action: none;
  image-rendering: -webkit-optimize-contrast;
}

/* ── HUD ─────────────────────────────────────────────────── */
#hud {
  position: absolute;
  top: calc(var(--safe-t) + 8px);
  left: calc(var(--safe-l) + 10px);
  right: calc(var(--safe-r) + 10px);
  height: var(--hud-h);
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px;
  padding: 6px 10px;
  background: var(--panel);
  border: 1px solid var(--panel-line);
  border-radius: var(--radius);
  backdrop-filter: blur(10px) saturate(140%);
  -webkit-backdrop-filter: blur(10px) saturate(140%);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  z-index: 20;
  pointer-events: none;
}
#hud > * { pointer-events: auto; }

.hud-left, .hud-right { display: flex; align-items: center; gap: 6px; }
.hud-left { flex: 0 1 auto; min-width: 0; }
.hud-right { flex: 0 0 auto; }

.level-tag {
  display: flex; align-items: baseline; gap: 7px;
  padding: 0 4px; min-width: 0;
}
.level-tag b {
  font: 700 13px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
  color: #0a1020; background: linear-gradient(180deg, #9fc9ff, var(--blue));
  padding: 4px 7px; border-radius: 8px; letter-spacing: .5px;
}
.level-tag span {
  font-size: 14px; font-weight: 600; letter-spacing: .4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 26vw;
}

.hud-center {
  flex: 1 1 auto;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1px; min-width: 0;
}
.value-box {
  display: flex; align-items: baseline; gap: 8px;
  padding: 2px 14px;
  border-radius: 10px;
  background: linear-gradient(180deg, rgba(77, 155, 255, .16), rgba(77, 155, 255, .05));
  border: 1px solid rgba(77, 155, 255, .3);
  transition: transform .12s ease, box-shadow .2s ease, background .2s ease;
}
.value-box .vlabel {
  font-size: 11px; color: var(--ink-dim); letter-spacing: 2px;
}
#value-num {
  font: 800 25px/1.1 ui-monospace, "Cascadia Mono", Consolas, "Segoe UI Mono", monospace;
  color: #fff; text-shadow: 0 0 18px rgba(77, 155, 255, .75);
  font-variant-numeric: tabular-nums;
}
.value-box.pop { transform: scale(1.16); }
.value-box.good { background: linear-gradient(180deg, rgba(72,229,163,.22), rgba(72,229,163,.05)); border-color: rgba(72,229,163,.45); }
.value-box.bad  { background: linear-gradient(180deg, rgba(255,93,108,.24), rgba(255,93,108,.06)); border-color: rgba(255,93,108,.5); }
.value-box.bad #value-num { color: #ffd7db; text-shadow: 0 0 18px rgba(255, 93, 108, .8); }
.bowl-chip {
  font-size: 11px; font-weight: 700; color: #e9eef7;
  background: linear-gradient(180deg, #7d8ba3, #47536b);
  border: 1px solid #aab6c9;
  padding: 2px 7px; border-radius: 999px;
  animation: bowlIn .35s cubic-bezier(.2, 1.6, .4, 1);
}
@keyframes bowlIn { from { transform: scale(.4) rotate(-25deg); opacity: 0 } to { transform: none; opacity: 1 } }
.value-sub { font-size: 11px; color: var(--ink-dim); letter-spacing: .3px; height: 14px; }

.ico {
  width: 36px; height: 36px; flex: 0 0 auto;
  display: grid; place-items: center;
  font-size: 16px; line-height: 1;
  color: var(--ink);
  background: rgba(255, 255, 255, .05);
  border: 1px solid rgba(255, 255, 255, .1);
  border-radius: 10px;
  cursor: pointer;
  transition: background .15s, transform .1s, border-color .15s;
}
.ico:hover { background: rgba(77, 155, 255, .2); border-color: rgba(77, 155, 255, .5); }
.ico:active { transform: scale(.92); }
.ico.off { opacity: .45; }
button { font-family: inherit; }

/* ── 画布浮层（气泡 / 飘字 / 判定范围） ─────────────────── */
#canvas-layer { position: absolute; inset: 0; pointer-events: none; z-index: 15; }

.judge {
  position: absolute;
  transform: translate(-50%, -50%);
  min-width: 120px; max-width: min(78vw, 460px);
  padding: 10px 14px;
  border-radius: 12px;
  background: rgba(20, 8, 14, .93);
  border: 1px solid rgba(255, 93, 108, .55);
  box-shadow: 0 14px 40px rgba(255, 60, 80, .28), inset 0 1px 0 rgba(255, 255, 255, .06);
  color: #ffe9ec; font-size: 13px; line-height: 1.55;
  white-space: nowrap;
  animation: judgeIn .22s cubic-bezier(.2, 1.5, .4, 1);
}
.judge .jt { color: var(--danger); font-weight: 800; letter-spacing: 1px; font-size: 12px; }
.judge .jr { font-family: ui-monospace, Consolas, monospace; font-size: 14px; }
.judge .jv { color: #fff; font-weight: 800; font-family: ui-monospace, Consolas, monospace; }
.judge .jp { color: var(--gold); font-weight: 700; }
@keyframes judgeIn { from { transform: translate(-50%, -50%) scale(.7); opacity: 0 } to { transform: translate(-50%, -50%) scale(1); opacity: 1 } }

.expr-bubble {
  position: absolute;
  transform: translate(-50%, -100%);
  padding: 6px 11px;
  border-radius: 10px;
  background: rgba(8, 14, 26, .92);
  border: 1px solid rgba(122, 170, 255, .45);
  color: #dce9ff;
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  font-size: 12.5px; line-height: 1.4;
  white-space: nowrap;         /* 宽度随表达式长度自适应，绝不固定宽度 */
  width: max-content; max-width: min(80vw, 520px);
  overflow: hidden; text-overflow: ellipsis;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
  pointer-events: none;
  animation: bubbleIn .16s ease-out;
}
.expr-bubble b { color: var(--gold); }
.expr-bubble.claude { border-color: rgba(217, 119, 87, .6); color: #ffe2d5; }
.expr-bubble.user   { border-color: rgba(72, 229, 163, .55); color: #d8ffee; }
.expr-bubble.door   { border-color: rgba(255, 206, 92, .55); color: #fff2cf; }
@keyframes bubbleIn { from { opacity: 0; transform: translate(-50%, -92%) } to { opacity: 1; transform: translate(-50%, -100%) } }

/* 飘字 */
.float-num {
  position: absolute; transform: translate(-50%, -50%);
  font: 800 20px/1 ui-monospace, Consolas, monospace;
  text-shadow: 0 2px 10px rgba(0, 0, 0, .85);
  animation: floatUp 1s ease-out forwards;
  pointer-events: none;
}
.float-num.good { color: var(--ok); }
.float-num.bad { color: var(--danger); }
.float-num.mul { color: var(--orange); }
@keyframes floatUp {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.6) }
  18% { opacity: 1; transform: translate(-50%, -72%) scale(1.18) }
  100% { opacity: 0; transform: translate(-50%, -170%) scale(1) }
}

/* ── 方向键 ──────────────────────────────────────────────── */
.pad {
  position: absolute;
  right: calc(var(--safe-r) + 16px);
  bottom: calc(var(--safe-b) + 16px);
  width: 168px; height: 168px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 4px;
  z-index: 18;
  opacity: .9;
  transition: opacity .25s;
}
.pad.hidden { display: none; }
.pad-btn {
  grid-area: auto;
  border-radius: 12px;
  border: 1px solid rgba(122, 170, 255, .28);
  background: rgba(16, 26, 46, .78);
  color: #cfe0ff; font-size: 17px;
  backdrop-filter: blur(6px);
  cursor: pointer;
  transition: background .1s, transform .06s;
  touch-action: none;
}
.pad-btn:active { background: rgba(77, 155, 255, .5); transform: scale(.94); }
.pad-btn.up    { grid-column: 2; grid-row: 1; }
.pad-btn.left  { grid-column: 1; grid-row: 2; }
.pad-btn.down  { grid-column: 2; grid-row: 3; }
.pad-btn.right { grid-column: 3; grid-row: 2; }

/* ── 提示条 ─────────────────────────────────────────────── */
.hint-bar {
  position: absolute;
  left: 50%; transform: translateX(-50%);
  bottom: calc(var(--safe-b) + 10px);
  max-width: min(72vw, 620px);
  padding: 7px 14px;
  border-radius: 999px;
  background: rgba(8, 14, 26, .8);
  border: 1px solid var(--panel-line);
  color: var(--ink-dim); font-size: 12.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  z-index: 17; pointer-events: none;
  transition: opacity .3s;
  width: max-content;
}
.hint-bar.hidden { opacity: 0; }

/* ── 弹窗 ───────────────────────────────────────────────── */
.overlay {
  position: absolute; inset: 0; z-index: 40;
  display: grid; place-items: center;
  padding: calc(var(--safe-t) + 14px) 14px calc(var(--safe-b) + 14px);
  background: rgba(4, 8, 16, .74);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  animation: fadeIn .18s ease-out;
  overflow: auto;
}
.overlay.hidden { display: none; }
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

.card {
  width: min(760px, 100%);
  max-height: 100%;
  overflow: auto;
  background: linear-gradient(180deg, #101b31, #0b1424);
  border: 1px solid rgba(122, 170, 255, .24);
  border-radius: 20px;
  box-shadow: 0 24px 70px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .06);
  padding: 22px 24px 20px;
  animation: cardIn .26s cubic-bezier(.2, 1.2, .4, 1);
}
@keyframes cardIn { from { transform: translateY(14px) scale(.97); opacity: 0 } to { transform: none; opacity: 1 } }

.card h1 {
  margin: 0 0 4px; font-size: 22px; letter-spacing: 1px;
  background: linear-gradient(92deg, #9fc9ff, #ffffff 40%, var(--orange));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.card h2 { margin: 0 0 10px; font-size: 19px; letter-spacing: .6px; }
.card .sub { color: var(--ink-dim); font-size: 13px; line-height: 1.7; }
.card .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.card .row.right { justify-content: flex-end; }
.btn {
  padding: 10px 20px; border-radius: 11px; cursor: pointer;
  font-size: 14.5px; font-weight: 700; letter-spacing: .5px;
  color: #071022;
  background: linear-gradient(180deg, #a9d0ff, var(--blue));
  border: 1px solid rgba(255, 255, 255, .25);
  box-shadow: 0 6px 18px rgba(77, 155, 255, .3);
  transition: transform .1s, filter .15s;
}
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: scale(.96); }
.btn.ghost {
  background: rgba(255, 255, 255, .06); color: var(--ink);
  border: 1px solid rgba(255, 255, 255, .16); box-shadow: none;
}
.btn.warn { background: linear-gradient(180deg, #ffb3bb, var(--danger)); color: #2a0509; box-shadow: 0 6px 18px rgba(255, 93, 108, .3); }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* 元素介绍卡 */
.intro-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); gap: 12px; margin: 14px 0 4px; }
.intro-item {
  display: flex; gap: 11px; align-items: flex-start;
  padding: 12px;
  border-radius: 14px;
  background: rgba(255, 255, 255, .035);
  border: 1px solid rgba(255, 255, 255, .08);
}
.intro-item.new { border-color: rgba(255, 206, 92, .5); background: rgba(255, 206, 92, .07); }
.intro-item canvas { width: 54px; height: 54px; flex: 0 0 auto; border-radius: 11px; background: rgba(0, 0, 0, .3); }
.intro-item .it-t { font-weight: 800; font-size: 14.5px; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
.intro-item .it-t em { font-style: normal; font-size: 10px; padding: 1px 6px; border-radius: 999px; background: var(--gold); color: #2a1d00; font-weight: 800; }
.intro-item .it-d { font-size: 12.5px; color: var(--ink-dim); line-height: 1.6; }
.intro-item code {
  font-family: ui-monospace, Consolas, monospace; font-size: 12px;
  color: var(--gold); background: rgba(255, 206, 92, .1);
  padding: 1px 5px; border-radius: 5px;
}

/* 关卡选择 */
.level-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-top: 14px; }
.level-cell {
  text-align: left; padding: 11px 13px; border-radius: 13px; cursor: pointer;
  background: rgba(255, 255, 255, .04);
  border: 1px solid rgba(255, 255, 255, .1);
  color: var(--ink); transition: all .15s;
}
.level-cell:hover { background: rgba(77, 155, 255, .16); border-color: rgba(77, 155, 255, .45); transform: translateY(-2px); }
.level-cell .lc-no { font: 800 12px/1 ui-monospace, Consolas, monospace; color: var(--blue); letter-spacing: 1px; }
.level-cell .lc-nm { font-weight: 700; font-size: 14px; margin: 4px 0 3px; }
.level-cell .lc-meta { font-size: 11px; color: var(--ink-dim); }
.level-cell.done::after { content: '✓'; color: var(--ok); float: right; font-weight: 800; }
.level-cell.locked { opacity: .42; cursor: not-allowed; }

/* 图鉴 */
.codex-list { display: grid; gap: 10px; margin-top: 12px; }
.codex-row { display: flex; gap: 12px; padding: 11px 12px; border-radius: 13px; background: rgba(255, 255, 255, .035); border: 1px solid rgba(255, 255, 255, .08); }
.codex-row canvas { width: 48px; height: 48px; border-radius: 10px; background: rgba(0, 0, 0, .3); flex: 0 0 auto; }
.codex-row .cx-t { font-weight: 800; margin-bottom: 3px; }
.codex-row .cx-d { font-size: 12.5px; color: var(--ink-dim); line-height: 1.65; }

/* 判定范围条 */
.range-bar { position: relative; height: 8px; border-radius: 999px; background: rgba(255, 255, 255, .1); margin: 9px 0 4px; overflow: hidden; }
.range-bar i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 999px; }
.range-bar .need { background: rgba(255, 206, 92, .5); }
.range-bar .have { background: linear-gradient(90deg, var(--danger), #ff9aa4); }
.range-bar .have.ok { background: linear-gradient(90deg, #1f9e6c, var(--ok)); }
.range-legend { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-dim); font-family: ui-monospace, Consolas, monospace; }

.big-end {
  font: 800 34px/1.2 ui-monospace, Consolas, monospace;
  color: var(--ok); text-shadow: 0 0 26px rgba(72, 229, 163, .55);
  margin: 6px 0 2px;
}
.fail-big { color: var(--danger); text-shadow: 0 0 26px rgba(255, 93, 108, .5); }

/* ── Toast ──────────────────────────────────────────────── */
.toast-layer {
  position: absolute; left: 50%; transform: translateX(-50%);
  top: calc(var(--safe-t) + var(--hud-h) + 22px);
  display: flex; flex-direction: column; gap: 7px; align-items: center;
  z-index: 30; pointer-events: none;
}
.toast {
  padding: 8px 15px; border-radius: 999px;
  background: rgba(8, 14, 26, .92);
  border: 1px solid rgba(122, 170, 255, .35);
  color: var(--ink); font-size: 13px; font-weight: 600;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
  animation: toastIn .22s ease-out, toastOut .3s ease-in 2.2s forwards;
  white-space: nowrap;
}
.toast.warn { border-color: rgba(255, 93, 108, .55); color: #ffd7db; }
.toast.good { border-color: rgba(72, 229, 163, .55); color: #d8ffee; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-10px) } to { opacity: 1; transform: none } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-10px) } }

/* 受击时整屏闪红 */
#app.hit::after {
  content: ''; position: absolute; inset: 0; z-index: 25; pointer-events: none;
  background: radial-gradient(circle at 50% 50%, rgba(255, 60, 80, 0) 30%, rgba(255, 40, 60, .5) 100%);
  animation: hitFlash .42s ease-out forwards;
}
@keyframes hitFlash { 0% { opacity: 1 } 100% { opacity: 0 } }

/* 竖屏窄屏适配 */
@media (max-width: 640px) {
  .level-tag span { max-width: 30vw; font-size: 13px; }
  #value-num { font-size: 21px; }
  .value-box { padding: 1px 10px; }
  .ico { width: 33px; height: 33px; font-size: 15px; }
  .pad { width: 144px; height: 144px; }
  .hint-bar { font-size: 11.5px; max-width: 60vw; }
  .card { padding: 18px 16px 16px; border-radius: 16px; }
  .card h1 { font-size: 19px; }
}
@media (max-height: 520px) {
  :root { --hud-h: 46px; }
  .pad { width: 122px; height: 122px; }
  .value-sub { display: none; }
}
/* 窄屏手机（360~430px）：HUD 要塞下 5 个按钮 + 数值框，只能收紧 */
@media (max-width: 430px) {
  .level-tag span { display: none; }
  .level-tag b { padding: 3px 6px; font-size: 12px; }
  .hud-left, .hud-right { gap: 4px; }
  .ico { width: 30px; height: 30px; font-size: 14px; border-radius: 9px; }
  .value-box { padding: 1px 9px; gap: 5px; }
  .value-box .vlabel { display: none; }
  #value-num { font-size: 19px; }
  .value-sub { display: none; }
}
/* ── 形象素材面板 / 拖拽提示 ─────────────────────────────── */
.art-slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 12px; margin: 14px 0 4px; }
.art-slot {
  display: flex; flex-direction: column; align-items: center; gap: 9px;
  padding: 12px; border-radius: 14px;
  background: rgba(255, 255, 255, .035);
  border: 1px solid rgba(255, 255, 255, .08);
}
.art-slot .as-t { font-weight: 700; font-size: 13.5px; }
.art-slot .as-prev { line-height: 0; border-radius: 12px; overflow: hidden; background: rgba(0, 0, 0, .28); }
.art-slot .as-prev canvas { display: block; }
.art-pending {
  margin: 12px 0 4px; padding: 12px 14px; border-radius: 14px;
  background: rgba(255, 206, 92, .09);
  border: 1px solid rgba(255, 206, 92, .45);
}
.art-pending .ap-t { font-weight: 700; margin-bottom: 8px; }
.drop-hint {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  padding: 16px 26px; border-radius: 16px; z-index: 60; pointer-events: none;
  background: rgba(8, 14, 26, .94);
  border: 2px dashed rgba(122, 170, 255, .75);
  color: var(--ink); font-weight: 700; font-size: 15px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
}

.pad.auto-hide { opacity: .96; }

</style>
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>

  <!-- ── 顶部 HUD ───────────────────────────────────────────── -->
  <header id="hud">
    <div class="hud-left">
      <button id="btn-levels" class="ico" title="关卡选择 (L)">☰</button>
      <div class="level-tag">
        <b id="level-no">01</b>
        <span id="level-name">白饭初尝</span>
      </div>
    </div>

    <div class="hud-center">
      <div id="value-box" class="value-box">
        <span class="vlabel">数值</span>
        <span id="value-num">1</span>

<script>
/* ─────────────────────────────────────────────────────────────
   expr.js —— 安全表达式引擎（不使用 eval / new Function）
   ------------------------------------------------------------------

     · 变量 x（大肥鱼当前数值）、常量 pi / e / true / false
     · 运算 + - * / % ** （除法为向下取整的整数除法）
     · 比较 == != < <= > >=    逻辑 && || !       一元 - + !

    max: function () { return Math.max.apply(null, arguments); },

    ceil: function (a) { return Math.ceil(a); },
    round: function (a, d) { var m = Math.pow(10, d || 0); return Math.round(a * m) / m; },

/* ─────────────────────────────────────────────────────────────
   rules.js —— 元素与运算规则（纯函数层，不碰 DOM / 渲染）

     goal       终点门       x >= req 且 x > 0 判定通关
     hidden     隐藏通关格   达到 reveal 值后显形，踏入时按终点门规则判定
   ------------------------------------------------------------------

   ───────────────────────────────────────────────────────────── */

    rice: {
      key: 'rice', name: '大白饭', tag: '饭', color: '#f6f1e2', accent: '#c9c0a4',
      rule: '直接吃掉，数值加上饭的数值：<code>x + 数值</code>',
      intro: '大白饭是这个世界的基础食粮。吃掉它，你的数值就会增加。',
      example: 'x + 3'
    },
    bowl_rice: {
      key: 'bowl_rice', name: '铁盆大白饭', tag: '盆', color: '#cfd6e2', accent: '#8b95a8',
      rule: '等同于大白饭，额外获得一个<code>铁盆</code>，并改变大肥鱼形象。<br>铁盆可免疫一次失败：元素不消失、数值不变、大肥鱼被弹出，最多同时持有 1 个。',
      intro: '带铁盆的大白饭！吃掉它既能加数值，又能顶一个铁盆在头上。铁盆能替你挡一次致命失败。',
      example: 'x + 8 ，并获得铁盆'
    },
    token: {
      key: 'token', name: 'token', tag: 'T', color: '#ffce5c', accent: '#a97b16',
      rule: '任意复杂运算：把大肥鱼的数值<code>直接变成表达式的计算结果</code>。',
      intro: 'token 是一枚改写命运的硬币：它不听你现在的数值，直接把你的数值改写成表达式的结果。',

    },
    claude: {

      rule: '倍乘运算：<code>x = x * 倍率</code>',

      intro: '有些通关格藏在地板里，只有数值足够高时才会显形。别漏看脚下的路。',

  var ORDER = ['rice', 'bowl_rice', 'token', 'claude', 'user', 'door', 'goal', 'hidden'];

  /* ── 工具 ─────────────────────────────────────────────── */
  function fnum(v) { return E.fmtNum(v); }

  /** 门 / 终点门的运算结果 */
  function doorValue(v, el) {

      case 'div': return '⌊x ÷ ' + fnum(el.divisor || 1) + '⌋';

      case 'expr': return el.expr;

  function describe(el) {
    switch (el.type) {
      case 'rice': return '吃掉 +' + fnum(el.value) + '　(x + ' + fnum(el.value) + ')';
      case 'bowl_rice': return '吃掉 +' + fnum(el.value) + '，并获得铁盆　(x + ' + fnum(el.value) + ')';
      case 'token': return 'x = ' + el.expr;
      case 'claude': return 'x = x × ' + fnum(el.factor);
      case 'user': {
        var pen = (typeof el.penalty === 'number') ? el.penalty : el.bonus;
        return '若 (' + el.cond + ') 则 +' + fnum(el.bonus) + '，否则 −' + fnum(pen);
      }
      case 'door': return doorTierName(el) + '　需 x ≥ ' + fnum(el.req) + '　通过后 x = ' + doorFormula(el);
      case 'goal': return '终点门　需 x ≥ ' + fnum(el.req) + (el.op && el.op !== 'none' ? '　通过后 x = ' + doorFormula(el) : '');
      case 'hidden': return '隐藏通关格　x ≥ ' + fnum(el.reveal) + ' 显形，需 x ≥ ' + fnum(el.req);
      default: return '';
    }
  }

  /** 元素在图鉴里展示的"表达式"（用于自适应气泡宽度） */

    switch (el.type) {
      case 'rice': return 'x + ' + fnum(el.value);
      case 'bowl_rice': return 'x + ' + fnum(el.value) + '  +🥣';
      case 'token': return 'x = ' + el.expr;
      case 'claude': return 'x × ' + fnum(el.factor);
      case 'user': return '(' + el.cond + ') ? x+' + fnum(el.bonus) + ' : x−' + fnum(typeof el.penalty === 'number' ? el.penalty : el.bonus);
      case 'door': return doorFormula(el) + '　≥' + fnum(el.req);
      case 'goal': return '≥' + fnum(el.req);
      case 'hidden': return '≥' + fnum(el.req) + ' (显形 ' + fnum(el.reveal) + ')';
      default: return '';
    }
  }

  /* ── 核心：把一个元素作用到当前状态上 ─────────────────────
     state: {value, bowl, has(type)}
     返回：

        if (!isFinite(dv)) {
          return { kind: 'door', consume: true, value: v, bowl: bowl, win: false, fatal: false, error: '门的表达式无法求值',
            detail: { title: '门出现了故障', formula: String(el.expr) } };
        }
        return res('door', dv, bowl, false, {
          title: doorTierName(el) + ' 开启',
          from: v, to: dv, delta: E.sanitize(dv - v), tier: doorTier(el),
          formula: 'x ≥ ' + fnum(el.req) + ' ✔　x → ' + doorFormula(el)

      case 'goal': {
        if (!(v >= el.req)) {
          return fail('goal', el, {
            title: '终点门判定失败',
            reason: '数值不足',
            need: el.req, have: v,
            formula: '需要 x ≥ ' + fnum(el.req) + '，当前 x = ' + fnum(v)

  }

      kind: kind, consume: false, value: null, bowl: false,
      win: false, fatal: true, element: el, detail: detail || {}

  }

  /** 铁盆免疫：元素不消失、数值不变、弹出碰撞范围 */

        title: '铁盆碎了！',
        text: '铁盆替你挡下了这次失败：数值不变，' + (TYPES[el.type] ? TYPES[el.type].name : '元素') + '还在原地。',

  /* ── 校验单个元素定义（关卡自检用） ───────────────────── */

    };

      case 'rice': case 'bowl_rice':
        num('value');
        if (typeof el.value === 'number' && el.value <= 0) errs.push('大白饭数值必须 > 0（否则吃掉必然失败）');
        break;
      case 'token': {
        if (typeof el.expr !== 'string' || !el.expr.trim()) { errs.push('token 缺少表达式 expr'); break; }
        var c = E.check(el.expr);

        else if (!E.usesX(el.expr)) errs.push('token 表达式未引用变量 x：' + el.expr);

        break;

      }
      case 'goal': {
        num('req', 0);
        if (el.op === 'sub') num('amount', 0);
        else if (el.op === 'div') num('divisor', 2);
        else if (el.op === 'expr') { var cg = E.check(el.expr); if (!cg.ok) errs.push('终点门表达式非法：' + cg.error); }
        break;
      }
      case 'hidden':
        num('req', 0); num('reveal', 0);
        if (el.reveal < el.req) errs.push('hidden.reveal 应 ≥ req');
        break;
    }

  /** 门的运算是否"一定减少"：在采样区间里检查 f(x) < x */
  function checkDoorDecreasing(el, lo, hi) {
    var bad = [];
    var samples = [];
    var step = Math.max(1, Math.floor((hi - lo) / 400));
    for (var v = lo; v <= hi; v += step) samples.push(v);
    samples.push(hi);
    for (var i = 0; i < samples.length; i++) {
      var x = samples[i];
      if (x < el.req) continue;
      var y = doorValue(x, el);
      if (!isFinite(y)) { bad.push({ x: x, y: y, why: '结果非有限值' }); continue; }
      if (!(y < x)) bad.push({ x: x, y: y, why: '未减少' });
    }
    return bad;
  }

  G.rules = {
    TYPES: TYPES,
    ORDER: ORDER,
    apply: apply,
    bowlBlock: bowlBlock,
    doorValue: doorValue,
    doorFormula: doorFormula,
    doorTier: doorTier,
    doorTierName: doorTierName,
    describe: describe,
    formula: formula,

<script>
/* ─────────────────────────────────────────────────────────────
   map.js —— 关卡地图构建器 + 校验器
   ------------------------------------------------------------------
   设计方法（对应策划案第 9 节）：
     1) 用二维数组 A 画房间：只描述「墙 / 地板」，不管元素。
     2) 用二维数组 B 给 A 里的格子写元素注释，legend 表说明每个字符是什么。
     3) 房间之间用走廊连接，走廊中点放「中转站门」，门把两个房间隔开。
     4) 按答案设计：solution 里写清楚达标路线要吃的元素顺序，
        校验器按真实规则模拟这条路线，把到达终点时的数值作为通关门槛标准值。
   ------------------------------------------------------------------
   A 约定： '#' 墙   '.' 地板   ' ' 虚空（房间外）
   B 约定： '.' 无元素，其余字符查 legend（同一字符可对应多个元素实例）
   ───────────────────────────────────────────────────────────── */
(function (G) {
  'use strict';

  var VOID = 0, WALL = 1, FLOOR = 2;

  /* ── 可复现随机数 ─────────────────────────────────────── */
  function mulberry32(a) {
    return function () {

  /* ── 形状判定 ─────────────────────────────────────────── */
  function baseShapeInside(shape, lx, ly, w, h, room) {
    var k;
    switch (shape) {
      case 'round':                  /* 切四个角 */
        k = room.k || Math.max(1, Math.floor(Math.min(w, h) / 4));
        if (lx + ly < k) return false;
        if ((w - 1 - lx) + ly < k) return false;
        if (lx + (h - 1 - ly) < k) return false;
        if ((w - 1 - lx) + (h - 1 - ly) < k) return false;
        return true;
      case 'diamond':
        return (Math.abs(lx - (w - 1) / 2) / ((w - 1) / 2 || 1) +
                Math.abs(ly - (h - 1) / 2) / ((h - 1) / 2 || 1)) <= 1.02;
      case 'plus': {
        var aw = Math.max(1, Math.round(w * 0.34)), ah = Math.max(1, Math.round(h * 0.34));
        var cx0 = Math.floor((w - aw) / 2), cy0 = Math.floor((h - ah) / 2);
        var inH = (ly >= cy0 && ly < cy0 + ah);
        var inV = (lx >= cx0 && lx < cx0 + aw);
        return inH || inV;
      }
      case 'cross': {
        var t = Math.max(1, Math.round(Math.min(w, h) * 0.3));
        var inH2 = (ly >= Math.floor((h - t) / 2) && ly < Math.floor((h - t) / 2) + t);
        var inV2 = (lx >= Math.floor((w - t) / 2) && lx < Math.floor((w - t) / 2) + t);
        return inH2 || inV2;
      }
      case 'blob': {
        var rnd = mulberry32(room.seed || 1);
        var bites = [];
        for (var i = 0; i < 3; i++) bites.push([rnd(), rnd(), 0.18 + rnd() * 0.18]);
        for (var b = 0; b < bites.length; b++) {
          var nx = bites[b][0] * w, ny = bites[b][1] * h, r = bites[b][2] * Math.min(w, h);
          if ((lx - nx) * (lx - nx) + (ly - ny) * (ly - ny) < r * r) return false;
        }
        return true;
      }
      case 'rect':
      default:
        return true;
    }
  }

  function roomCellTest(room, lx, ly, w, h) {
    if (lx < 0 || ly < 0 || lx >= w || ly >= h) return false;
    if (!baseShapeInside(room.shape || 'rect', lx, ly, w, h, room)) return false;
    var cuts = room.cuts || [];
    for (var i = 0; i < cuts.length; i++) {
      var c = cuts[i], cw = c.wh[0], ch = c.wh[1];
      if (lx >= c.at[0] && lx < c.at[0] + cw && ly >= c.at[1] && ly < c.at[1] + ch) return false;
    }
    return true;
  }

  /* ── 建图主流程 ───────────────────────────────────────── */
  function buildLevel(spec) {
    var W = spec.size[0], H = spec.size[1];
    var grid = new Uint8Array(W * H);            /* 0 void 1 wall 2 floor */
    var idx = function (x, y) { return y * W + x; };
    var inb = function (x, y) { return x >= 0 && y >= 0 && x < W && y < H; };
    var at = function (x, y) { return inb(x, y) ? grid[idx(x, y)] : VOID; };
    var setFloor = function (x, y) { if (inb(x, y)) grid[idx(x, y)] = FLOOR; };

    var rooms = [], roomById = {};
    (spec.rooms || []).forEach(function (rs) {
      var r = {
        id: rs.id, name: rs.name || rs.id, at: rs.at.slice(), wh: rs.wh.slice(),
        shape: rs.shape || 'rect', k: rs.k, cuts: rs.cuts || [], seed: rs.seed,
        color: rs.color || null, fill: rs.fill || null,
        cells: [], bounds: null, doors: []
      };
      rooms.push(r); roomById[r.id] = r;

      var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
      for (var ly = 0; ly < r.wh[1]; ly++) {
        for (var lx = 0; lx < r.wh[0]; lx++) {
          if (!roomCellTest(r, lx, ly, r.wh[0], r.wh[1])) continue;
          var gx = r.at[0] + lx, gy = r.at[1] + ly;
          if (!inb(gx, gy)) continue;
          setFloor(gx, gy);
          r.cells.push(idx(gx, gy));
          if (gx < minX) minX = gx; if (gx > maxX) maxX = gx;
          if (gy < minY) minY = gy; if (gy > maxY) maxY = gy;
        }
      }
      r.bounds = [minX, minY, maxX, maxY];
      if (!r.cells.length) throw new Error('房间 ' + r.id + ' 没有任何地板格（检查 at/wh/shape）');
    });

    /* ── 走廊 + 门 ─────────────────────────────────────── */
    var corridorPaths = [];                       /* 每条走廊的格子序列 */
    var doors = [];

    function cellCenter(r) {
      var b = r.bounds;
      return [Math.round((b[0] + b[2]) / 2), Math.round((b[1] + b[3]) / 2)];
    }
    /* 房间边缘候选锚点：地板格且八邻域里存在非地板 */
    function edgeCells(r) {
      var out = [];
      r.cells.forEach(function (i) {
        var x = i % W, y = (i - x) / W, edge = false;
        for (var dy = -1; dy <= 1 && !edge; dy++)
          for (var dx = -1; dx <= 1; dx++) {
            if (!dx && !dy) continue;
            if (at(x + dx, y + dy) !== FLOOR) { edge = true; break; }
          }
        if (edge) out.push([x, y]);
      });
      /* 房间太小时退回全部地板格 */
      return out.length ? out : r.cells.map(function (i) { return [i % W, (i - (i % W)) / W]; });
    }

    function carvePath(pts) {
      pts.forEach(function (p) { setFloor(p[0], p[1]); });
    }

    function pathBetween(a, b, bend) {
      /* 从 a 到 b 的 L 形走廊：先横后竖(hv) 或 先竖后横(vh) */
      var pts = [], x = a[0], y = a[1];
      pts.push([x, y]);
      if (bend === 'vh') {
        while (y !== b[1]) { y += y < b[1] ? 1 : -1; pts.push([x, y]); }
        while (x !== b[0]) { x += x < b[0] ? 1 : -1; pts.push([x, y]); }
      } else {
        while (x !== b[0]) { x += x < b[0] ? 1 : -1; pts.push([x, y]); }
        while (y !== b[1]) { y += y < b[1] ? 1 : -1; pts.push([x, y]); }
      }
      return pts;
    }

    /* 检查走廊是否穿过了"其它房间"的内部（会破坏门的分隔性） */
    function pathHitsOtherRoom(pts, ra, rb) {
      for (var i = 1; i < pts.length - 1; i++) {
        for (var r = 0; r < rooms.length; r++) {
          var rm = rooms[r];
          if (rm === ra || rm === rb) continue;
          if (containsCell(rm, pts[i][0], pts[i][1])) return true;
        }
      }
      return false;
    }
    function containsCell(r, x, y) {
      var lx = x - r.at[0], ly = y - r.at[1];
      return roomCellTest(r, lx, ly, r.wh[0], r.wh[1]);
    }

    (spec.links || []).forEach(function (lk, li) {
      var ra = roomById[lk.a], rb = roomById[lk.b];
      if (!ra || !rb) throw new Error('link ' + li + ' 引用了不存在的房间：' + lk.a + ' / ' + lk.b);
      var ea = lk.via && lk.via.length ? [lk.via[0]] : edgeCells(ra);
      var eb = lk.via && lk.via.length ? [lk.via[lk.via.length - 1]] : edgeCells(rb);

      /* 候选：按曼哈顿距离排序，挑不撞其它房间的走法 */
      var cands = [];
      for (var i = 0; i < ea.length; i++) {
        for (var j = 0; j < eb.length; j++) {
          cands.push({ a: ea[i], b: eb[j], d: Math.abs(ea[i][0] - eb[j][0]) + Math.abs(ea[i][1] - eb[j][1]) });
        }
      }
      cands.sort(function (p, q) { return p.d - q.d; });
      var best = null, fallback = null;
      var limit = Math.min(cands.length, 260);
      for (var c = 0; c < limit; c++) {
        var cand = cands[c];
        if (cand.a[0] === cand.b[0] && cand.a[1] === cand.b[1]) continue;
        ['hv', 'vh'].forEach(function (bend) {
          if (best) return;
          var pts = pathBetween(cand.a, cand.b, bend);
          if (!fallback) fallback = pts;
          if (!pathHitsOtherRoom(pts, ra, rb)) best = pts;
        });
        if (best) break;
      }
      var pts = best || fallback;
      if (!pts) throw new Error('link ' + lk.a + '→' + lk.b + ' 无法生成走廊');
      carvePath(pts);
      corridorPaths.push({ pts: pts, a: ra.id, b: rb.id });

      /* 门放在走廊中段，且必须落在两个房间之外 */
      var doorCell = null, mid = Math.floor(pts.length / 2);
      var order = [];
      for (var s = 0; s < pts.length; s++) order.push(s);
      order.sort(function (p, q) { return Math.abs(p - mid) - Math.abs(q - mid); });
      for (var oi = 0; oi < order.length; oi++) {
        var pi = order[oi];
        if (pi === 0 || pi === pts.length - 1) continue;         /* 端点属于房间内部 */
        var pc = pts[pi];
        if (containsCell(ra, pc[0], pc[1]) || containsCell(rb, pc[0], pc[1])) continue;
        var okDist = true;
        for (var d = 0; d < doors.length; d++) {
          if (Math.max(Math.abs(doors[d].x - pc[0]), Math.abs(doors[d].y - pc[1])) < 3) { okDist = false; break; }
        }
        if (!okDist) continue;
        doorCell = pc;
        break;
      }
      if (!doorCell) {
        for (var oi2 = 0; oi2 < order.length; oi2++) {
          var pi2 = order[oi2];
          if (pi2 === 0 || pi2 === pts.length - 1) continue;
          var pc2 = pts[pi2];
          if (containsCell(ra, pc2[0], pc2[1]) || containsCell(rb, pc2[0], pc2[1])) continue;
          doorCell = pc2; break;
        }
      }
      if (!doorCell) throw new Error('link ' + lk.a + '→' + lk.b + ' 找不到合适放门的位置');

      var doorEl = Object.assign({}, lk.door || {});
      doorEl.type = doorEl.type || 'door';
      doorEl.id = doorEl.id || ('door_' + lk.a + '_' + lk.b);
      doorEl.x = doorCell[0]; doorEl.y = doorCell[1];
      doorEl.roomA = ra.id; doorEl.roomB = rb.id;
      doorEl.link = li;
      doors.push(doorEl);
      ra.doors.push(doorEl.id); rb.doors.push(doorEl.id);
      doorEl.anchorA = nearestRoomCell(ra, doorCell);
      doorEl.anchorB = nearestRoomCell(rb, doorCell);
      doorEl.corridor = pts;
    });

    function nearestRoomCell(r, p) {
      var best = null, bd = 1e9;
      for (var i = 0; i < r.cells.length; i++) {
        var x = r.cells[i] % W, y = (r.cells[i] - x) / W;
        var d = Math.abs(x - p[0]) + Math.abs(y - p[1]);
        if (d < bd) { bd = d; best = [x, y]; }
      }
      return best;
    }

    /* ── 补齐墙体：紧贴地板的虚空变成墙 ─────────────────── */
    for (var y2 = 0; y2 < H; y2++) {
      for (var x2 = 0; x2 < W; x2++) {
        if (grid[idx(x2, y2)] !== VOID) continue;
        var touch = false;
        for (var dy = -1; dy <= 1 && !touch; dy++)
          for (var dx = -1; dx <= 1; dx++) {
            if (!dx && !dy) continue;
            if (at(x2 + dx, y2 + dy) === FLOOR) { touch = true; break; }
          }
        if (touch) grid[idx(x2, y2)] = WALL;
      }
    }

    /* ── 元素收集 ───────────────────────────────────────── */
    var elements = [];
    var usedIds = {};
    var placed = {};
    var relocations = [];
    var seedBase = spec.seed || (spec.id * 7919 + 13);

    function addElement(el, where) {
      if (!el.id) el.id = (el.type || 'el') + '_' + elements.length;
      if (usedIds[el.id]) throw new Error('元素 id 重复：' + el.id + '（' + where + '）');
      usedIds[el.id] = true;
      elements.push(el);
      return el;
    }

    /** 把元素挪到"同一房间内最近的空地板格"；返回是否挪动过 */
    function ensurePlaceable(el, room) {
      var k = (inb(el.x, el.y)) ? (el.y * W + el.x) : -1;
      if (k >= 0 && grid[k] === FLOOR && !placed[k] && (!room || containsCell(room, el.x, el.y))) {
        placed[k] = true;
        return false;
      }
      var best = null, bd = 1e9;
      for (var yy = 1; yy < H - 1; yy++) {
        for (var xx = 1; xx < W - 1; xx++) {
          var kk = yy * W + xx;
          if (grid[kk] !== FLOOR || placed[kk]) continue;
          if (room && !containsCell(room, xx, yy)) continue;
          var d = Math.abs(xx - el.x) + Math.abs(yy - el.y);
          if (d < bd) { bd = d; best = [xx, yy]; }
        }
      }
      if (!best) {
        /* 房间内实在没位置就退到全图任意空地板格 */
        for (var y2 = 1; y2 < H - 1 && !best; y2++)
          for (var x2 = 1; x2 < W - 1; x2++) {
            var k2 = y2 * W + x2;
            if (grid[k2] === FLOOR && !placed[k2]) { best = [x2, y2]; break; }
          }
      }
      if (!best) throw new Error('元素 ' + el.id + ' 找不到可以放的地板格');
      relocations.push(el.id + ' ' + el.x + ',' + el.y + ' → ' + best[0] + ',' + best[1]);
      el.relocated = { from: [el.x, el.y], to: best.slice() };
      el.x = best[0]; el.y = best[1];
      placed[best[1] * W + best[0]] = true;
      return true;
    }

    /* 门的元素定义已经在走廊里建好了，这里统一登记 */
    doors.forEach(function (d) {
      placed[d.y * W + d.x] = true;
      addElement({
        id: d.id, type: d.type, x: d.x, y: d.y,
        op: d.op, amount: d.amount, divisor: d.divisor, expr: d.expr, factor: d.factor, req: d.req,
        roomA: d.roomA, roomB: d.roomB, anchorA: d.anchorA, anchorB: d.anchorB,
        tier: G.rules.doorTier(d), label: d.label, isDoor: true
      }, 'door');
    });

    /* 关卡里手写的元素 */
    (spec.elements || []).forEach(function (es) {
      var el = Object.assign({}, es);
      var room = null;
      if (el.room) {
        room = roomById[el.room];
        if (!room) throw new Error('元素 ' + el.id + ' 引用了不存在的房间 ' + el.room);
        el.x = room.at[0] + el.at[0];
        el.y = room.at[1] + el.at[1];
        delete el.at;
      }
      ensurePlaceable(el, room);
      addElement(el, 'elements');
    });

    /* ── 起点 ───────────────────────────────────────────── */
    var start = { x: 0, y: 0 };
    if (spec.start) {
      var sr = roomById[spec.start.room];
      if (!sr) throw new Error('start 引用了不存在的房间 ' + spec.start.room);
      start.x = sr.at[0] + (spec.start.at ? spec.start.at[0] : Math.floor(sr.wh[0] / 2));
      start.y = sr.at[1] + (spec.start.at ? spec.start.at[1] : Math.floor(sr.wh[1] / 2));
    } else {
      start.x = rooms[0].at[0] + 1; start.y = rooms[0].at[1] + 1;
    }
    ensurePlaceable(start, spec.start ? roomById[spec.start.room] : null);

    /* ── 填充白饭（房间元素密度 10%~30%） ────────────────── */
    var fillCfg = spec.fill || null;
    var rng = mulberry32(seedBase);
    if (fillCfg && fillCfg.type !== 'none') {
      var fType = fillCfg.type || 'rice';
      var fValue = typeof fillCfg.value === 'number' ? fillCfg.value : 1;
      var clearance = typeof fillCfg.clearance === 'number' ? fillCfg.clearance : 0;
      rooms.forEach(function (r) {
        var local = r.fill || {};
        var dens = typeof local.density === 'number' ? local.density
                 : (typeof fillCfg.density === 'number' ? fillCfg.density : 0.15);
        if (local.type === 'none' || dens <= 0) return;

        var occupied = {};
        elements.forEach(function (e) { occupied[e.y * W + e.x] = true; });
        occupied[start.y * W + start.x] = true;

        var specials = elements.filter(function (e) {
          return containsCell(r, e.x, e.y);
        });

        /* 特殊元素周围留白，避免谜题被饭粒糊住 */
        var blocked = {};
        if (clearance > 0) {
          specials.forEach(function (e) {
            for (var dy = -clearance; dy <= clearance; dy++)
              for (var dx = -clearance; dx <= clearance; dx++) {
                if (!inb(e.x + dx, e.y + dy)) continue;
                blocked[(e.y + dy) * W + (e.x + dx)] = true;
              }
          });
        }

        var cands = [];
        r.cells.forEach(function (i) {
          if (occupied[i] || blocked[i]) return;
          cands.push(i);
        });
        /* 洗牌（可复现） */
        for (var s = cands.length - 1; s > 0; s--) {
          var t = Math.floor(rng() * (s + 1));
          var tmp = cands[s]; cands[s] = cands[t]; cands[t] = tmp;
        }
        var want = Math.round(r.cells.length * dens) - specials.length;
        if (want < 0) want = 0;
        var roomValue = typeof local.value === 'number' ? local.value : fValue;
        var placed = 0;
        for (var p = 0; p < cands.length && placed < want; p++) {
          var ci = cands[p], cx = ci % W, cy = (ci - cx) / W;
          elements.push({
            id: 'fill_' + r.id + '_' + placed, type: fType, value: roomValue == null ? 1 : roomValue,
            x: cx, y: cy, room: r.id, filler: true
          });
          occupied[ci] = true;
          placed++;
        }
        /* 密度兜底：留白太多导致铺不满时，把"特殊元素旁边"的格子也用上，
           保证每个房间的元素密度都落在 (10%, 30%) 区间里 */
        if (placed < want) {
          var extra = [];
          r.cells.forEach(function (i) { if (!occupied[i]) extra.push(i); });
          for (var s2 = extra.length - 1; s2 > 0; s2--) {
            var t2 = Math.floor(rng() * (s2 + 1));
            var tm2 = extra[s2]; extra[s2] = extra[t2]; extra[t2] = tm2;
          }
          for (var p2 = 0; p2 < extra.length && placed < want; p2++) {
            var ci2 = extra[p2], cx2 = ci2 % W, cy2 = (ci2 - cx2) / W;
            elements.push({
              id: 'fill_' + r.id + '_' + placed, type: fType, value: roomValue == null ? 1 : roomValue,
              x: cx2, y: cy2, room: r.id, filler: true
            });
            occupied[ci2] = true;
            placed++;
          }
        }
      });
    }

    /* ── 组装 level 对象 ────────────────────────────────── */
    var level = {
      id: spec.id, name: spec.name, subtitle: spec.subtitle || '',
      tier: spec.tier || '', w: W, h: H,
      spec: spec,
      tiles: grid,
      rooms: rooms.slice(),
      roomById: roomById,
      corridors: corridorPaths,
      elements: elements,
      start: start,
      relocations: relocations,
      solution: spec.solution || [],
      intro: spec.intro || [],
      hint: spec.hint || '',
      tips: spec.tips || [],
      cellMap: {},
      meta: {
        seed: seedBase,
        sizeClass: spec.sizeClass || (W + 'x' + H),
        doorCount: doors.length
      }
    };

    elements.forEach(function (el) {
      if (!inb(el.x, el.y)) throw new Error('元素 ' + el.id + ' 坐标越界：' + el.x + ',' + el.y);
      if (grid[idx(el.x, el.y)] !== FLOOR) throw new Error('元素 ' + el.id + ' 没有放在地板上：' + el.x + ',' + el.y + '（' + el.type + '）');
      var key = el.y * W + el.x;
      if (level.cellMap[key]) throw new Error('元素重叠：' + el.id + ' 和 ' + level.cellMap[key].id + ' 都在 ' + el.x + ',' + el.y);
      level.cellMap[key] = el;
    });
    if (grid[idx(start.x, start.y)] !== FLOOR) throw new Error('起点不在房间地板上：' + start.x + ',' + start.y);

    level.doors = elements.filter(function (e) { return e.isDoor; });
    level.goal = elements.filter(function (e) { return e.type === 'goal' || e.type === 'hidden'; })[0] || null;

    /* ── 导出二维数组 A / B ─────────────────────────────── */
    level.A = [];
    level.B = [];
    var annotPool = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
    var legend = {};
    var poolPos = 0;
    var charByEl = {};
    elements.forEach(function (el) {
      var ch;
      if (el.filler) ch = 'r';
      else if (el.type === 'goal') ch = 'G';
      else if (el.type === 'hidden') ch = 'H';
      else if (el.isDoor) ch = 'D';
      else {
        ch = annotPool.charAt(poolPos % annotPool.length);
        poolPos++;
        if (ch === 'r') { ch = annotPool.charAt(poolPos % annotPool.length); poolPos++; }
      }
      charByEl[el.id] = ch;
      (legend[ch] = legend[ch] || []).push(el);
    });
    for (var y3 = 0; y3 < H; y3++) {
      var ra = '', rb = '';
      for (var x3 = 0; x3 < W; x3++) {
        var t = grid[idx(x3, y3)];
        ra += t === FLOOR ? '.' : (t === WALL ? '#' : ' ');
        var el2 = level.cellMap[y3 * W + x3];
        rb += el2 ? charByEl[el2.id] : '.';
      }
      level.A.push(ra);
      level.B.push(rb);
    }
    level.legend = legend;
    level.charByEl = charByEl;

    return level;
  }

  /* ── 校验 ─────────────────────────────────────────────── */
  function validate(level) {
    var W = level.w, H = level.h, grid = level.tiles;
    var idx = function (x, y) { return y * W + x; };
    var inb = function (x, y) { return x >= 0 && y >= 0 && x < W && y < H; };
    var errors = [], warns = [], info = {};

    /* 1. 元素定义合法性 */
    level.elements.forEach(function (el) {
      var errs = G.rules.checkElement(el);
      errs.forEach(function (e) { errors.push('[' + level.id + '] ' + e + ' @' + el.x + ',' + el.y); });
    });

    /* 2. 门：不重叠、不相邻、分隔两个房间、可互相到达 */
    var doors = level.doors;

    var bowl = !!o.bowl;
    var dead = !!o.dead;
    var blind = !!o.blink;
    var facing = o.facing;
    if (facing !== 'up' && facing !== 'down' && facing !== 'left' && facing !== 'right') facing = 'down';
    var value = num(o.value, 0);

    /* ── 动画参数：全部由 t 驱动 ─────────────────────────── */
    var bob = moving ? Math.sin(t * 9.0) * 0.02 : Math.sin(t * 2.1) * 0.06;   /* 待机 ±6% s */
    var sq = moving ? Math.sin(t * 11.0) : 0;
    var br = Math.sin(t * 2.1) * 0.02;
    var sx = moving ? 1 + 0.07 * sq : 1 + br;
    var sy = moving ? 1 - 0.07 * sq : 1 - br;
    if (value > 999) sx *= 1.10;                                             /* 数值太大 → 撑胖一点 */
    var roll = moving ? Math.sin(t * 7.5) * 0.055 : Math.sin(t * 1.6) * 0.02;
    var tilt = facing === 'up' ? -0.20 : (facing === 'down' ? 0.14 : 0);
    if (dead) roll += Math.sin(t * 1.7) * 0.12 - 0.10;
    var shakeX = hurt > 0 ? Math.sin(t * 52) * 0.045 * hurt : 0;
    var shakeY = hurt > 0 ? Math.cos(t * 61) * 0.035 * hurt : 0;

    ctx.translate(shakeX, bob + shakeY);
    ctx.rotate(roll + tilt);
    ctx.scale(sx, sy);

    /* ── 水下投影 ─────────────────────────────────────────── */
    if (px >= 20) {
      ctx.globalAlpha = A * 0.22;
      ctx.fillStyle = '#04070f';
      epath(ctx, 0, 0.47 - bob, 0.33, 0.06);
      ctx.fill();
      ctx.globalAlpha = A;
    }

    var wag = Math.sin(t * (moving ? 10 : 2.4)) * (moving ? 0.34 : 0.17);
    var tailDip = facing === 'up' ? 0.28 : (facing === 'down' ? -0.24 : 0);

    /* ── 尾鳍（月牙，画在身体后） ─────────────────────────── */
    ctx.save();
    ctx.translate(-0.30, 0.03);
    ctx.rotate(wag * 0.55 + tailDip * 0.5 + (dead ? 0.18 : 0));
    ctx.beginPath();
    ctx.moveTo(0.02, 0);
    ctx.quadraticCurveTo(-0.12, -0.11, -0.23, -0.31);
    ctx.quadraticCurveTo(-0.10, -0.06, -0.05, 0.00);
    ctx.quadraticCurveTo(-0.10, 0.07, -0.23, 0.31);
    ctx.quadraticCurveTo(-0.12, 0.11, 0.02, 0);
    ctx.closePath();
    ctx.fillStyle = finGrad(ctx);
    ctx.fill();
    ctx.globalAlpha = A * 0.35;
    ctx.fillStyle = '#8ec2ff';
    ctx.beginPath();
    ctx.moveTo(-0.02, -0.01);
    ctx.quadraticCurveTo(-0.10, -0.08, -0.18, -0.22);
    ctx.quadraticCurveTo(-0.09, -0.05, -0.04, 0.0);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = A;
    ctx.restore();

    /* ── 背鳍 ─────────────────────────────────────────────── */
    ctx.save();
    ctx.translate(-0.03, -0.30);
    ctx.rotate(Math.sin(t * 3.1) * 0.06 + tailDip * 0.2);
    ctx.beginPath();
    ctx.moveTo(-0.10, 0.03);
    ctx.quadraticCurveTo(-0.02, -0.24, 0.16, 0.02);
    ctx.quadraticCurveTo(0.03, -0.03, -0.10, 0.03);
    ctx.closePath();
    ctx.fillStyle = finGrad(ctx);
    ctx.fill();
    ctx.restore();

    /* ── 身体 ─────────────────────────────────────────────── */
    fishBodyPath(ctx);
    ctx.fillStyle = fishGrad(ctx, bowl);
    ctx.fill();

    /* 肚皮（裁剪在身体内的米白） */
    ctx.save();
    fishBodyPath(ctx);
    ctx.clip();
    ctx.fillStyle = C.rice;
    epath(ctx, 0.06, 0.235, 0.35, 0.20);
    ctx.fill();
    ctx.globalAlpha = A * 0.55;
    ctx.fillStyle = '#ffffff';
    epath(ctx, 0.10, 0.18, 0.27, 0.10);
    ctx.fill();
    ctx.globalAlpha = A;
    if (px >= DETAIL_S) {
      /* 肚皮褶 */
      ctx.strokeStyle = 'rgba(185,176,150,0.55)';
      lw(ctx, px, 0.012, 0.6);
      for (var i = 0; i < 3; i++) {
        var gx = -0.16 + i * 0.16;
        ctx.beginPath();
        ctx.moveTo(gx, 0.13);
        ctx.quadraticCurveTo(gx + 0.02, 0.24, gx - 0.01, 0.34);
        ctx.stroke();
      }
    }
    /* 背部高光 */
    ctx.globalAlpha = A * 0.22;
    ctx.fillStyle = '#ffffff';
    epathRot(ctx, 0.14, -0.26, 0.22, 0.075, -0.30);
    ctx.fill();
    ctx.globalAlpha = A;
    /* 盆沿压在头上的阴影 */
    if (bowl) {
      ctx.globalAlpha = A * 0.30;
      ctx.fillStyle = '#050a14';
      epath(ctx, 0.04, -0.24, 0.30, 0.075);
      ctx.fill();
      ctx.globalAlpha = A;
    }
    ctx.restore();

    /* ── 胸鳍 ─────────────────────────────────────────────── */
    var flap = Math.sin(t * (moving ? 8.5 : 2.2)) * 0.22;
    ctx.save();
    ctx.translate(0.12, 0.14);
    ctx.rotate(0.55 + flap);
    ctx.fillStyle = finGrad(ctx);
    epath(ctx, 0, 0, 0.115, 0.058);
    ctx.fill();
    ctx.restore();
    if (!moving) {
      ctx.save();
      ctx.translate(-0.12, 0.12);
      ctx.rotate(0.35 - flap * 0.7);
      ctx.globalAlpha = A * 0.85;
      ctx.fillStyle = finGrad(ctx);
      epath(ctx, 0, 0, 0.095, 0.05);
      ctx.fill();
      ctx.restore();
      ctx.globalAlpha = A;
    }

    /* ── 眼睛 / 嘴 / 腮红 ─────────────────────────────────── */
    var eyeShift = facing === 'up' ? -0.075 : (facing === 'down' ? 0.05 : 0);
    var eyeK = facing === 'up' ? 0.86 : (facing === 'down' ? 0.96 : 1);
    var eyeY = -0.07 + eyeShift;
    var closed = blind || (t % 3.7) > 3.58;
    var squint = bowl && !closed;
    var eyesX = (hurt > 0.35 || dead);
    if (eyesX) {
      fishEyeX(ctx, px, 0.24, eyeY + 0.01, 0.085 * eyeK);
      fishEyeX(ctx, px, 0.02, eyeY - 0.01, 0.075 * eyeK);
    } else {
      fishEye(ctx, px, 0.24, eyeY + 0.01, 0.10 * eyeK, closed, squint);
      fishEye(ctx, px, 0.02, eyeY - 0.01, 0.086 * eyeK, closed, squint);
    }
    /* 嘴 */
    if (dead || hurt > 0.6) {
      ctx.fillStyle = '#3d1420';
      epath(ctx, 0.355, 0.075, 0.045, 0.055);
      ctx.fill();
    } else if (squint) {
      ctx.strokeStyle = 'rgba(14,28,48,0.85)';
      lw(ctx, px, 0.020, 0.9);
      ctx.beginPath();
      ctx.moveTo(0.30, 0.075); ctx.lineTo(0.40, 0.075);
      ctx.stroke();
    } else {
      ctx.strokeStyle = 'rgba(14,28,48,0.9)';
      lw(ctx, px, 0.020, 0.9);
      ctx.beginPath();
      ctx.moveTo(0.42, 0.02);
      ctx.quadraticCurveTo(0.37, 0.10, 0.29, 0.075);
      ctx.stroke();
    }
    if (px >= DETAIL_S && !eyesX) {
      ctx.globalAlpha = A * 0.30;
      ctx.fillStyle = '#ff9d8a';
      epath(ctx, 0.315, 0.145, 0.055, 0.033);
      ctx.fill();
      ctx.globalAlpha = A;
    }

    /* ── 受击：红色描边闪 ─────────────────────────────────── */
    if (hurt > 0) {
      fishBodyPath(ctx);
      ctx.strokeStyle = C.danger;
      lw(ctx, px, 0.035, 1.4);
      ctx.globalAlpha = A * (0.35 + 0.65 * hurt);
      if (px >= SHADOW_S) {
        ctx.shadowColor = 'rgba(255,93,108,0.85)';
        ctx.shadowBlur = clamp(px * 0.45 * hurt, 0, 26);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = A;
    }
    /* ── 死亡：整体偏灰 ───────────────────────────────────── */
    if (dead) {
      fishBodyPath(ctx);
      ctx.globalAlpha = A * 0.38;
      ctx.fillStyle = '#7f93b5';
      ctx.fill();
      ctx.globalAlpha = A;
    }

    /* ── 铁盆 ─────────────────────────────────────────────── */
    if (bowl) drawBasin(ctx, o, t, px);
  }

  /* ════════════════════════════════════════════════════════════
     4b. 蓝色大肥鱼 · Q 版蓝发少女（照立绘重制）
     ────────────────────────────────────────────────────────────
     造型：深蓝长卷发 + 头顶呆毛 + 白色蕾丝发带 + 发侧蓝蝴蝶结
           两侧鱼鳍耳 + 身后鲸鱼尾 + 深蓝女仆裙（白围裙绣蓝鲸）
           胸口蓝宝石领结 + 白袜深蓝小皮鞋
     铁盆形态：一整个不锈钢盆倒扣在头上，盆沿压到眉毛上方
     ════════════════════════════════════════════════════════════ */
  var G_HAIR_TOP = '#6577d4', G_HAIR_MID = '#3b479f', G_HAIR_DARK = '#1e2559';
  var G_HAIR_LIT = '#8fa2ea';
  var G_SKIN = '#ffe4d7', G_SKIN_SH = '#eec2b1';
  var G_DRESS = '#232a5e', G_DRESS_L = '#39428f';
  var G_WHITE = '#f7f8ff', G_WHITE_SH = '#cfd5ee';
  var G_EYE_TOP = '#16204e', G_EYE_MID = '#2f4cc0', G_EYE_LOW = '#7fb0ff';
  var G_GEM = '#86b6ff';
  var G_LINE = '#131a42';

  function gHairGrad(ctx) {
    var g = ctx.createLinearGradient(0, -0.50, 0.06, 0.48);
    g.addColorStop(0, G_HAIR_TOP);
    g.addColorStop(0.38, G_HAIR_MID);
    g.addColorStop(1, G_HAIR_DARK);
    return g;
  }
  function gDressGrad(ctx) {
    var g = ctx.createLinearGradient(0, -0.02, 0, 0.34);
    g.addColorStop(0, G_DRESS_L);
    g.addColorStop(1, G_DRESS);
    return g;
  }

  /* 身后的大团长发（带波浪下摆） */
  function gBackHairPath(ctx, sway) {
    ctx.beginPath();
    ctx.moveTo(0, -0.45);
    ctx.bezierCurveTo(-0.26, -0.46, -0.38, -0.28, -0.37, -0.04);
    ctx.bezierCurveTo(-0.36, 0.16, -0.35, 0.30, -0.30, 0.42 + sway * 0.03);
    ctx.quadraticCurveTo(-0.21, 0.34 + sway * 0.02, -0.13, 0.45 + sway * 0.03);
    ctx.quadraticCurveTo(-0.03, 0.35, 0.07, 0.45 + sway * 0.03);
    ctx.quadraticCurveTo(0.17, 0.34 + sway * 0.02, 0.27, 0.42 + sway * 0.03);
    ctx.bezierCurveTo(0.34, 0.28, 0.37, 0.12, 0.37, -0.06);
    ctx.bezierCurveTo(0.39, -0.28, 0.27, -0.46, 0, -0.45);
    ctx.closePath();
  }

  /* 脸（略扁的圆脸 + 小下巴） */
  function gFacePath(ctx) {
    ctx.beginPath();
    ctx.moveTo(-0.205, -0.22);
    ctx.bezierCurveTo(-0.225, -0.06, -0.17, 0.045, 0, 0.065);
    ctx.bezierCurveTo(0.17, 0.045, 0.225, -0.06, 0.205, -0.22);
    ctx.bezierCurveTo(0.19, -0.37, -0.19, -0.37, -0.205, -0.22);
    ctx.closePath();
  }

  /* 刘海（斜分 + 三个尖） */
  function gBangsPath(ctx, sway) {
    ctx.beginPath();
    ctx.moveTo(-0.225, -0.16 + sway * 0.01);
    ctx.bezierCurveTo(-0.285, -0.34, -0.16, -0.47, 0.005, -0.465);
    ctx.bezierCurveTo(0.16, -0.47, 0.285, -0.34, 0.225, -0.15 + sway * 0.01);
    ctx.quadraticCurveTo(0.175, -0.27, 0.115, -0.135);
    ctx.quadraticCurveTo(0.055, -0.28, -0.005, -0.145);
    ctx.quadraticCurveTo(-0.075, -0.285, -0.135, -0.155);
    ctx.quadraticCurveTo(-0.185, -0.28, -0.225, -0.16 + sway * 0.01);
    ctx.closePath();
  }

  /* 垂到胸前的侧发 */
  function gLockPath(ctx, dir, sway) {
    ctx.beginPath();
    ctx.moveTo(dir * 0.195, -0.24);
    ctx.bezierCurveTo(dir * 0.30, -0.08, dir * 0.315, 0.12, dir * (0.255 + sway * 0.02), 0.36 + sway * 0.02);
    ctx.quadraticCurveTo(dir * (0.16 + sway * 0.02), 0.26, dir * 0.135, 0.08);
    ctx.bezierCurveTo(dir * 0.115, -0.08, dir * 0.145, -0.19, dir * 0.195, -0.24);
    ctx.closePath();
  }

  /* 鱼鳍耳 */
  function gFinEar(ctx, px, dir, flap) {
    ctx.save();
    ctx.translate(dir * 0.185, -0.13);
    ctx.rotate(dir * (0.24 + flap));
    ctx.beginPath();
    ctx.moveTo(0, -0.035);
    ctx.quadraticCurveTo(dir * 0.155, -0.145, dir * 0.215, -0.005);
    ctx.quadraticCurveTo(dir * 0.15, 0.10, dir * 0.015, 0.065);
    ctx.closePath();
    ctx.fillStyle = finGrad(ctx);
    ctx.fill();
    if (px >= DETAIL_S) {
      ctx.strokeStyle = 'rgba(150,200,255,0.75)';
      lw(ctx, px, 0.010, 0.5);
      for (var i = 0; i < 3; i++) {
        var a = -0.30 + i * 0.30;
        ctx.beginPath();
        ctx.moveTo(dir * 0.03, 0.01);
        ctx.lineTo(dir * (0.14 + i * 0.02), Math.sin(a) * 0.075);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  /* 身后的鲸鱼尾（两瓣，会摆） */
  function gWhaleTail(ctx, px, t, moving) {
    var sw = Math.sin(t * (moving ? 9 : 2.2)) * 0.22;
    ctx.save();
    ctx.translate(0.30, 0.20);
    ctx.rotate(-0.30 + sw);
    ctx.beginPath();
    ctx.moveTo(-0.03, 0.03);
    ctx.quadraticCurveTo(0.05, -0.02, 0.11, -0.05);
    ctx.lineTo(0.075, 0.02);
    ctx.quadraticCurveTo(0.05, 0.04, -0.03, 0.03);
    ctx.closePath();
    ctx.fillStyle = '#2b3a86';
    ctx.fill();
    /* 两瓣尾鳍 */
    ctx.beginPath();
    ctx.moveTo(0.09, -0.04);
    ctx.quadraticCurveTo(0.20, -0.16, 0.235, -0.055);
    ctx.quadraticCurveTo(0.16, 0.01, 0.09, -0.02);
    ctx.closePath();
    ctx.fillStyle = '#3d55b8';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0.09, -0.02);
    ctx.quadraticCurveTo(0.19, 0.03, 0.20, 0.115);
    ctx.quadraticCurveTo(0.12, 0.06, 0.085, 0.005);
    ctx.closePath();
    ctx.fillStyle = '#31459c';
    ctx.fill();
    ctx.restore();
  }

  /* Q 版大眼睛 */
  function gEye(ctx, px, cx, cy, rx, ry, look, closed, xeye) {
    if (xeye) {
      ctx.strokeStyle = G_LINE;
      ctx.lineCap = 'round';
      lw(ctx, px, 0.026, 1);
      ctx.beginPath();
      ctx.moveTo(cx - rx * 0.8, cy - ry * 0.8); ctx.lineTo(cx + rx * 0.8, cy + ry * 0.8);
      ctx.moveTo(cx + rx * 0.8, cy - ry * 0.8); ctx.lineTo(cx - rx * 0.8, cy + ry * 0.8);
      ctx.stroke();
      return;
    }
    if (closed) {
      ctx.strokeStyle = G_LINE;
      ctx.lineCap = 'round';
      lw(ctx, px, 0.020, 1);
      ctx.beginPath();
      ctx.moveTo(cx - rx, cy - ry * 0.15);
      ctx.quadraticCurveTo(cx, cy + ry * 1.0, cx + rx, cy - ry * 0.15);
      ctx.stroke();
      return;
    }
    /* 眼白 */
    ctx.fillStyle = '#ffffff';
    epath(ctx, cx, cy, rx, ry);
    ctx.fill();
    /* 虹膜 */
    ctx.save();
    epath(ctx, cx, cy, rx, ry);
    ctx.clip();
    var g = ctx.createLinearGradient(cx, cy - ry, cx, cy + ry);
    g.addColorStop(0, G_EYE_TOP);
    g.addColorStop(0.42, G_EYE_MID);
    g.addColorStop(0.80, G_EYE_LOW);
    g.addColorStop(1, '#d8e8ff');
    ctx.fillStyle = g;
    ctx.fillRect(cx - rx, cy - ry, rx * 2, ry * 2);
    /* 瞳孔 */
    ctx.fillStyle = 'rgba(10,14,40,0.88)';
    epath(ctx, cx + look * rx * 0.22, cy + ry * 0.16, rx * 0.44, ry * 0.48);
    ctx.fill();
    /* 下部反光带 */
    ctx.fillStyle = 'rgba(200,230,255,0.72)';
    epath(ctx, cx + look * rx * 0.22, cy + ry * 0.50, rx * 0.56, ry * 0.24);
    ctx.fill();
    /* 高光两点 */
    ctx.fillStyle = '#ffffff';
    epath(ctx, cx - rx * 0.36, cy - ry * 0.44, rx * 0.34, ry * 0.28);
    ctx.fill();
    epath(ctx, cx + rx * 0.42, cy + ry * 0.26, rx * 0.18, ry * 0.15);
    ctx.fill();
    ctx.restore();
    /* 上睫毛 */
    ctx.strokeStyle = G_LINE;
    ctx.lineCap = 'round';
    lw(ctx, px, 0.020, 1);
    ctx.beginPath();
    ctx.moveTo(cx - rx * 1.06, cy - ry * 0.34);
    ctx.quadraticCurveTo(cx, cy - ry * 1.42, cx + rx * 1.06, cy - ry * 0.30);
    ctx.stroke();
  }

  /* 围裙上的小蓝鲸（px 够大才画） */
  function gWhaleMark(ctx, px, cx, cy, k) {
    if (px < 30) return;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(k, k);
    ctx.fillStyle = '#4a6fd0';
    epath(ctx, 0, 0, 0.055, 0.036);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0.048, -0.004);
    ctx.quadraticCurveTo(0.082, -0.036, 0.086, 0.004);
    ctx.quadraticCurveTo(0.062, 0.014, 0.048, 0.010);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    epath(ctx, -0.018, -0.006, 0.008, 0.008);
    ctx.fill();
    ctx.strokeStyle = '#4a6fd0';
    lw(ctx, px, 0.007, 0.5);
    ctx.beginPath();
    ctx.moveTo(-0.012, -0.038);
    ctx.quadraticCurveTo(-0.02, -0.062, -0.004, -0.058);
    ctx.stroke();
    ctx.restore();
  }

  /** 倒扣在头上的不锈钢盆 */
  function drawGirlBasin(ctx, o, t, px) {
    var A = ctx.globalAlpha;
    ctx.save();
    ctx.translate(0, -0.215);
    ctx.rotate(Math.sin(t * 4.1) * 0.045 + 0.05);
    /* 盆体（上半圆 = 倒扣的盆） */
    ctx.beginPath();
    ctx.arc(0, 0.10, 0.295, PI, TAU);
    ctx.closePath();
    ctx.fillStyle = steelGrad(ctx);
    ctx.fill();
    /* 盆底斜高光 */
    ctx.save();
    ctx.globalAlpha = A * 0.55;
    ctx.fillStyle = '#ffffff';
    epathRot(ctx, -0.11, -0.10, 0.135, 0.042, -0.52);
    ctx.fill();
    ctx.globalAlpha = A * 0.26;
    epathRot(ctx, 0.07, -0.16, 0.095, 0.028, -0.52);
    ctx.fill();
    ctx.restore();
    /* 两道凹痕 */
    ctx.strokeStyle = A_DENT;
    lw(ctx, px, 0.022, 0.9);
    ctx.beginPath(); ctx.arc(0, 0.10, 0.225, PI * 1.12, PI * 1.88); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0.10, 0.135, PI * 1.14, PI * 1.86); ctx.stroke();
    /* 盆沿 */
    ctx.fillStyle = '#c9d3e2';
    epath(ctx, 0, 0.10, 0.318, 0.070);
    ctx.fill();
    ctx.fillStyle = C.steelLight;
    epath(ctx, 0, 0.082, 0.298, 0.040);
    ctx.fill();
    ctx.globalAlpha = A * 0.72;
    ctx.fillStyle = '#ffffff';
    epath(ctx, -0.17, 0.078, 0.052, 0.019);
    ctx.fill();
    ctx.globalAlpha = A;
    ctx.restore();
    /* 盆沿压在脸上的阴影 */
    ctx.globalAlpha = A * 0.28;
    ctx.fillStyle = '#2a1a1c';
    epath(ctx, 0, -0.135, 0.24, 0.045);
    ctx.fill();
    ctx.globalAlpha = A;
  }

  /* ── 大肥鱼的动画状态（图片立绘与程序化画法共用同一套） ──────
     全部由 t 和下面这些进度值驱动，不占用额外状态：
       o.stepT  0..1  当前这一格的行走进度（每走一格 = 一个小跳）
       o.moving       是否正在走
       o.spawn  0..1  出生动画进度（1 = 已经站好）
       o.winT   0..1  通关动画进度
       o.deadT  0..1  失败翻倒进度
       o.hurt   0..1  受击强度
       o.bowl         头顶铁盆（会额外晃）
     返回 {dx, dy, sx, sy, rot, alpha}，单位都是"格"
     ─────────────────────────────────────────────────────── */
  function charAnim(o, t, anim) {
    var out = anim || { dx: 0, dy: 0, sx: 1, sy: 1, rot: 0, alpha: 1 };
    var moving = !!o.moving;
    var hurt = clamp01(num(o.hurt, 0));
    var value = num(o.value, 0);
    var stepT = clamp01(num(o.stepT, 0.5));
    var spawn = clamp01(num(o.spawn, 1));
    var winT = clamp01(num(o.winT, 0));
    var deadT = clamp01(num(o.deadT, 0));

    /* 待机：上下浮动 + 呼吸（胸口起伏） */
    var ib = Math.sin(t * 2.05);
    var dy = ib * 0.022;
    var sx = 1 + ib * 0.015;
    var sy = 1 - ib * 0.015;

    /* 走路：每格一个小跳，顶点拉长、落地压扁 */
    if (moving) {
      var swing = Math.sin(PI * stepT);              /* 0 → 1 → 0 */
      var landK = Math.max(0, 1 - stepT * 5);        /* 刚落地那一瞬 */
      dy += -swing * 0.085;
      sy += 0.055 * swing - 0.05 * landK;
      sx += -0.05 * swing + 0.05 * landK;
    }
    /* 裙摆/头发随走动左右摇 */
    var rot = moving ? Math.sin(stepT * TAU) * 0.055 : Math.sin(t * 1.4) * 0.014;

    /* 出生：从小弹到大 */
    if (spawn < 1) {
      var s = spawn < 1 ? 1 - Math.pow(1 - spawn, 3) : 1;
      var overshoot = Math.sin(spawn * PI) * 0.16;   /* 过冲一下更弹 */
      var k = 0.35 + 0.65 * s + overshoot;
      sx *= k; sy *= k;
      out.alpha = Math.min(1, spawn * 1.6);
    }

    /* 通关：跳起来转一圈 */
    if (winT > 0) {
      var w = Math.min(1, winT);
      dy += -Math.sin(PI * w) * 0.42;
      rot += w * TAU;
      var sq2 = Math.sin(PI * w);
      sy += 0.10 * sq2 - Math.max(0, (w - 0.85) * 2) * 0.18;
      sx += -0.10 * sq2 + Math.max(0, (w - 0.85) * 2) * 0.18;
    }

    /* 失败：向侧面翻倒 + 下沉 */
    if (deadT > 0) {
      var d = Math.min(1, deadT);
      var e = 1 - Math.pow(1 - d, 3);
      rot += -1.45 * e;
      out.dx += -0.16 * e;
      dy += 0.16 * e;
      sx *= 1 - 0.12 * e;
    }

    /* 头顶铁盆：头重脚轻，晃得比平时明显 */
    if (o.bowl) {
      rot += Math.sin(t * 4.1) * 0.030 + (moving ? Math.sin(stepT * PI) * 0.03 : 0);
      dy += Math.sin(t * 4.1) * 0.006;
    }

    /* 受击抖动 */
    if (hurt > 0) {
      out.dx = Math.sin(t * 52) * 0.045 * hurt;
      dy += Math.cos(t * 61) * 0.035 * hurt;
    }
    if (value > 999) { sx *= 1.06; sy *= 0.97; }     /* 数值太大 → 撑胖一点 */

    out.dy = dy; out.sx = sx; out.sy = sy; out.rot = rot;
    if (!(out.alpha >= 0)) out.alpha = 1;
    return out;
  }

  /** Q 版少女本体（已 translate 到格心 + scale 到单位空间） */
  function drawGirl(ctx, o, t, px, anim) {

      ctx.quadraticCurveTo(0, 0.31, -0.165, 0.245);

    if (!back) {

      ctx.beginPath();
      ctx.moveTo(-0.005, 0.005);
      ctx.lineTo(-0.062, -0.026);
      ctx.lineTo(-0.055, 0.036);

      var look = (facing === 'left' || facing === 'right') ? -0.62 : 0;

      gEye(ctx, px, 0.088, ey, 0.052, squint ? 0.042 : 0.070, look, closed, xeye);

        ctx.fillStyle = '#4a1522';
        epath(ctx, 0, -0.045, 0.026, 0.020);
        ctx.fill();
      } else {
        ctx.strokeStyle = 'rgba(120,60,60,0.85)';
        ctx.lineCap = 'round';
        lw(ctx, px, 0.012, 0.7);
        ctx.beginPath();
        ctx.moveTo(-0.022, -0.052);
        ctx.quadraticCurveTo(0, -0.028, 0.022, -0.052);
        ctx.stroke();
      }
      /* 腮红 */
      if (px >= DETAIL_S && !xeye) {
        ctx.globalAlpha = A * 0.42;
        ctx.fillStyle = '#ff9d9d';
        epath(ctx, -0.155, -0.085, 0.040, 0.024);

        epath(ctx, 0.155, -0.085, 0.040, 0.024);

    ctx.fillStyle = gHairGrad(ctx);
    ctx.fill();
    if (px >= DETAIL_S) {
      ctx.save();
      gBangsPath(ctx, sway);
      ctx.clip();
      ctx.globalAlpha = A * 0.35;
      ctx.fillStyle = G_HAIR_LIT;
      epathRot(ctx, -0.02, -0.34, 0.15, 0.038, -0.12);
      ctx.fill();
      ctx.globalAlpha = A;
      ctx.restore();

    gLockPath(ctx, -1, sway);
    ctx.fillStyle = gHairGrad(ctx);
    ctx.fill();
    gLockPath(ctx, 1, sway);
    ctx.fill();

    if (!back) {
      /* ── 蕾丝发带（白色扇贝边） ── */
      ctx.save();
      ctx.strokeStyle = G_WHITE;
      ctx.lineCap = 'round';
      lw(ctx, px, 0.052, 1.2);
      ctx.beginPath();
      ctx.arc(0, -0.185, 0.222, PI * 1.16, PI * 1.84);
      ctx.stroke();
      if (px >= DETAIL_S) {
        ctx.fillStyle = '#ffffff';

      ctx.save();
      ctx.translate(0.20, -0.27);
      ctx.rotate(-0.25);
      ctx.fillStyle = '#4f7fe0';
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(-0.075, -0.048); ctx.lineTo(-0.075, 0.048); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(0.075, -0.048); ctx.lineTo(0.075, 0.048); ctx.closePath(); ctx.fill();

    ctx.strokeStyle = G_HAIR_MID;
    ctx.lineCap = 'round';

    ctx.beginPath();
    ctx.moveTo(0.01, -0.43);

    if (hurt > 0) {
      ctx.save();
      ctx.strokeStyle = C.danger;

      ctx.quadraticCurveTo(0, 0.40, 0.24, 0.02);

    }

  function drawAssetImage(ctx, entry, px, hurt) {
    var img = entry.img;
    var iw = img.naturalWidth || img.width || 0;
    var ih = img.naturalHeight || img.height || 0;
    if (!(iw > 0) || !(ih > 0)) return;
    var b = entry.box || { sx: 0, sy: 0, sw: iw, sh: ih };
    /* 高度按 1.06 格缩放到格子上，底边压住格子下沿（脚踩在地上），水平居中 */
    var k = (px * 1.06) / b.sh;
    var w = b.sw * k, h = b.sh * k;
    if (w > px * 1.55) { k *= (px * 1.55) / w; w = b.sw * k; h = b.sh * k; }
    var dx = -w / 2, dy = px * 0.47 - h;
    ctx.save();
    /* 注意：这里已经是"以格心为原点、单位 = 1 CSS 像素"的坐标系（调用方 scale(px,px)
       只用在程序化画法那条分支上），所以 dx/dy/w/h 直接就是像素值，不能再除以 px，
       否则整张立绘会被画成 1 像素高、看着像没显示。 */
    ctx.drawImage(img, b.sx, b.sy, b.sw, b.sh, dx, dy, w, h);
    if (hurt > 0.02 && entry.tint) {
      ctx.globalAlpha *= clamp01(hurt) * 0.95;
      ctx.drawImage(entry.tint, b.sx, b.sy, b.sw, b.sh, dx, dy, w, h);
    }
    ctx.restore();
  }

  function fish(ctx, x, y, s, o) {
    if (!ctx || !(s > 0) || !finite2(x) || !finite2(y)) return;
    o = o || {};
    var a = clamp01(num(o.alpha, 1));
    if (a <= 0) return;
    var px = s * clamp(num(o.scale, 1), 0.05, 6);
    var t = timeOf(o);
    ctx.save();
    try {
      ctx.globalAlpha *= a;
      ctx.translate(x, y);
      var plain = assetEntry('fish');
      var bowlArt = o.bowl ? assetEntry('fish_bowl') : null;
      var entry = bowlArt || plain;

        /* 图片立绘：所有动画都靠变换做（浮动 / 小跳 / 压扁拉伸 / 摇摆 / 翻倒 / 出生弹入）
           注意坐标系：这里单位是 CSS 像素，而 charAnim 的位移是以"格"为单位的，所以要乘 px
           镜像方向：立绘的鲸鱼尾/蝴蝶结画在画面右侧（即"背后"朝右），
           所以往右走才镜像，让尾巴始终拖在身后 */
        var an = charAnim(o, t);
        ctx.globalAlpha *= an.alpha;
        ctx.translate(an.dx * px, an.dy * px);
        if (o.facing === 'right') ctx.scale(-1, 1);
        ctx.rotate(an.rot);
        ctx.translate(0, px * 0.47);          /* 以"脚"为支点 */
        ctx.scale(an.sx, an.sy);
        ctx.translate(0, -px * 0.47);
        drawAssetImage(ctx, entry, px, num(o.hurt, 0));
        if (o.bowl && !bowlArt) {
          /* 只给了常态立绘、没给戴盆立绘时，把程序化的不锈钢盆扣上去 */
          ctx.scale(px, px);
          drawGirlBasin(ctx, o, t, px);
        }
        return;
      }
      ctx.scale(px, px);
      drawGirl(ctx, o, t, px);
    } finally {
      ctx.restore();
    }
  }

  /* ════════════════════════════════════════════════════════════
     5. 大白饭 / 铁盆大白饭
     ════════════════════════════════════════════════════════════ */
  function drawMound(ctx, o, t, px) {

    ctx.beginPath();
    ctx.moveTo(-0.35, 0.20);
    ctx.bezierCurveTo(-0.31, -0.10, -0.21, -0.34, 0.00, -0.44);
    ctx.bezierCurveTo(0.21, -0.34, 0.31, -0.10, 0.35, 0.20);
    ctx.closePath();
    ctx.clip();
    ctx.globalAlpha = A * 0.85;
    ctx.fillStyle = C.riceDark;
    epathRot(ctx, 0.30, 0.10, 0.24, 0.30, 0.35);
    ctx.fill();
    ctx.globalAlpha = A * 0.75;
    ctx.fillStyle = '#fffdf6';
    epathRot(ctx, -0.16, -0.20, 0.16, 0.22, -0.25);
    ctx.fill();
    ctx.globalAlpha = A;

    if (px >= DETAIL_S) {
      var grains = 3 + (value >= 5 ? 1 : 0) + (value >= 20 ? 1 : 0);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      for (var i = 0; i < grains; i++) {

        epathRot(ctx, gx, gy, 0.030, 0.016, -0.5);
        ctx.fill();
      }
      ctx.globalAlpha = A * 0.5;
      ctx.fillStyle = C.riceDark;
      epathRot(ctx, 0.14, 0.02, 0.032, 0.017, -0.4);
      ctx.fill();
      ctx.globalAlpha = A;
    }
    ctx.restore();
  }

  function drawBowl(ctx, metal, t, px) {
    var A = ctx.globalAlpha;

    ctx.beginPath();
    ctx.moveTo(-0.45, 0.10);
    ctx.lineTo(0.45, 0.10);
    ctx.quadraticCurveTo(0.38, 0.47, 0.00, 0.47);
    ctx.quadraticCurveTo(-0.38, 0.47, -0.45, 0.10);

      ctx.save();
