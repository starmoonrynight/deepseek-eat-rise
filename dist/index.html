    epath(ctx, cx, cy, r, ry);
    ctx.fill();
    ctx.strokeStyle = 'rgba(12,26,48,0.55)';
    lw(ctx, px, 0.012, 0.5);
    ctx.stroke();
    ctx.fillStyle = C.eye;
    epath(ctx, cx + r * 0.18, cy + ry * 0.10, r * 0.52, ry * 0.62);
    ctx.fill();
    if (!squint) {
      ctx.fillStyle = '#ffffff';
      epath(ctx, cx - r * 0.26, cy - ry * 0.36, r * 0.22, r * 0.22);
      ctx.fill();
    }
  }
  function fishEyeX(ctx, px, cx, cy, r) {
    ctx.strokeStyle = C.eye;
    lw(ctx, px, 0.032, 1.1);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx + r, cy + r);
    ctx.moveTo(cx + r, cy - r); ctx.lineTo(cx - r, cy + r);
    ctx.stroke();
  }

  /** 铁盆（戴在头上）—— 单位空间，调用前 ctx 已 translate 到格子中心 */
  function drawBasin(ctx, o, t, px) {
    var A = ctx.globalAlpha;
    ctx.save();
    ctx.translate(0.04, -0.34);
    ctx.rotate(Math.sin(t * 4.3) * 0.055 + Math.cos(t * 3.1) * 0.028);

    /* 盆体：倒扣的半圆 */
    ctx.beginPath();
    ctx.arc(0, 0.06, 0.35, PI, TAU);
    ctx.closePath();
    ctx.fillStyle = steelGrad(ctx);
    ctx.fill();

    /* 盆底反光（两条斜高光） */
    ctx.save();
    ctx.globalAlpha = A * 0.55;
    ctx.fillStyle = '#ffffff';
    epathRot(ctx, -0.13, -0.09, 0.115, 0.042, -0.55);
    ctx.fill();
    ctx.globalAlpha = A * 0.30;
    epathRot(ctx, 0.06, -0.16, 0.085, 0.030, -0.55);
    ctx.fill();
    ctx.restore();

    /* 两道凹痕 */
    ctx.strokeStyle = A_DENT;
    lw(ctx, px, 0.024, 0.9);
    ctx.beginPath(); ctx.arc(0, 0.06, 0.245, PI * 1.10, PI * 1.90); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0.06, 0.145, PI * 1.12, PI * 1.88); ctx.stroke();

    /* 盆沿：一圈亮边 + 内侧高光 */
    ctx.fillStyle = '#c9d3e2';
    epath(ctx, 0, 0.062, 0.372, 0.086);
    ctx.fill();
    ctx.fillStyle = C.steelLight;
    epath(ctx, 0, 0.046, 0.345, 0.050);
    ctx.fill();
    ctx.globalAlpha = A * 0.75;
    ctx.fillStyle = '#ffffff';
    epath(ctx, -0.20, 0.040, 0.055, 0.022);
    ctx.fill();
    ctx.globalAlpha = A;
    ctx.restore();
  }

  /** 鱼本体（已 translate 到格心 + scale 到单位空间 + 已按 facing 镜像/旋转） */
  function drawFish(ctx, o, t, px) {
    var A = ctx.globalAlpha;
    var moving = !!o.moving;
    var hurt = clamp01(num(o.hurt, 0));
    var bowl = !!o.bowl;
    var dead = !!o.dead;
    var blind = !!o.blink;
    var facing = o.facing;
    if (facing !== 'up' && facing !== 'down' && facing !== 'left' && facing !== 'right') facing = 'down';
    var value = num(o.value, 0);

    /* ── 动画参数：全部由 t 驱动 ─────────────────────────── */
    var bob = moving ? Math.sin(t * 9.0) * 0.02 : Math.sin(t * 2.1) * 0.06;   /* 待机 ±6% s */
    var sq = moving ? Math.sin(t * 11.0) : 0;
    var br = Math.sin(t * 2.1) * 0.02;
    var sx = moving ? 1 + 0.07 * sq : 1 + br;
    var sy = moving ? 1 - 0.07 * sq : 1 - br;
    if (value > 999) sx *= 1.10;                                             /* 数值太大 → 撑胖一点 */
    var roll = moving ? Math.sin(t * 7.5) * 0.055 : Math.sin(t * 1.6) * 0.02;
    var tilt = facing === 'up' ? -0.20 : (facing === 'down' ? 0.14 : 0);
    if (dead) roll += Math.sin(t * 1.7) * 0.12 - 0.10;
    var shakeX = hurt > 0 ? Math.sin(t * 52) * 0.045 * hurt : 0;
    var shakeY = hurt > 0 ? Math.cos(t * 61) * 0.035 * hurt : 0;

    ctx.translate(shakeX, bob + shakeY);
    ctx.rotate(roll + tilt);
    ctx.scale(sx, sy);

    /* ── 水下投影 ─────────────────────────────────────────── */
    if (px >= 20) {
      ctx.globalAlpha = A * 0.22;
      ctx.fillStyle = '#04070f';
      epath(ctx, 0, 0.47 - bob, 0.33, 0.06);
      ctx.fill();
      ctx.globalAlpha = A;
    }

    var wag = Math.sin(t * (moving ? 10 : 2.4)) * (moving ? 0.34 : 0.17);
    var tailDip = facing === 'up' ? 0.28 : (facing === 'down' ? -0.24 : 0);

    /* ── 尾鳍（月牙，画在身体后） ─────────────────────────── */
    ctx.save();
    ctx.translate(-0.30, 0.03);
    ctx.rotate(wag * 0.55 + tailDip * 0.5 + (dead ? 0.18 : 0));
    ctx.beginPath();
    ctx.moveTo(0.02, 0);
    ctx.quadraticCurveTo(-0.12, -0.11, -0.23, -0.31);
    ctx.quadraticCurveTo(-0.10, -0.06, -0.05, 0.00);
    ctx.quadraticCurveTo(-0.10, 0.07, -0.23, 0.31);
    ctx.quadraticCurveTo(-0.12, 0.11, 0.02, 0);
    ctx.closePath();
    ctx.fillStyle = finGrad(ctx);
    ctx.fill();
    ctx.globalAlpha = A * 0.35;
    ctx.fillStyle = '#8ec2ff';
    ctx.beginPath();
    ctx.moveTo(-0.02, -0.01);
    ctx.quadraticCurveTo(-0.10, -0.08, -0.18, -0.22);
    ctx.quadraticCurveTo(-0.09, -0.05, -0.04, 0.0);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = A;
    ctx.restore();

    /* ── 背鳍 ─────────────────────────────────────────────── */
    ctx.save();
    ctx.translate(-0.03, -0.30);
    ctx.rotate(Math.sin(t * 3.1) * 0.06 + tailDip * 0.2);
    ctx.beginPath();
    ctx.moveTo(-0.10, 0.03);
    ctx.quadraticCurveTo(-0.02, -0.24, 0.16, 0.02);
    ctx.quadraticCurveTo(0.03, -0.03, -0.10, 0.03);
    ctx.closePath();
    ctx.fillStyle = finGrad(ctx);
    ctx.fill();
    ctx.restore();

    /* ── 身体 ─────────────────────────────────────────────── */
    fishBodyPath(ctx);
    ctx.fillStyle = fishGrad(ctx, bowl);
    ctx.fill();

    /* 肚皮（裁剪在身体内的米白） */
    ctx.save();
    fishBodyPath(ctx);
    ctx.clip();
    ctx.fillStyle = C.rice;
    epath(ctx, 0.06, 0.235, 0.35, 0.20);
    ctx.fill();
    ctx.globalAlpha = A * 0.55;
    ctx.fillStyle = '#ffffff';
    epath(ctx, 0.10, 0.18, 0.27, 0.10);
    ctx.fill();
    ctx.globalAlpha = A;
    if (px >= DETAIL_S) {
      /* 肚皮褶 */
      ctx.strokeStyle = 'rgba(185,176,150,0.55)';
      lw(ctx, px, 0.012, 0.6);
      for (var i = 0; i < 3; i++) {
        var gx = -0.16 + i * 0.16;
        ctx.beginPath();
        ctx.moveTo(gx, 0.13);
        ctx.quadraticCurveTo(gx + 0.02, 0.24, gx - 0.01, 0.34);
        ctx.stroke();
      }
    }
    /* 背部高光 */
    ctx.globalAlpha = A * 0.22;
    ctx.fillStyle = '#ffffff';
    epathRot(ctx, 0.14, -0.26, 0.22, 0.075, -0.30);
    ctx.fill();
    ctx.globalAlpha = A;
    /* 盆沿压在头上的阴影 */
    if (bowl) {
      ctx.globalAlpha = A * 0.30;
      ctx.fillStyle = '#050a14';
      epath(ctx, 0.04, -0.24, 0.30, 0.075);
      ctx.fill();
      ctx.globalAlpha = A;
    }
    ctx.restore();

    /* ── 胸鳍 ─────────────────────────────────────────────── */
    var flap = Math.sin(t * (moving ? 8.5 : 2.2)) * 0.22;
    ctx.save();
    ctx.translate(0.12, 0.14);
    ctx.rotate(0.55 + flap);
    ctx.fillStyle = finGrad(ctx);
    epath(ctx, 0, 0, 0.115, 0.058);
    ctx.fill();
    ctx.restore();
    if (!moving) {
      ctx.save();
      ctx.translate(-0.12, 0.12);
      ctx.rotate(0.35 - flap * 0.7);
      ctx.globalAlpha = A * 0.85;
      ctx.fillStyle = finGrad(ctx);
      epath(ctx, 0, 0, 0.095, 0.05);
      ctx.fill();
      ctx.restore();
      ctx.globalAlpha = A;
    }

    /* ── 眼睛 / 嘴 / 腮红 ─────────────────────────────────── */
    var eyeShift = facing === 'up' ? -0.075 : (facing === 'down' ? 0.05 : 0);
    var eyeK = facing === 'up' ? 0.86 : (facing === 'down' ? 0.96 : 1);
    var eyeY = -0.07 + eyeShift;
    var closed = blind || (t % 3.7) > 3.58;
    var squint = bowl && !closed;
    var eyesX = (hurt > 0.35 || dead);
    if (eyesX) {
      fishEyeX(ctx, px, 0.24, eyeY + 0.01, 0.085 * eyeK);
      fishEyeX(ctx, px, 0.02, eyeY - 0.01, 0.075 * eyeK);
    } else {
      fishEye(ctx, px, 0.24, eyeY + 0.01, 0.10 * eyeK, closed, squint);
      fishEye(ctx, px, 0.02, eyeY - 0.01, 0.086 * eyeK, closed, squint);
    }
    /* 嘴 */
    if (dead || hurt > 0.6) {
      ctx.fillStyle = '#3d1420';
      epath(ctx, 0.355, 0.075, 0.045, 0.055);
      ctx.fill();
    } else if (squint) {
      ctx.strokeStyle = 'rgba(14,28,48,0.85)';
      lw(ctx, px, 0.020, 0.9);
      ctx.beginPath();
      ctx.moveTo(0.30, 0.075); ctx.lineTo(0.40, 0.075);
      ctx.stroke();
    } else {
      ctx.strokeStyle = 'rgba(14,28,48,0.9)';
      lw(ctx, px, 0.020, 0.9);
      ctx.beginPath();
      ctx.moveTo(0.42, 0.02);
      ctx.quadraticCurveTo(0.37, 0.10, 0.29, 0.075);
      ctx.stroke();
    }
    if (px >= DETAIL_S && !eyesX) {
      ctx.globalAlpha = A * 0.30;
      ctx.fillStyle = '#ff9d8a';
      epath(ctx, 0.315, 0.145, 0.055, 0.033);
      ctx.fill();
      ctx.globalAlpha = A;
    }

    /* ── 受击：红色描边闪 ─────────────────────────────────── */
    if (hurt > 0) {
      fishBodyPath(ctx);
      ctx.strokeStyle = C.danger;
      lw(ctx, px, 0.035, 1.4);
      ctx.globalAlpha = A * (0.35 + 0.65 * hurt);
      if (px >= SHADOW_S) {
        ctx.shadowColor = 'rgba(255,93,108,0.85)';
        ctx.shadowBlur = clamp(px * 0.45 * hurt, 0, 26);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = A;
    }
    /* ── 死亡：整体偏灰 ───────────────────────────────────── */
    if (dead) {
      fishBodyPath(ctx);
      ctx.globalAlpha = A * 0.38;
      ctx.fillStyle = '#7f93b5';
      ctx.fill();
      ctx.globalAlpha = A;
    }

    /* ── 铁盆 ─────────────────────────────────────────────── */
    if (bowl) drawBasin(ctx, o, t, px);
  }

  /* ════════════════════════════════════════════════════════════
     4b. 蓝色大肥鱼 · Q 版蓝发少女（照立绘重制）
     ────────────────────────────────────────────────────────────
     造型：深蓝长卷发 + 头顶呆毛 + 白色蕾丝发带 + 发侧蓝蝴蝶结
           两侧鱼鳍耳 + 身后鲸鱼尾 + 深蓝女仆裙（白围裙绣蓝鲸）
           胸口蓝宝石领结 + 白袜深蓝小皮鞋
     铁盆形态：一整个不锈钢盆倒扣在头上，盆沿压到眉毛上方
     ════════════════════════════════════════════════════════════ */
  var G_HAIR_TOP = '#6577d4', G_HAIR_MID = '#3b479f', G_HAIR_DARK = '#1e2559';
  var G_HAIR_LIT = '#8fa2ea';
  var G_SKIN = '#ffe4d7', G_SKIN_SH = '#eec2b1';
  var G_DRESS = '#232a5e', G_DRESS_L = '#39428f';
  var G_WHITE = '#f7f8ff', G_WHITE_SH = '#cfd5ee';
  var G_EYE_TOP = '#16204e', G_EYE_MID = '#2f4cc0', G_EYE_LOW = '#7fb0ff';
  var G_GEM = '#86b6ff';
  var G_LINE = '#131a42';

  function gHairGrad(ctx) {
    var g = ctx.createLinearGradient(0, -0.50, 0.06, 0.48);
    g.addColorStop(0, G_HAIR_TOP);
    g.addColorStop(0.38, G_HAIR_MID);
    g.addColorStop(1, G_HAIR_DARK);
    return g;
  }
  function gDressGrad(ctx) {
    var g = ctx.createLinearGradient(0, -0.02, 0, 0.34);
    g.addColorStop(0, G_DRESS_L);
    g.addColorStop(1, G_DRESS);
    return g;
  }

  /* 身后的大团长发（带波浪下摆） */
  function gBackHairPath(ctx, sway) {
    ctx.beginPath();
    ctx.moveTo(0, -0.45);
    ctx.bezierCurveTo(-0.26, -0.46, -0.38, -0.28, -0.37, -0.04);
    ctx.bezierCurveTo(-0.36, 0.16, -0.35, 0.30, -0.30, 0.42 + sway * 0.03);
    ctx.quadraticCurveTo(-0.21, 0.34 + sway * 0.02, -0.13, 0.45 + sway * 0.03);
    ctx.quadraticCurveTo(-0.03, 0.35, 0.07, 0.45 + sway * 0.03);
    ctx.quadraticCurveTo(0.17, 0.34 + sway * 0.02, 0.27, 0.42 + sway * 0.03);
    ctx.bezierCurveTo(0.34, 0.28, 0.37, 0.12, 0.37, -0.06);
    ctx.bezierCurveTo(0.39, -0.28, 0.27, -0.46, 0, -0.45);
    ctx.closePath();
  }

  /* 脸（略扁的圆脸 + 小下巴） */
  function gFacePath(ctx) {
    ctx.beginPath();
    ctx.moveTo(-0.205, -0.22);
    ctx.bezierCurveTo(-0.225, -0.06, -0.17, 0.045, 0, 0.065);
    ctx.bezierCurveTo(0.17, 0.045, 0.225, -0.06, 0.205, -0.22);
    ctx.bezierCurveTo(0.19, -0.37, -0.19, -0.37, -0.205, -0.22);
    ctx.closePath();
  }

  /* 刘海（斜分 + 三个尖） */
  function gBangsPath(ctx, sway) {
    ctx.beginPath();
    ctx.moveTo(-0.225, -0.16 + sway * 0.01);
    ctx.bezierCurveTo(-0.285, -0.34, -0.16, -0.47, 0.005, -0.465);
    ctx.bezierCurveTo(0.16, -0.47, 0.285, -0.34, 0.225, -0.15 + sway * 0.01);
    ctx.quadraticCurveTo(0.175, -0.27, 0.115, -0.135);
    ctx.quadraticCurveTo(0.055, -0.28, -0.005, -0.145);
    ctx.quadraticCurveTo(-0.075, -0.285, -0.135, -0.155);
    ctx.quadraticCurveTo(-0.185, -0.28, -0.225, -0.16 + sway * 0.01);
    ctx.closePath();
  }

  /* 垂到胸前的侧发 */
  function gLockPath(ctx, dir, sway) {
    ctx.beginPath();
    ctx.moveTo(dir * 0.195, -0.24);
    ctx.bezierCurveTo(dir * 0.30, -0.08, dir * 0.315, 0.12, dir * (0.255 + sway * 0.02), 0.36 + sway * 0.02);
    ctx.quadraticCurveTo(dir * (0.16 + sway * 0.02), 0.26, dir * 0.135, 0.08);
    ctx.bezierCurveTo(dir * 0.115, -0.08, dir * 0.145, -0.19, dir * 0.195, -0.24);
    ctx.closePath();
  }

  /* 鱼鳍耳 */
  function gFinEar(ctx, px, dir, flap) {
    ctx.save();
    ctx.translate(dir * 0.185, -0.13);
    ctx.rotate(dir * (0.24 + flap));
    ctx.beginPath();
    ctx.moveTo(0, -0.035);
    ctx.quadraticCurveTo(dir * 0.155, -0.145, dir * 0.215, -0.005);
    ctx.quadraticCurveTo(dir * 0.15, 0.10, dir * 0.015, 0.065);
    ctx.closePath();
    ctx.fillStyle = finGrad(ctx);
    ctx.fill();
    if (px >= DETAIL_S) {
      ctx.strokeStyle = 'rgba(150,200,255,0.75)';
      lw(ctx, px, 0.010, 0.5);
      for (var i = 0; i < 3; i++) {
        var a = -0.30 + i * 0.30;
        ctx.beginPath();
        ctx.moveTo(dir * 0.03, 0.01);
        ctx.lineTo(dir * (0.14 + i * 0.02), Math.sin(a) * 0.075);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  /* 身后的鲸鱼尾（两瓣，会摆） */
  function gWhaleTail(ctx, px, t, moving) {
    var sw = Math.sin(t * (moving ? 9 : 2.2)) * 0.22;
    ctx.save();
    ctx.translate(0.30, 0.20);
    ctx.rotate(-0.30 + sw);
    ctx.beginPath();
    ctx.moveTo(-0.03, 0.03);
    ctx.quadraticCurveTo(0.05, -0.02, 0.11, -0.05);
    ctx.lineTo(0.075, 0.02);
    ctx.quadraticCurveTo(0.05, 0.04, -0.03, 0.03);
    ctx.closePath();
    ctx.fillStyle = '#2b3a86';
    ctx.fill();
    /* 两瓣尾鳍 */
    ctx.beginPath();
    ctx.moveTo(0.09, -0.04);
    ctx.quadraticCurveTo(0.20, -0.16, 0.235, -0.055);
    ctx.quadraticCurveTo(0.16, 0.01, 0.09, -0.02);
    ctx.closePath();
    ctx.fillStyle = '#3d55b8';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0.09, -0.02);
    ctx.quadraticCurveTo(0.19, 0.03, 0.20, 0.115);
    ctx.quadraticCurveTo(0.12, 0.06, 0.085, 0.005);
    ctx.closePath();
    ctx.fillStyle = '#31459c';
    ctx.fill();
    ctx.restore();
  }

  /* Q 版大眼睛 */
  function gEye(ctx, px, cx, cy, rx, ry, look, closed, xeye) {
    if (xeye) {
      ctx.strokeStyle = G_LINE;
      ctx.lineCap = 'round';
      lw(ctx, px, 0.026, 1);
      ctx.beginPath();
      ctx.moveTo(cx - rx * 0.8, cy - ry * 0.8); ctx.lineTo(cx + rx * 0.8, cy + ry * 0.8);
      ctx.moveTo(cx + rx * 0.8, cy - ry * 0.8); ctx.lineTo(cx - rx * 0.8, cy + ry * 0.8);
      ctx.stroke();
      return;
    }
    if (closed) {
      ctx.strokeStyle = G_LINE;
      ctx.lineCap = 'round';
      lw(ctx, px, 0.020, 1);
      ctx.beginPath();
      ctx.moveTo(cx - rx, cy - ry * 0.15);
      ctx.quadraticCurveTo(cx, cy + ry * 1.0, cx + rx, cy - ry * 0.15);
      ctx.stroke();
      return;
    }
    /* 眼白 */
    ctx.fillStyle = '#ffffff';
    epath(ctx, cx, cy, rx, ry);
    ctx.fill();
    /* 虹膜 */
    ctx.save();
    epath(ctx, cx, cy, rx, ry);
    ctx.clip();
    var g = ctx.createLinearGradient(cx, cy - ry, cx, cy + ry);
    g.addColorStop(0, G_EYE_TOP);
    g.addColorStop(0.42, G_EYE_MID);
    g.addColorStop(0.80, G_EYE_LOW);
    g.addColorStop(1, '#d8e8ff');
    ctx.fillStyle = g;
    ctx.fillRect(cx - rx, cy - ry, rx * 2, ry * 2);
    /* 瞳孔 */
    ctx.fillStyle = 'rgba(10,14,40,0.88)';
    epath(ctx, cx + look * rx * 0.22, cy + ry * 0.16, rx * 0.44, ry * 0.48);
    ctx.fill();
    /* 下部反光带 */
    ctx.fillStyle = 'rgba(200,230,255,0.72)';
    epath(ctx, cx + look * rx * 0.22, cy + ry * 0.50, rx * 0.56, ry * 0.24);
    ctx.fill();
    /* 高光两点 */
    ctx.fillStyle = '#ffffff';
    epath(ctx, cx - rx * 0.36, cy - ry * 0.44, rx * 0.34, ry * 0.28);
    ctx.fill();
    epath(ctx, cx + rx * 0.42, cy + ry * 0.26, rx * 0.18, ry * 0.15);
    ctx.fill();
    ctx.restore();
    /* 上睫毛 */
    ctx.strokeStyle = G_LINE;
    ctx.lineCap = 'round';
    lw(ctx, px, 0.020, 1);
    ctx.beginPath();
    ctx.moveTo(cx - rx * 1.06, cy - ry * 0.34);
    ctx.quadraticCurveTo(cx, cy - ry * 1.42, cx + rx * 1.06, cy - ry * 0.30);
    ctx.stroke();
  }

  /* 围裙上的小蓝鲸（px 够大才画） */
  function gWhaleMark(ctx, px, cx, cy, k) {
    if (px < 30) return;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(k, k);
    ctx.fillStyle = '#4a6fd0';
    epath(ctx, 0, 0, 0.055, 0.036);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0.048, -0.004);
    ctx.quadraticCurveTo(0.082, -0.036, 0.086, 0.004);
    ctx.quadraticCurveTo(0.062, 0.014, 0.048, 0.010);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    epath(ctx, -0.018, -0.006, 0.008, 0.008);
    ctx.fill();
    ctx.strokeStyle = '#4a6fd0';
    lw(ctx, px, 0.007, 0.5);
    ctx.beginPath();
    ctx.moveTo(-0.012, -0.038);
    ctx.quadraticCurveTo(-0.02, -0.062, -0.004, -0.058);
    ctx.stroke();
    ctx.restore();
  }

  /** 倒扣在头上的不锈钢盆 */
  function drawGirlBasin(ctx, o, t, px) {
    var A = ctx.globalAlpha;
    ctx.save();
    ctx.translate(0, -0.215);
    ctx.rotate(Math.sin(t * 4.1) * 0.045 + 0.05);
    /* 盆体（上半圆 = 倒扣的盆） */
    ctx.beginPath();
    ctx.arc(0, 0.10, 0.295, PI, TAU);
    ctx.closePath();
    ctx.fillStyle = steelGrad(ctx);
    ctx.fill();
    /* 盆底斜高光 */
    ctx.save();
    ctx.globalAlpha = A * 0.55;
    ctx.fillStyle = '#ffffff';
    epathRot(ctx, -0.11, -0.10, 0.135, 0.042, -0.52);
    ctx.fill();
    ctx.globalAlpha = A * 0.26;
    epathRot(ctx, 0.07, -0.16, 0.095, 0.028, -0.52);
    ctx.fill();
    ctx.restore();
    /* 两道凹痕 */
    ctx.strokeStyle = A_DENT;
    lw(ctx, px, 0.022, 0.9);
    ctx.beginPath(); ctx.arc(0, 0.10, 0.225, PI * 1.12, PI * 1.88); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0.10, 0.135, PI * 1.14, PI * 1.86); ctx.stroke();
    /* 盆沿 */
    ctx.fillStyle = '#c9d3e2';
    epath(ctx, 0, 0.10, 0.318, 0.070);
    ctx.fill();
    ctx.fillStyle = C.steelLight;
    epath(ctx, 0, 0.082, 0.298, 0.040);
    ctx.fill();
    ctx.globalAlpha = A * 0.72;
    ctx.fillStyle = '#ffffff';
    epath(ctx, -0.17, 0.078, 0.052, 0.019);
    ctx.fill();
    ctx.globalAlpha = A;
    ctx.restore();
    /* 盆沿压在脸上的阴影 */
    ctx.globalAlpha = A * 0.28;
    ctx.fillStyle = '#2a1a1c';
    epath(ctx, 0, -0.135, 0.24, 0.045);
    ctx.fill();
    ctx.globalAlpha = A;

  /* ── 大肥鱼的动画状态（图片立绘与程序化画法共用同一套） ──────
     全部由 t 和下面这些进度值驱动，不占用额外状态：
       o.stepT  0..1  当前这一格的行走进度（每走一格 = 一个小跳）
       o.moving       是否正在走
       o.spawn  0..1  出生动画进度（1 = 已经站好）
       o.winT   0..1  通关动画进度
       o.deadT  0..1  失败翻倒进度
       o.hurt   0..1  受击强度
       o.bowl         头顶铁盆（会额外晃）
     返回 {dx, dy, sx, sy, rot, alpha}，单位都是"格"
     ─────────────────────────────────────────────────────── */
  function charAnim(o, t, anim) {
    var out = anim || { dx: 0, dy: 0, sx: 1, sy: 1, rot: 0, alpha: 1 };
    var moving = !!o.moving;
    var hurt = clamp01(num(o.hurt, 0));
    var value = num(o.value, 0);
    var stepT = clamp01(num(o.stepT, 0.5));
    var spawn = clamp01(num(o.spawn, 1));
    var winT = clamp01(num(o.winT, 0));
    var deadT = clamp01(num(o.deadT, 0));

    /* 待机：上下浮动 + 呼吸（胸口起伏） */
    var ib = Math.sin(t * 2.05);
    var dy = ib * 0.022;
    var sx = 1 + ib * 0.015;
    var sy = 1 - ib * 0.015;

    /* 走路：每格一个小跳，顶点拉长、落地压扁 */
    if (moving) {
      var swing = Math.sin(PI * stepT);              /* 0 → 1 → 0 */
      var landK = Math.max(0, 1 - stepT * 5);        /* 刚落地那一瞬 */
      dy += -swing * 0.085;
      sy += 0.055 * swing - 0.05 * landK;
      sx += -0.05 * swing + 0.05 * landK;
    }
    /* 裙摆/头发随走动左右摇 */
    var rot = moving ? Math.sin(stepT * TAU) * 0.055 : Math.sin(t * 1.4) * 0.014;

    /* 出生：从小弹到大 */
    if (spawn < 1) {
      var s = spawn < 1 ? 1 - Math.pow(1 - spawn, 3) : 1;
      var overshoot = Math.sin(spawn * PI) * 0.16;   /* 过冲一下更弹 */
      var k = 0.35 + 0.65 * s + overshoot;
      sx *= k; sy *= k;
      out.alpha = Math.min(1, spawn * 1.6);
    }

    /* 通关：跳起来转一圈 */
    if (winT > 0) {
      var w = Math.min(1, winT);
      dy += -Math.sin(PI * w) * 0.42;
      rot += w * TAU;
      var sq2 = Math.sin(PI * w);
      sy += 0.10 * sq2 - Math.max(0, (w - 0.85) * 2) * 0.18;
      sx += -0.10 * sq2 + Math.max(0, (w - 0.85) * 2) * 0.18;
    }

    /* 失败：向侧面翻倒 + 下沉 */
    if (deadT > 0) {
      var d = Math.min(1, deadT);
      var e = 1 - Math.pow(1 - d, 3);
      rot += -1.45 * e;
      out.dx += -0.16 * e;
      dy += 0.16 * e;
      sx *= 1 - 0.12 * e;
    }

    /* 头顶铁盆：头重脚轻，晃得比平时明显 */
    if (o.bowl) {
      rot += Math.sin(t * 4.1) * 0.030 + (moving ? Math.sin(stepT * PI) * 0.03 : 0);
      dy += Math.sin(t * 4.1) * 0.006;
    }

    /* 受击抖动 */
    if (hurt > 0) {
      out.dx = Math.sin(t * 52) * 0.045 * hurt;
      dy += Math.cos(t * 61) * 0.035 * hurt;
    }
    if (value > 999) { sx *= 1.06; sy *= 0.97; }     /* 数值太大 → 撑胖一点 */

    out.dy = dy; out.sx = sx; out.sy = sy; out.rot = rot;
    if (!(out.alpha >= 0)) out.alpha = 1;
    return out;
  }

  /** Q 版少女本体（已 translate 到格心 + scale 到单位空间） */
  function drawGirl(ctx, o, t, px, anim) {
    var A = ctx.globalAlpha;
    var moving = !!o.moving;
    var hurt = clamp01(num(o.hurt, 0));
    var bowl = !!o.bowl;
    var dead = !!o.dead;
    var facing = o.facing;
    if (facing !== 'up' && facing !== 'down' && facing !== 'left' && facing !== 'right') facing = 'down';
    var back = (facing === 'up');
    var value = num(o.value, 0);

    /* ── 动画：和图片立绘共用同一套 charAnim ─────────────── */
    var an = charAnim(o, t, anim);
    ctx.globalAlpha *= an.alpha;
    ctx.translate(an.dx, an.dy);
    /* 与图片立绘保持一致：往右走才镜像（尾巴拖在身后） */
    if (facing === 'right') ctx.scale(-1, 1);
    ctx.rotate(an.rot);
    ctx.translate(0, 0.47);              /* 以"脚"为支点做压扁拉伸 */
    ctx.scale(an.sx, an.sy);
    ctx.translate(0, -0.47);
    var bob = 0;                          /* 位移已经在 an 里了 */
    var sway = Math.sin(t * (moving ? 8.2 : 1.8)) * (moving ? 1.0 : 0.45);   /* 头发/裙摆摆幅 */

    /* ── 落地投影 ── */
    if (px >= 20) {
      ctx.globalAlpha = A * 0.24;
      ctx.fillStyle = '#04070f';
      epath(ctx, 0, 0.475 - bob, 0.28, 0.055);
      ctx.fill();
      ctx.globalAlpha = A;

    /* ── 鲸鱼尾（身后） ── */
    gWhaleTail(ctx, px, t, moving);

    /* ── 背后的大团长发 ── */
    gBackHairPath(ctx, sway);
    ctx.fillStyle = gHairGrad(ctx);
    ctx.fill();
    if (px >= DETAIL_S) {
      ctx.save();
      gBackHairPath(ctx, sway);
      ctx.clip();
      ctx.globalAlpha = A * 0.30;
      ctx.fillStyle = G_HAIR_LIT;
      for (var hs = 0; hs < 3; hs++) {
        var hx = -0.30 + hs * 0.24 + sway * 0.02;
        epathRot(ctx, hx, 0.06, 0.035, 0.30, 0.10);
        ctx.fill();

      ctx.globalAlpha = A;
      ctx.restore();

    /* ── 鱼鳍耳（两侧） ── */
    var flap = Math.sin(t * (moving ? 9.0 : 2.4)) * 0.16;

    gFinEar(ctx, px, 1, flap);

    /* ── 腿 / 白袜 / 小皮鞋 ── */
    ctx.fillStyle = G_WHITE;
    rrect(ctx, -0.105, 0.36, 0.075, 0.09, 0.022); ctx.fill();
    rrect(ctx, 0.030, 0.36, 0.075, 0.09, 0.022); ctx.fill();
    ctx.fillStyle = '#20264f';
    rrect(ctx, -0.115, 0.425, 0.095, 0.048, 0.020); ctx.fill();
    rrect(ctx, 0.020, 0.425, 0.095, 0.048, 0.020); ctx.fill();

    /* ── 裙子 ── */
    ctx.beginPath();
    ctx.moveTo(-0.125, -0.005);
    ctx.lineTo(0.125, -0.005);
    ctx.bezierCurveTo(0.155, 0.09, 0.20, 0.19, 0.255, 0.285);
    ctx.quadraticCurveTo(0, 0.365, -0.255, 0.285);
    ctx.bezierCurveTo(-0.20, 0.19, -0.155, 0.09, -0.125, -0.005);
    ctx.closePath();
    ctx.fillStyle = gDressGrad(ctx);
    ctx.fill();
    /* 裙摆白荷叶边 */
    ctx.fillStyle = G_WHITE;
    ctx.beginPath();
    ctx.moveTo(-0.255, 0.285);
    ctx.quadraticCurveTo(0, 0.365, 0.255, 0.285);
    ctx.quadraticCurveTo(0.25, 0.345, 0.215, 0.345);
    ctx.quadraticCurveTo(0, 0.40, -0.215, 0.345);
    ctx.quadraticCurveTo(-0.25, 0.345, -0.255, 0.285);
    ctx.closePath();
    ctx.fill();
    if (px >= DETAIL_S) {
      ctx.strokeStyle = G_WHITE_SH;
      lw(ctx, px, 0.008, 0.5);
      for (var f = -2; f <= 2; f++) {
        ctx.beginPath();
        ctx.moveTo(f * 0.085, 0.30);
        ctx.quadraticCurveTo(f * 0.085, 0.345, f * 0.085 + 0.03, 0.355);
        ctx.stroke();
      }
    }
    /* 泡泡袖 */
    ctx.fillStyle = G_DRESS_L;
    epath(ctx, -0.145, 0.045, 0.055, 0.052); ctx.fill();
    epath(ctx, 0.145, 0.045, 0.055, 0.052); ctx.fill();
    /* 手 */
    ctx.fillStyle = G_SKIN;
    epath(ctx, -0.165, 0.105, 0.035, 0.040); ctx.fill();
    epath(ctx, 0.165, 0.105, 0.035, 0.040); ctx.fill();

    /* ── 白围裙 ── */
    if (!back) {
      ctx.beginPath();
      ctx.moveTo(-0.072, 0.005);
      ctx.lineTo(0.072, 0.005);
      ctx.bezierCurveTo(0.10, 0.09, 0.13, 0.16, 0.165, 0.245);
      ctx.quadraticCurveTo(0, 0.31, -0.165, 0.245);
      ctx.bezierCurveTo(-0.13, 0.16, -0.10, 0.09, -0.072, 0.005);
      ctx.closePath();
      ctx.fillStyle = G_WHITE;
      ctx.fill();
      if (px >= DETAIL_S) {
        ctx.strokeStyle = G_WHITE_SH;
        lw(ctx, px, 0.008, 0.5);
        ctx.stroke();
      }
      gWhaleMark(ctx, px, 0, 0.155, 1);
    }

    /* ── 胸口领结 + 蓝宝石 ── */
    if (!back) {
      ctx.fillStyle = G_DRESS_L;
      ctx.beginPath();
      ctx.moveTo(-0.005, 0.005);
      ctx.lineTo(-0.062, -0.026);
      ctx.lineTo(-0.055, 0.036);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0.005, 0.005);
      ctx.lineTo(0.062, -0.026);
      ctx.lineTo(0.055, 0.036);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = G_GEM;
      epath(ctx, 0, 0.006, 0.024, 0.024);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      epath(ctx, -0.008, -0.004, 0.008, 0.008);
      ctx.fill();
    }

    /* ── 头 ── */
    gFacePath(ctx);
    ctx.fillStyle = G_SKIN;
    ctx.fill();
    if (!back && px >= DETAIL_S) {
      ctx.save();
      gFacePath(ctx);
      ctx.clip();
      ctx.globalAlpha = A * 0.35;
      ctx.fillStyle = G_SKIN_SH;
      epath(ctx, 0.10, 0.0, 0.10, 0.10);
      ctx.fill();
      ctx.globalAlpha = A;
      ctx.restore();

    if (!back) {

      /* 眼球朝向：镜像是"往右走才翻"，所以左右两个方向都要往本地 -x 偏，
         翻过来之后才正好看向行进方向 */
      var look = (facing === 'left' || facing === 'right') ? -0.62 : 0;
      var closed = !!o.blink || (t % 3.9) > 3.78;
      var xeye = (hurt > 0.35 || dead);
      var ey = -0.155;
      var squint = bowl && !closed && !xeye;
      gEye(ctx, px, -0.088, ey, 0.052, squint ? 0.042 : 0.070, look, closed, xeye);
      gEye(ctx, px, 0.088, ey, 0.052, squint ? 0.042 : 0.070, look, closed, xeye);
      /* 嘴 */
      if (dead || hurt > 0.6) {
        ctx.fillStyle = '#4a1522';
        epath(ctx, 0, -0.045, 0.026, 0.020);
        ctx.fill();
      } else {
        ctx.strokeStyle = 'rgba(120,60,60,0.85)';
        ctx.lineCap = 'round';
        lw(ctx, px, 0.012, 0.7);
        ctx.beginPath();
        ctx.moveTo(-0.022, -0.052);
        ctx.quadraticCurveTo(0, -0.028, 0.022, -0.052);
        ctx.stroke();
      }
      /* 腮红 */
      if (px >= DETAIL_S && !xeye) {
        ctx.globalAlpha = A * 0.42;
        ctx.fillStyle = '#ff9d9d';
        epath(ctx, -0.155, -0.085, 0.040, 0.024);
        ctx.fill();
        epath(ctx, 0.155, -0.085, 0.040, 0.024);
        ctx.fill();
        ctx.globalAlpha = A;
      }
    }

    /* ── 刘海 ── */
    gBangsPath(ctx, sway);
    ctx.fillStyle = gHairGrad(ctx);
    ctx.fill();
    if (px >= DETAIL_S) {
      ctx.save();
      gBangsPath(ctx, sway);
      ctx.clip();
      ctx.globalAlpha = A * 0.35;
      ctx.fillStyle = G_HAIR_LIT;
      epathRot(ctx, -0.02, -0.34, 0.15, 0.038, -0.12);
      ctx.fill();
      ctx.globalAlpha = A;
      ctx.restore();
    }
    /* ── 侧发 ── */
    gLockPath(ctx, -1, sway);
    ctx.fillStyle = gHairGrad(ctx);
    ctx.fill();
    gLockPath(ctx, 1, sway);
    ctx.fill();

    if (!back) {
      /* ── 蕾丝发带（白色扇贝边） ── */
      ctx.save();
      ctx.strokeStyle = G_WHITE;
      ctx.lineCap = 'round';
      lw(ctx, px, 0.052, 1.2);
      ctx.beginPath();
      ctx.arc(0, -0.185, 0.222, PI * 1.16, PI * 1.84);
      ctx.stroke();
      if (px >= DETAIL_S) {
        ctx.fillStyle = '#ffffff';
        for (var s = 0; s <= 7; s++) {
          var ang = PI * 1.16 + (PI * 0.68) * (s / 7);
          epath(ctx, Math.cos(ang) * 0.222, -0.185 + Math.sin(ang) * 0.222, 0.030, 0.030);
          ctx.fill();
        }
        ctx.strokeStyle = G_WHITE_SH;
        lw(ctx, px, 0.008, 0.4);
        ctx.beginPath();
        ctx.arc(0, -0.185, 0.196, PI * 1.16, PI * 1.84);
        ctx.stroke();
      }
      ctx.restore();
      /* ── 发侧蓝蝴蝶结 ── */
      ctx.save();
      ctx.translate(0.20, -0.27);
      ctx.rotate(-0.25);
      ctx.fillStyle = '#4f7fe0';
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(-0.075, -0.048); ctx.lineTo(-0.075, 0.048); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(0.075, -0.048); ctx.lineTo(0.075, 0.048); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#2f4fae';
      epath(ctx, 0, 0, 0.018, 0.022);
      ctx.fill();
      ctx.restore();
    }

    /* ── 呆毛 ── */
    ctx.strokeStyle = G_HAIR_MID;
    ctx.lineCap = 'round';
    lw(ctx, px, 0.028, 1);
    var ah = Math.sin(t * 2.6) * 0.02;
    ctx.beginPath();
    ctx.moveTo(0.01, -0.43);
    ctx.quadraticCurveTo(-0.10 + ah, -0.53, 0.03 + ah, -0.575);
    ctx.stroke();

    /* ── 铁盆 ── */
    if (bowl) drawGirlBasin(ctx, o, t, px);

    /* ── 受击红描边 / 死亡灰化 ── */
    if (hurt > 0) {
      ctx.save();
      ctx.strokeStyle = C.danger;
      lw(ctx, px, 0.030, 1.3);
      ctx.globalAlpha = A * (0.35 + 0.65 * hurt);
      if (px >= SHADOW_S) {
        ctx.shadowColor = 'rgba(255,93,108,0.85)';
        ctx.shadowBlur = clamp(px * 0.40 * hurt, 0, 24);
      }
      ctx.beginPath();
      ctx.arc(0, -0.17, 0.225, PI * 1.02, PI * 1.98);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-0.24, 0.02);
      ctx.quadraticCurveTo(0, 0.40, 0.24, 0.02);
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = A;
      ctx.restore();
    }
    if (dead) {
      ctx.globalAlpha = A * 0.40;
      ctx.fillStyle = '#7f93b5';
      ctx.beginPath();
      ctx.arc(0, -0.17, 0.23, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-0.24, 0.0);
      ctx.quadraticCurveTo(0, 0.40, 0.24, 0.0);
      ctx.lineTo(0.24, -0.10);
      ctx.lineTo(-0.24, -0.10);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = A;
    }
  }

  function drawAssetImage(ctx, entry, px, hurt) {
    var img = entry.img;
    var iw = img.naturalWidth || img.width || 0;
    var ih = img.naturalHeight || img.height || 0;
    if (!(iw > 0) || !(ih > 0)) return;
    var b = entry.box || { sx: 0, sy: 0, sw: iw, sh: ih };
    /* 高度按 1.06 格缩放到格子上，底边压住格子下沿（脚踩在地上），水平居中 */
    var k = (px * 1.06) / b.sh;
    var w = b.sw * k, h = b.sh * k;
    if (w > px * 1.55) { k *= (px * 1.55) / w; w = b.sw * k; h = b.sh * k; }
    var dx = -w / 2, dy = px * 0.47 - h;
    ctx.save();
    /* 注意：这里已经是"以格心为原点、单位 = 1 CSS 像素"的坐标系（调用方 scale(px,px)
       只用在程序化画法那条分支上），所以 dx/dy/w/h 直接就是像素值，不能再除以 px，
       否则整张立绘会被画成 1 像素高、看着像没显示。 */
    ctx.drawImage(img, b.sx, b.sy, b.sw, b.sh, dx, dy, w, h);
    if (hurt > 0.02 && entry.tint) {
      ctx.globalAlpha *= clamp01(hurt) * 0.95;
      ctx.drawImage(entry.tint, b.sx, b.sy, b.sw, b.sh, dx, dy, w, h);
    }
    ctx.restore();
  }

  function fish(ctx, x, y, s, o) {
    if (!ctx || !(s > 0) || !finite2(x) || !finite2(y)) return;
    o = o || {};
    var a = clamp01(num(o.alpha, 1));
    if (a <= 0) return;
    var px = s * clamp(num(o.scale, 1), 0.05, 6);
    var t = timeOf(o);
    ctx.save();
    try {
      ctx.globalAlpha *= a;
      ctx.translate(x, y);
      var plain = assetEntry('fish');
      var bowlArt = o.bowl ? assetEntry('fish_bowl') : null;
      var entry = bowlArt || plain;
      if (entry) {
        /* 图片立绘：所有动画都靠变换做（浮动 / 小跳 / 压扁拉伸 / 摇摆 / 翻倒 / 出生弹入）
           注意坐标系：这里单位是 CSS 像素，而 charAnim 的位移是以"格"为单位的，所以要乘 px
           镜像方向：立绘的鲸鱼尾/蝴蝶结画在画面右侧（即"背后"朝右），
           所以往右走才镜像，让尾巴始终拖在身后 */
        var an = charAnim(o, t);
        ctx.globalAlpha *= an.alpha;
        ctx.translate(an.dx * px, an.dy * px);
        if (o.facing === 'right') ctx.scale(-1, 1);
        ctx.rotate(an.rot);
        ctx.translate(0, px * 0.47);          /* 以"脚"为支点 */
        ctx.scale(an.sx, an.sy);
        ctx.translate(0, -px * 0.47);
        drawAssetImage(ctx, entry, px, num(o.hurt, 0));
        if (o.bowl && !bowlArt) {
          /* 只给了常态立绘、没给戴盆立绘时，把程序化的不锈钢盆扣上去 */
          ctx.scale(px, px);
          drawGirlBasin(ctx, o, t, px);
        }
        return;
      }
      ctx.scale(px, px);
      drawGirl(ctx, o, t, px);
    } finally {
      ctx.restore();
    }
  }

  /* ════════════════════════════════════════════════════════════
     5. 大白饭 / 铁盆大白饭
     ════════════════════════════════════════════════════════════ */
  function drawMound(ctx, o, t, px) {
    var A = ctx.globalAlpha;
    var value = num(o.value, 1);

    /* 饭团本体：顶部尖尖的米白山形 */
    ctx.beginPath();
    ctx.moveTo(-0.35, 0.20);
    ctx.bezierCurveTo(-0.31, -0.10, -0.21, -0.34, 0.00, -0.44);
    ctx.bezierCurveTo(0.21, -0.34, 0.31, -0.10, 0.35, 0.20);
    ctx.closePath();
    ctx.fillStyle = riceGrad(ctx);
    ctx.fill();

    /* 受光面 + 暗面（用裁剪内的两块色，替代每帧新建渐变） */
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-0.35, 0.20);
    ctx.bezierCurveTo(-0.31, -0.10, -0.21, -0.34, 0.00, -0.44);
    ctx.bezierCurveTo(0.21, -0.34, 0.31, -0.10, 0.35, 0.20);
    ctx.closePath();
    ctx.clip();
    ctx.globalAlpha = A * 0.85;
    ctx.fillStyle = C.riceDark;
    epathRot(ctx, 0.30, 0.10, 0.24, 0.30, 0.35);
    ctx.fill();
    ctx.globalAlpha = A * 0.75;
    ctx.fillStyle = '#fffdf6';
    epathRot(ctx, -0.16, -0.20, 0.16, 0.22, -0.25);
    ctx.fill();
    ctx.globalAlpha = A;

    /* 米粒细节 */
    if (px >= DETAIL_S) {
      var grains = 3 + (value >= 5 ? 1 : 0) + (value >= 20 ? 1 : 0);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      for (var i = 0; i < grains; i++) {
        var gx = -0.16 + i * 0.085, gy = -0.22 + Math.sin(i * 2.1) * 0.10;
        epathRot(ctx, gx, gy, 0.030, 0.016, -0.5);
        ctx.fill();
      }
      ctx.globalAlpha = A * 0.5;
      ctx.fillStyle = C.riceDark;
      epathRot(ctx, 0.14, 0.02, 0.032, 0.017, -0.4);
      ctx.fill();
      ctx.globalAlpha = A;
    }
    ctx.restore();
  }

  function drawBowl(ctx, metal, t, px) {
    var A = ctx.globalAlpha;
    /* 碗体（浅灰 / 金属） */
    ctx.beginPath();
    ctx.moveTo(-0.45, 0.10);
    ctx.lineTo(0.45, 0.10);
    ctx.quadraticCurveTo(0.38, 0.47, 0.00, 0.47);
    ctx.quadraticCurveTo(-0.38, 0.47, -0.45, 0.10);
    ctx.closePath();
    ctx.fillStyle = bowlGrad(ctx, metal);
    ctx.fill();

    if (metal) {
      /* 金属：竖向高光条 + 底部反光 + 两道凹痕 */
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(-0.45, 0.10);
      ctx.lineTo(0.45, 0.10);
      ctx.quadraticCurveTo(0.38, 0.47, 0.00, 0.47);
      ctx.quadraticCurveTo(-0.38, 0.47, -0.45, 0.10);
      ctx.closePath();
      ctx.clip();
      ctx.globalAlpha = A * 0.55;
      ctx.fillStyle = '#ffffff';
      rrect(ctx, -0.20, 0.12, 0.075, 0.34, 0.035);
      ctx.fill();
      ctx.globalAlpha = A * 0.30;
      rrect(ctx, 0.07, 0.14, 0.045, 0.26, 0.022);
      ctx.fill();
      ctx.globalAlpha = A * 0.35;
      ctx.fillStyle = '#e9eef7';
      epath(ctx, 0.0, 0.44, 0.26, 0.045);
      ctx.fill();
      ctx.globalAlpha = A;
      ctx.restore();
      ctx.strokeStyle = A_DENT;
      lw(ctx, px, 0.016, 0.7);
      ctx.beginPath(); ctx.moveTo(-0.34, 0.26); ctx.quadraticCurveTo(0, 0.34, 0.34, 0.26); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-0.22, 0.38); ctx.quadraticCurveTo(0, 0.44, 0.22, 0.38); ctx.stroke();
    } else {
      /* 陶碗：一条淡淡的暗边 */
      ctx.strokeStyle = 'rgba(120,126,146,0.45)';
      lw(ctx, px, 0.014, 0.6);
      ctx.beginPath(); ctx.moveTo(-0.30, 0.32); ctx.quadraticCurveTo(0, 0.38, 0.30, 0.32); ctx.stroke();
    }

    /* 碗沿：一圈亮边 */
    ctx.fillStyle = metal ? '#dfe6f1' : '#f4f6fa';
    epath(ctx, 0, 0.085, 0.465, 0.055);
    ctx.fill();
    if (metal) {
      ctx.strokeStyle = '#ffffff';
      lw(ctx, px, 0.016, 0.7);
      ctx.globalAlpha = A * 0.85;
      ctx.beginPath();
      if (HAS_ELLIPSE) {
        ctx.ellipse(0, 0.078, 0.452, 0.042, 0, PI, TAU);
      } else {
        ctx.arc(0, 0.078, 0.30, PI, TAU);
      }
      ctx.stroke();
      ctx.globalAlpha = A;
    }
  }

  function drawSteam(ctx, t, px) {
    if (px < 18) return;
    var A = ctx.globalAlpha;
    ctx.strokeStyle = '#ffffff';
    ctx.lineCap = 'round';
    lw(ctx, px, 0.028, 0.9);
    for (var i = 0; i < 3; i++) {
      var ph = ((t * 0.55) + i * 0.33) % 1;
      var y0 = -0.42 - ph * 0.62;
      var x0 = STEAM_X[i] + Math.sin(ph * 6.4 + i * 1.7) * 0.055;
      ctx.globalAlpha = A * Math.sin(ph * PI) * 0.40;
      ctx.beginPath();
      ctx.moveTo(x0 - 0.015, y0 + 0.16);
      ctx.quadraticCurveTo(x0 + 0.065, y0 + 0.08, x0 - 0.010, y0);
      ctx.quadraticCurveTo(x0 - 0.065, y0 - 0.08, x0 + 0.020, y0 - 0.17);
      ctx.stroke();
    }
    ctx.globalAlpha = A;
  }

  function drawRiceGlow(ctx, o, t) {
    var glow = clamp01(num(o.glow, 0));
    if (glow <= 0) return;
    var A = ctx.globalAlpha;
    ctx.fillStyle = C.gold;
    ctx.globalAlpha = A * 0.18 * glow;
    epath(ctx, 0, -0.06, 0.60 + 0.04 * Math.sin(t * 4), 0.60);
    ctx.fill();
    ctx.globalAlpha = A * 0.22 * glow;
    epath(ctx, 0, -0.06, 0.46, 0.46);
    ctx.fill();
    ctx.globalAlpha = A;
  }

  function rice(ctx, x, y, s, o) {
    if (!ctx || !(s > 0) || !finite2(x) || !finite2(y)) return;
    o = o || {};
    var a = clamp01(num(o.alpha, 1));
    if (a <= 0) return;
    var px = s * clamp(num(o.scale, 1), 0.05, 6);
    var t = timeOf(o);
    ctx.save();
    try {
      ctx.globalAlpha *= a;
      ctx.translate(x, y);
      ctx.scale(px, px);
      drawRiceGlow(ctx, o, t);
      drawMound(ctx, o, t, px);
      drawBowl(ctx, false, t, px);
      drawSteam(ctx, t, px);
    } finally {
      ctx.restore();
    }
  }

  function bowlRice(ctx, x, y, s, o) {
    if (!ctx || !(s > 0) || !finite2(x) || !finite2(y)) return;
    o = o || {};
    var a = clamp01(num(o.alpha, 1));
    if (a <= 0) return;
    var px = s * clamp(num(o.scale, 1), 0.05, 6);
    var t = timeOf(o);
    ctx.save();
    try {
      ctx.globalAlpha *= a;
      ctx.translate(x, y);
      ctx.scale(px, px);
      drawRiceGlow(ctx, o, t);
      drawMound(ctx, o, t, px);
      drawBowl(ctx, true, t, px);
      drawSteam(ctx, t, px);
    } finally {
      ctx.restore();
    }
  }

  /* ════════════════════════════════════════════════════════════
     6. token（金色硬币）
     ════════════════════════════════════════════════════════════ */
  function drawToken(ctx, o, t, px) {
    var A = ctx.globalAlpha;
    var spin = Math.cos(t * 2.1);
    var rx = Math.abs(spin);
    var R = 0.40;
    var w = R * (0.10 + 0.90 * rx);

    /* 光晕 */
    if (px >= 16) {
      ctx.fillStyle = C.gold;
      ctx.globalAlpha = A * (0.12 + 0.05 * Math.sin(t * 3));
      epath(ctx, 0, 0, R * 1.55, R * 1.55);
      ctx.fill();
      ctx.globalAlpha = A * 0.14;
      epath(ctx, 0, 0, R * 1.20, R * 1.20);
      ctx.fill();
      ctx.globalAlpha = A;
    }

    /* 侧面厚度（转到侧面时露出的金边） */
    if (rx > 0.30) {
      ctx.fillStyle = C.goldDeep;
      epath(ctx, 0.022 * spin, 0, w, R);
      ctx.fill();
    }

    /* 币面 */
    epath(ctx, 0, 0, w, R);
    ctx.fillStyle = coinGrad(ctx);
    ctx.fill();
    ctx.strokeStyle = C.goldDeep;
    lw(ctx, px, 0.022, 0.9);
    ctx.stroke();

    if (rx > 0.42) {
      /* 内圈 */
      ctx.strokeStyle = 'rgba(184,128,26,0.75)';
      lw(ctx, px, 0.016, 0.7);
      epath(ctx, 0, 0, w * 0.80, R * 0.80);
      ctx.stroke();

      /* 旋转高光：一条扫过的斜光带 */
      if (px >= 16) {
        ctx.save();
        epath(ctx, 0, 0, w * 0.97, R * 0.97);
        ctx.clip();
        var sweep = ((t * 0.42) % 1) * 2.4 - 1.2;
        ctx.globalAlpha = A * 0.42;
        ctx.fillStyle = '#ffffff';
        ctx.save();
        ctx.translate(sweep * 0.5, 0);
        ctx.rotate(-0.5);
        ctx.fillRect(-0.09, -0.6, 0.18, 1.2);
        ctx.restore();
        ctx.restore();
        ctx.globalAlpha = A;
      }

      /* x 与 = 两个符号（跟着硬币一起透视压缩） */
      if (px >= 14 && rx > 0.48) {
        ctx.save();
        epath(ctx, 0, 0, w * 0.96, R * 0.96);
        ctx.clip();
        ctx.scale(Math.max(0.35, rx), 1);
        ctx.fillStyle = C.goldDark;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        var fs = Math.round(px * 0.42);
        textPx(ctx, px, 'x', fs, -R * 0.38, 0.01, 800, 1);
        textPx(ctx, px, '=', fs, R * 0.38, 0.01, 800, 1);
        ctx.restore();
      }
    }

    /* 随机星点闪光（确定性伪随机，s 不够大就不画粒子） */
    if (px >= 20) {
      ctx.strokeStyle = '#fff6d0';
      for (var i = 0; i < SPARK.length; i++) {
        var sp = SPARK[i];
        var ph = ((t * 0.42) + sp.ph) % 1;
        if (ph > 0.32) continue;
        var a2 = Math.sin(ph / 0.32 * PI);
        var sxp = sp.x * (0.55 + 0.85 * rx);
        star4(ctx, sxp, sp.y, sp.r * (0.55 + 0.55 * a2), A * a2 * 0.95);
      }
      ctx.globalAlpha = A;
    }
  }

  function token(ctx, x, y, s, o) {
    if (!ctx || !(s > 0) || !finite2(x) || !finite2(y)) return;
    o = o || {};
    var a = clamp01(num(o.alpha, 1));
    if (a <= 0) return;
    var px = s * clamp(num(o.scale, 1), 0.05, 6);
    var t = timeOf(o);
    ctx.save();
    try {
      ctx.globalAlpha *= a;
      ctx.translate(x, y);
      ctx.scale(px, px);
      drawToken(ctx, o, t, px);
    } finally {
      ctx.restore();
    }
  }

  /* ════════════════════════════════════════════════════════════
     7. Claude 娘
     ════════════════════════════════════════════════════════════ */
  var fmtCache = {};
  function fmtFactor(f) {
    var v = num(f, 1);
    var hit = fmtCache[v];
    if (hit !== undefined) return hit;
    var out;
    if (G.expr && typeof G.expr.fmtNum === 'function') {
      try { out = String(G.expr.fmtNum(v)); } catch (e) { out = null; }
    }
    if (out === null || out === undefined) {
      out = (Math.abs(v - Math.round(v)) < 1e-9) ? String(Math.round(v)) : String(Math.round(v * 100) / 100);
    }
    var n = 0;
    for (var k in fmtCache) { if (Object.prototype.hasOwnProperty.call(fmtCache, k)) n++; }
    if (n > 64) fmtCache = {};
    fmtCache[v] = out;
    return out;
  }

  /** 星芒发饰：8 根短射线（米白） */
  function drawStarPin(ctx, px, t, happy) {
    var A = ctx.globalAlpha;
    ctx.save();
    ctx.translate(0.09, -0.40);
    ctx.rotate(t * 0.28);
    ctx.strokeStyle = C.rice;
    ctx.lineCap = 'round';
    lw(ctx, px, 0.026, 0.8);
    ctx.beginPath();
    for (var i = 0; i < 8; i++) {
      var a = i * TAU / 8;
      var r0 = 0.036, r1 = 0.036 + (i % 2 === 0 ? 0.062 : 0.040);
      ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0);
      ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1);
    }
    ctx.stroke();
    ctx.fillStyle = happy ? C.gold : C.rice;
    epath(ctx, 0, 0, 0.030, 0.030);
    ctx.fill();
    ctx.globalAlpha = A * 0.55;
    ctx.strokeStyle = '#ffffff';
    lw(ctx, px, 0.012, 0.5);
    epath(ctx, 0, 0, 0.014, 0.014);
    ctx.stroke();
    ctx.globalAlpha = A;
    ctx.restore();
  }

  function drawClaude(ctx, o, t, px) {
    var A = ctx.globalAlpha;
    var happy = !!o.happy;
    var factorTxt = '×' + fmtFactor(o.factor);
    var bob = Math.sin(t * 1.8) * 0.035;
    var sway = Math.sin(t * 1.3) * 0.022;

    ctx.translate(0, bob);
    ctx.rotate(sway);

    /* ── 腿 / 鞋 ─────────────────────────────────────────── */
    ctx.fillStyle = C.skin;
    rrect(ctx, -0.105, 0.20, 0.075, 0.20, 0.036); ctx.fill();
    rrect(ctx, 0.030, 0.20, 0.075, 0.20, 0.036); ctx.fill();
    ctx.fillStyle = '#4a3340';
    rrect(ctx, -0.125, 0.375, 0.115, 0.085, 0.038); ctx.fill();
    rrect(ctx, 0.015, 0.375, 0.115, 0.085, 0.038); ctx.fill();

    /* ── 后发（在身体后面） ───────────────────────────────── */
    ctx.fillStyle = hairGrad(ctx, true);
    ctx.beginPath();
    ctx.moveTo(-0.235, -0.24);
    ctx.quadraticCurveTo(-0.31, -0.02, -0.22, 0.12);
    ctx.quadraticCurveTo(-0.10, 0.18, 0.00, 0.12);
    ctx.quadraticCurveTo(0.10, 0.18, 0.22, 0.12);
    ctx.quadraticCurveTo(0.31, -0.02, 0.235, -0.24);
    ctx.quadraticCurveTo(0.0, -0.44, -0.235, -0.24);
    ctx.closePath();
    ctx.fill();

    /* ── 吊带裙（橙色） + 白衬衫 ─────────────────────────── */
    ctx.fillStyle = '#fbf8f0';
    rrect(ctx, -0.155, -0.11, 0.31, 0.20, 0.055); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-0.045, -0.10); ctx.lineTo(0.0, -0.01); ctx.lineTo(0.045, -0.10);
    ctx.lineTo(0.0, -0.06); ctx.closePath();
    ctx.fillStyle = '#e9e2d2';
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-0.135, -0.02);
    ctx.lineTo(0.135, -0.02);
    ctx.quadraticCurveTo(0.20, 0.18, 0.245, 0.30);
    ctx.lineTo(-0.245, 0.30);
    ctx.quadraticCurveTo(-0.20, 0.18, -0.135, -0.02);
    ctx.closePath();
    ctx.fillStyle = dressGrad(ctx);
    ctx.fill();
    /* 裙摆暗边 + 褶 */
    ctx.fillStyle = 'rgba(140,70,48,0.55)';
    ctx.fillRect(-0.245, 0.268, 0.49, 0.034);
    if (px >= DETAIL_S) {
      ctx.strokeStyle = 'rgba(140,70,48,0.40)';
      lw(ctx, px, 0.010, 0.5);
      ctx.beginPath();
      ctx.moveTo(-0.09, 0.02); ctx.lineTo(-0.13, 0.28);
      ctx.moveTo(0.09, 0.02); ctx.lineTo(0.13, 0.28);
      ctx.stroke();
    }
    /* 吊带 */
    ctx.strokeStyle = C.orangeDeep;
    lw(ctx, px, 0.020, 0.7);
    ctx.beginPath();
    ctx.moveTo(-0.10, -0.10); ctx.lineTo(-0.075, 0.02);
    ctx.moveTo(0.10, -0.10); ctx.lineTo(0.075, 0.02);
    ctx.stroke();

    /* ── 手臂（把牌子抱在胸前） ───────────────────────────── */
    ctx.strokeStyle = C.skin;
    ctx.lineCap = 'round';
    lw(ctx, px, 0.062, 1.6);
    ctx.beginPath();
    ctx.moveTo(-0.145, -0.045); ctx.lineTo(-0.20, 0.14);
    ctx.moveTo(0.145, -0.045); ctx.lineTo(0.20, 0.14);
    ctx.stroke();
    /* 白衬衫袖口 */
    ctx.strokeStyle = '#fbf8f0';
    lw(ctx, px, 0.075, 1.8);
    ctx.beginPath();
    ctx.moveTo(-0.165, 0.015); ctx.lineTo(-0.185, 0.075);
    ctx.moveTo(0.165, 0.015); ctx.lineTo(0.185, 0.075);
    ctx.stroke();

    /* ── 牌子 ─────────────────────────────────────────────── */
    var sw = 0.50, sh = 0.235, sy = 0.115;
    ctx.save();
    ctx.translate(0, sy);
    ctx.rotate(Math.sin(t * 2.4) * 0.02);
    ctx.fillStyle = 'rgba(8,14,26,0.30)';
    rrect(ctx, -sw / 2 + 0.012, -sh / 2 + 0.020, sw, sh, 0.045); ctx.fill();
    ctx.fillStyle = C.rice;
    rrect(ctx, -sw / 2, -sh / 2, sw, sh, 0.045); ctx.fill();
    ctx.strokeStyle = C.orangeDeep;
    lw(ctx, px, 0.020, 0.8);
    rrect(ctx, -sw / 2, -sh / 2, sw, sh, 0.045); ctx.stroke();
    ctx.fillStyle = C.orangeDeep;
    ctx.fillRect(-sw / 2 + 0.025, -sh / 2 + 0.030, sw - 0.05, 0.018);
    if (px >= 14) {
      var fs = px * 0.20 * Math.min(1, 3.4 / (factorTxt.length + 0.8));
      ctx.fillStyle = C.orangeDark;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      textPx(ctx, px, factorTxt, fs, 0, 0.020, 800, 0);
    }
    ctx.restore();
    /* 手（抱牌） */
    ctx.fillStyle = C.skin;
    epath(ctx, -0.235, 0.135, 0.038, 0.038); ctx.fill();
    epath(ctx, 0.235, 0.135, 0.038, 0.038); ctx.fill();

    /* ── 头 ───────────────────────────────────────────────── */
    ctx.fillStyle = C.skin;
    epath(ctx, 0, -0.225, 0.185, 0.195); ctx.fill();
    ctx.fillStyle = 'rgba(224,183,156,0.55)';
    epath(ctx, 0.0, -0.13, 0.12, 0.06); ctx.fill();

    /* 侧发（会轻轻飘） */
    var swayH = Math.sin(t * 1.6) * 0.055;
    ctx.fillStyle = hairGrad(ctx, false);
    ctx.save();
    ctx.translate(-0.175, -0.24); ctx.rotate(swayH * 0.6);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-0.075, 0.14, -0.055, 0.30);
    ctx.quadraticCurveTo(0.005, 0.22, 0.035, 0.03);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.translate(0.175, -0.24); ctx.rotate(-swayH * 0.6);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(0.075, 0.14, 0.055, 0.30);
    ctx.quadraticCurveTo(-0.005, 0.22, -0.035, 0.03);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    /* 刘海：三团蓬松的弧 + 呆毛 */
    ctx.fillStyle = hairGrad(ctx, false);
    epath(ctx, -0.095, -0.290, 0.115, 0.105); ctx.fill();
    epath(ctx, 0.095, -0.290, 0.115, 0.105); ctx.fill();
    epath(ctx, 0.0, -0.320, 0.135, 0.115); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-0.19, -0.30);
    ctx.quadraticCurveTo(-0.02, -0.46, 0.19, -0.30);
    ctx.quadraticCurveTo(0.02, -0.38, -0.19, -0.30);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = hairGrad(ctx, false);
    lw(ctx, px, 0.026, 0.8);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0.03, -0.40);
    ctx.quadraticCurveTo(0.10 + swayH, -0.50, 0.055, -0.55);
    ctx.stroke();

    /* 星芒发饰 */
    drawStarPin(ctx, px, t, happy);
    /* 高兴时发饰周围冒两点八芒星 */
    if (happy && px >= 18) {
      ctx.strokeStyle = C.goldLight;
      for (var hi = 0; hi < 2; hi++) {
        var hph = ((t * 0.6) + hi * 0.5) % 1;
        star8(ctx, -0.10 + hi * 0.30, -0.42 - Math.sin(hph * PI) * 0.10, 0.05, A * Math.sin(hph * PI) * 0.9);
      }
      ctx.globalAlpha = A;
    }

    /* ── 脸 ───────────────────────────────────────────────── */
    var blink = (t % 3.3) > 3.18;
    if (happy && !blink) {
      ctx.strokeStyle = C.eye;
      lw(ctx, px, 0.020, 0.7);
      ctx.beginPath();
      ctx.moveTo(-0.105, -0.205); ctx.quadraticCurveTo(-0.075, -0.245, -0.045, -0.205);
      ctx.moveTo(0.045, -0.205); ctx.quadraticCurveTo(0.075, -0.245, 0.105, -0.205);
      ctx.stroke();
    } else if (blink) {
      ctx.strokeStyle = C.eye;
      lw(ctx, px, 0.018, 0.7);
      ctx.beginPath();
      ctx.moveTo(-0.105, -0.215); ctx.lineTo(-0.045, -0.215);
      ctx.moveTo(0.045, -0.215); ctx.lineTo(0.105, -0.215);
      ctx.stroke();
    } else {
      ctx.fillStyle = C.eye;
      epath(ctx, -0.075, -0.215, 0.028, 0.034); ctx.fill();
      epath(ctx, 0.075, -0.215, 0.028, 0.034); ctx.fill();
      ctx.fillStyle = '#ffffff';

      var p = this.playerPos || { x: eng.px, y: eng.py };
      var tx = p.x + 0.5, ty = p.y + 0.5;
      if (this.centerOn) { tx = this.centerOn.x + 0.5; ty = this.centerOn.y + 0.5; }
      var visW = v.w / this.tile, visH = v.h / this.tile;
      if (visW < lv.w) tx = clamp(tx, visW / 2, lv.w - visW / 2); else tx = lv.w / 2;
      if (visH < lv.h) ty = clamp(ty, visH / 2, lv.h - visH / 2); else ty = lv.h / 2;
      var k = Math.min(1, dt * 11);
      this.camX += (tx - this.camX) * k;
      this.camY += (ty - this.camY) * k;
      /* 镜头走远了就重烘视口 */
      if (this.bake && !this.bake.whole && this.bakeAnchor) {
        if (Math.abs(this.camX - this.bakeAnchor.x) > BAKE_TRIGGER ||
            Math.abs(this.camY - this.bakeAnchor.y) > BAKE_TRIGGER) {
          this.bakeViewport();
        }
      }
    }
    this.refreshOrigin();
  };

  /** 大肥鱼的绘制位置：连续位置 + 铁盆击退位移 */
  Renderer.prototype.playerDrawPos = function () {
    var eng = this.engine;
    var p = this.playerPos || { x: eng.px, y: eng.py };
    var x = p.x, y = p.y;
    if (this.lunge) {
      var s = Math.sin(Math.PI * Math.min(1, this.lunge.t)) * 0.55;
      x += this.lunge.dx * s;
      y += this.lunge.dy * s;
    }
    return { x: x, y: y };
  };

  /* ── 绘制 ─────────────────────────────────────────────── */
  Renderer.prototype.draw = function () {
    var ctx = this.ctx, lv = this.level, eng = this.engine;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, this.w, this.h);
    if (!lv || !eng) return;

    var sh = FX.shakeOffset();
    ctx.save();
    ctx.translate(sh[0], sh[1]);

    if (this.bake) {
      var b = this.bake;
      ctx.imageSmoothingEnabled = b.tile > this.tile * 1.02;
      ctx.drawImage(b.canvas,
        this.originX + b.ox * this.tile, this.originY + b.oy * this.tile,
        b.w * this.tile, b.h * this.tile);
    }

    var v = this.view;
    var x0 = Math.floor((v.x - this.originX) / this.tile) - 1;
    var y0 = Math.floor((v.y - this.originY) / this.tile) - 1;
    var x1 = Math.ceil((v.x + v.w - this.originX) / this.tile) + 1;
    var y1 = Math.ceil((v.y + v.h - this.originY) / this.tile) + 1;
    this.visible = { x0: x0, y0: y0, x1: x1, y1: y1 };

    var tile = this.tile;
    var detail = tile >= 12;
    var showRiceValue = tile >= 13;
    var els = lv.elements;
    if (!this.bubbles) this.bubbles = [];

    /* 元素：先画不显示数值的，再画白饭（数值标在饭上） */
    this.bubbles.length = 0;
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (el.x < x0 || el.x > x1 || el.y < y0 || el.y > y1) continue;
      if (eng.gone[el.id]) continue;
      var p = this.screenOf(el.x, el.y);
      var o = { t: this.t, revealed: eng.isRevealed(el), value: eng.value };
      if (el.type === 'door' || el.type === 'goal') {
        o.tier = el.tier || R.doorTier(el);
        o.req = el.req;
        o.isGoal = el.type === 'goal';
        o.passed = false;
      }
      if (el.type === 'claude') o.factor = el.factor;
      if (el.type === 'user') o.happy = null;
      if (el.type === 'token') o.expr = el.expr;
      S.element(ctx, el, p.x, p.y, tile, o);
      if (showRiceValue && (el.type === 'rice' || el.type === 'bowl_rice')) {
        this.drawValueOnRice(ctx, p.x, p.y, tile, el);
      }
    }

    /* 已通过的门留一圈淡痕 */
    for (var g = 0; g < lv.doors.length; g++) {
      var dr = lv.doors[g];
      if (!eng.gone[dr.id]) continue;
      if (dr.x < x0 || dr.x > x1 || dr.y < y0 || dr.y > y1) continue;
      var pp = this.screenOf(dr.x, dr.y);
      ctx.globalAlpha = 0.16;
      ctx.strokeStyle = '#7aa9ff';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(pp.x, pp.y, tile * 0.36, 0, 6.2832);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    /* 大肥鱼 */
    var pos = this.playerDrawPos();
    var sp = this.screenOf(pos.x - 0.5, pos.y - 0.5);
    this._playerScreen = sp;
    S.fish(ctx, sp.x, sp.y, tile * 1.12, {
      t: this.t,
      value: eng.value,
      facing: eng.facing,
      bowl: eng.bowl,
      moving: !!this.moving,
      stepT: this.playerAnim.stepT,
      spawn: this.playerAnim.spawn,
      winT: this.playerAnim.winT,
      deadT: this.playerAnim.deadT,
      hurt: this.hurt,
      dead: eng.status === 'lost'
    });

    if (detail) this.drawDoorLabels(ctx, x0, y0, x1, y1);

    var goal = lv.goal;
    if (goal && goal.type === 'hidden' && eng.isRevealed(goal) && !eng.gone[goal.id]) {
      var gp = this.screenOf(goal.x, goal.y);
      ctx.globalAlpha = 0.5 + 0.35 * Math.sin(this.t * 4);
      ctx.strokeStyle = '#a06bff';
      ctx.lineWidth = Math.max(1.4, tile * 0.07);
      ctx.beginPath();
      ctx.arc(gp.x, gp.y, tile * (0.55 + 0.08 * Math.sin(this.t * 4)), 0, 6.2832);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    if (this.following) {
      if (lv.goal && !eng.gone[lv.goal.id]) this.drawGoalArrow(ctx);
      this.drawMini(ctx);
    }

    ctx.save();
    FX.draw(ctx);
    ctx.restore();
    FX.drawFlash(ctx, this.w, this.h);
  };

  /* 白饭身上的数值：每颗饭的数值都是关卡数据单独给的 */
  Renderer.prototype.drawValueOnRice = function (ctx, cx, cy, tile, el) {
    var txt = G.expr.fmtNum(el.value);
    var fs = Math.max(7, Math.min(19, tile * 0.42));
    var key = (fs | 0) + '|' + txt;
    var tw = this._tw[key];
    ctx.font = '800 ' + fs + 'px ui-monospace, "Cascadia Mono", Consolas, monospace';
    if (tw === undefined) { tw = ctx.measureText(txt).width; this._tw[key] = tw; }
    /* 数字太宽就缩一号，保证不糊出格子 */
    if (tw > tile * 1.05 && fs > 7) {
      fs = Math.max(7, fs * (tile * 1.05) / tw);
      ctx.font = '800 ' + fs + 'px ui-monospace, "Cascadia Mono", Consolas, monospace';
      tw = ctx.measureText(txt).width;
    }
    var y = cy + tile * (el.type === 'bowl_rice' ? 0.06 : 0.04);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (tile >= 22) {
      /* 格子够大：给个随文字宽度自适应的底 */
      var padX = fs * 0.34, padY = fs * 0.16, w = tw + padX * 2, h = fs + padY * 2;
      var rx = cx - w / 2, ry = y - h / 2, rr = Math.min(h / 2, 6);
      ctx.beginPath();
      ctx.moveTo(rx + rr, ry);
      ctx.arcTo(rx + w, ry, rx + w, ry + h, rr);
      ctx.arcTo(rx + w, ry + h, rx, ry + h, rr);
      ctx.arcTo(rx, ry + h, rx, ry, rr);
      ctx.arcTo(rx, ry, rx + w, ry, rr);
      ctx.closePath();
      ctx.fillStyle = 'rgba(10,16,28,.55)';
      ctx.fill();
    }
    ctx.lineWidth = Math.max(2, fs * 0.3);
    ctx.strokeStyle = 'rgba(5,9,18,.92)';
    ctx.strokeText(txt, cx, y);
    ctx.fillStyle = el.value < 0 ? '#ffd7db' : '#ffffff';
    ctx.fillText(txt, cx, y);
  };

  /* 文字气泡：背景宽度 = 实测文字宽度 + 内边距 */
  Renderer.prototype.textBubble = function (ctx, cx, cy, text, opts) {
    opts = opts || {};
    var fs = opts.fs || 10;
    ctx.font = (opts.bold === false ? '' : '700 ') + fs + 'px ui-monospace, "Cascadia Mono", Consolas, monospace';
    var tw = ctx.measureText(text).width;
    var padX = fs * 0.62, padY = fs * 0.38;
    var w = tw + padX * 2, h = fs + padY * 2;
    var x = cx - w / 2, y = cy - h / 2;
    var r = Math.min(h / 2, 6);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fillStyle = opts.bg || 'rgba(8,14,26,.86)';
    ctx.fill();
    if (opts.stroke) { ctx.strokeStyle = opts.stroke; ctx.lineWidth = 1; ctx.stroke(); }
    ctx.fillStyle = opts.fg || '#dce9ff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, cx, cy + fs * 0.04);
    return w;
  };

  Renderer.prototype.drawDoorLabels = function (ctx, x0, y0, x1, y1) {
    var lv = this.level, eng = this.engine;
    var fs = Math.max(8, Math.min(14, this.tile * 0.30));
    /* 只写明"门槛 + 通过后怎么运算"，不透露当前数值能不能过 —— 让玩家自己算 */
    for (var i = 0; i < lv.doors.length; i++) {
      var d = lv.doors[i];
      if (eng.gone[d.id]) continue;
      if (d.x < x0 || d.x > x1 || d.y < y0 || d.y > y1) continue;
      var p = this.screenOf(d.x, d.y);
      var txt = '≥' + d.req + '　' + R.doorFormula(d);
      this.textBubble(ctx, p.x, p.y + this.tile * 0.74, txt, {
        fs: fs,
        bg: 'rgba(10,18,32,.90)',
        fg: '#dce9ff',
        stroke: 'rgba(122,170,255,.5)'
      });
    }
    var goal = lv.goal;
    if (goal && !eng.gone[goal.id] && !(goal.type === 'hidden' && !eng.isRevealed(goal))) {
      if (goal.x >= x0 && goal.x <= x1 && goal.y >= y0 && goal.y <= y1) {
        var gp = this.screenOf(goal.x, goal.y);
        this.textBubble(ctx, gp.x, gp.y + this.tile * 0.74, '终点 ≥' + goal.req, {
          fs: fs, bg: 'rgba(30,22,6,.92)', fg: '#ffe6a8', stroke: 'rgba(255,206,92,.55)'
        });
      }
    }
  };

  Renderer.prototype.drawGoalArrow = function (ctx) {
    var lv = this.level, v = this.view;
    var g = this.screenOf(lv.goal.x, lv.goal.y);
    if (g.x > v.x + 30 && g.x < v.x + v.w - 30 && g.y > v.y + 30 && g.y < v.y + v.h - 30) return;
    var cxp = v.x + v.w / 2, cyp = v.y + v.h / 2;
    var ang = Math.atan2(g.y - cyp, g.x - cxp);
    var rx = v.w / 2 - 26, ry = v.h / 2 - 26;
    var t = Math.min(Math.abs(rx / Math.cos(ang)), Math.abs(ry / Math.sin(ang)));
    var ax = cxp + Math.cos(ang) * t, ay = cyp + Math.sin(ang) * t;
    ctx.save();
    ctx.translate(ax, ay);
    ctx.rotate(ang);
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = '#ffce5c';
    ctx.beginPath();
    ctx.moveTo(14, 0); ctx.lineTo(-8, -9); ctx.lineTo(-3, 0); ctx.lineTo(-8, 9);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 0.9;
    ctx.font = '700 11px ui-monospace, Consolas, monospace';
    ctx.fillStyle = '#ffe6a8';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('终点 ≥' + lv.goal.req, ax + Math.cos(ang) * -34, ay + Math.sin(ang) * -34);
    ctx.globalAlpha = 1;
  };

  /* 左下角小地图 */
  Renderer.prototype.drawMini = function (ctx) {
    var lv = this.level, eng = this.engine, v = this.view;
    if (!this.mini) return;
    var maxW = Math.min(190, v.w * 0.26), maxH = Math.min(190, v.h * 0.30);
    var scale = Math.min(maxW / lv.w, maxH / lv.h);
    var mw = lv.w * scale, mh = lv.h * scale;
    var mx = v.x + 12, my = v.y + v.h - mh - 12;
    ctx.save();
    ctx.globalAlpha = 0.88;
    ctx.fillStyle = 'rgba(6,10,20,.72)';
    rrect(ctx, mx - 5, my - 5, mw + 10, mh + 10, 8);
    ctx.fill();
    ctx.strokeStyle = 'rgba(122,170,255,.28)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(this.mini, mx, my, mw, mh);
    ctx.imageSmoothingEnabled = true;

    /* 视口框 */
    var visW = v.w / this.tile, visH = v.h / this.tile;
    ctx.strokeStyle = 'rgba(255,255,255,.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(
      mx + (this.camX - visW / 2) * scale, my + (this.camY - visH / 2) * scale,
      visW * scale, visH * scale
    );

    /* 终点 */
    if (lv.goal && !eng.gone[lv.goal.id]) {
      ctx.fillStyle = '#ffce5c';
      ctx.beginPath();
      ctx.arc(mx + (lv.goal.x + 0.5) * scale, my + (lv.goal.y + 0.5) * scale, Math.max(2.4, scale), 0, 6.2832);
      ctx.fill();
    }
    /* 未通过的门（统一颜色，不透露数值够不够） */
    for (var i = 0; i < lv.doors.length; i++) {
      var d = lv.doors[i];
      if (eng.gone[d.id]) continue;
      ctx.fillStyle = '#7aa9ff';
      ctx.fillRect(mx + d.x * scale - 1, my + d.y * scale - 1, Math.max(2, scale * 1.6), Math.max(2, scale * 1.6));
    }
    /* 大肥鱼 */
    var p = this.playerPos || { x: eng.px, y: eng.py };
    ctx.fillStyle = '#7cc0ff';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(mx + (p.x + 0.5) * scale, my + (p.y + 0.5) * scale, Math.max(2.6, scale * 1.5), 0, 6.2832);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  };

  function rrect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ── 给 UI 用的：需要显示气泡的元素 ─────────────────────
     返回 [{el, x, y, cls, text}]，UI 负责渲染成 DOM 气泡
     （DOM 气泡宽度用 max-content，天然适配表达式长度）
     ────────────────────────────────────────────────────── */
  Renderer.prototype.focusBubbles = function () {
    var out = [];
    var lv = this.level, eng = this.engine;
    if (!lv || !eng) return out;
    var near = this.following ? 2 : 1;
    var tile = this.tile;
    var needDom = tile < 15;
    var list = [];
    for (var i = 0; i < lv.elements.length; i++) {
      var el = lv.elements[i];
      if (eng.gone[el.id]) continue;
      if (el.type === 'rice' || el.type === 'bowl_rice') continue;   /* 数值已经画在饭上了 */
      if (el.type === 'hidden' && !eng.isRevealed(el)) continue;
      var d = Math.max(Math.abs(el.x - eng.px), Math.abs(el.y - eng.py));
      if (d <= near || (el.type === 'goal' && d <= near + 2)) list.push({ el: el, d: d });
    }
    list.sort(function (a, b) { return a.d - b.d; });
    var max = needDom ? 4 : 2;
    for (var k = 0; k < list.length && out.length < max; k++) {
      var el2 = list[k].el;
      var p = this.screenOf(el2.x, el2.y);
      out.push({
        el: el2, x: p.x, y: p.y - tile * 0.66,
        cls: el2.type === 'claude' ? 'claude' : (el2.type === 'user' ? 'user' : (R.isDoorType(el2.type) ? 'door' : '')),
        text: bubbleText(el2, eng)
      });
    }
    return out;
  };

  /* 元素气泡：只写规则（门槛 / 表达式 / 倍率 / 条件），
     绝不预告"算出来是多少"或"现在能不能过" —— 那是玩家自己要算的部分 */
  function bubbleText(el, eng) {
    switch (el.type) {
      case 'rice': return '🍚 +' + el.value;
      case 'bowl_rice': return '🍚+' + el.value + ' +🥣';
      case 'token': return '<b>x =</b> ' + el.expr;
      case 'claude': return '<b>x × ' + el.factor + '</b>';
      case 'user': {
        var pen = typeof el.penalty === 'number' ? el.penalty : el.bonus;
        return '若 <b>' + el.cond + '</b>　则 <b style="color:#48e5a3">+' + el.bonus +
          '</b>，否则 <b style="color:#ff5d6c">−' + pen + '</b>';
      }
      case 'door':
        return R.doorTierName(el) + ' <b>≥' + el.req + '</b>　通过后 <b>' + R.doorFormula(el) + '</b>';
      case 'goal':
        return '终点门 <b>≥' + el.req + '</b>';
      case 'hidden':
        return '隐藏通关格 <b>≥' + el.req + '</b>　(数值到 ' + el.reveal + ' 显形)';
      default: return R.formula(el);
    }
  }

  G.Renderer = Renderer;
})(typeof window !== 'undefined' ? (window.DSF = window.DSF || {}) : (globalThis.DSF = globalThis.DSF || {}));

<script>
/* ─────────────────────────────────────────────────────────────

(function (G) {

    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol === undefined ? 0.5 : vol, t0 + Math.min(0.02, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    step:    function () { tone(180, 0.05, 'triangle', 0.12); },
    eat:     function () { tone(520, 0.09, 'square', 0.3, 780); noise(0.06, 0.14, 2200); },
    bowl:    function () { tone(300, 0.12, 'square', 0.3, 520); tone(880, 0.22, 'triangle', 0.26, 1320, 0.05); },
    coin:    function () { tone(760, 0.08, 'square', 0.3, 1180); tone(1180, 0.14, 'sine', 0.24, 1560, 0.05); },
    mul:     function () { tone(420, 0.1, 'sawtooth', 0.24, 840); tone(840, 0.16, 'sine', 0.22, 1260, 0.07); },
    'if-ok': function () { tone(660, 0.1, 'sine', 0.34, 990); tone(990, 0.16, 'sine', 0.3, 1320, 0.08); },
    'if-bad':function () { tone(300, 0.16, 'sawtooth', 0.3, 130); noise(0.12, 0.2, 900); },
    door:    function () { tone(240, 0.22, 'sawtooth', 0.24, 120); tone(180, 0.3, 'sine', 0.2, 90, 0.04); noise(0.18, 0.18, 700); },
    bowlbreak: function () { noise(0.28, 0.5, 3200); tone(1400, 0.16, 'square', 0.26, 500); tone(900, 0.26, 'triangle', 0.2, 260, 0.03); },
    fail:    function () { tone(220, 0.5, 'sawtooth', 0.34, 60); tone(160, 0.6, 'square', 0.24, 44, 0.05); noise(0.4, 0.3, 500); },
    win:     function () {

    },
    click:   function () { tone(660, 0.045, 'square', 0.16); },
    undo:    function () { tone(420, 0.08, 'sine', 0.2, 300); },

<script>
/* ─────────────────────────────────────────────────────────────
   verify.js —— 关卡校验器 / 最优解追踪 / 终点门槛反推
   ------------------------------------------------------------------
   1) trace(level)：按 level.solution 给出的最优解顺序，
      用 BFS 在「未消耗的非填充元素视为障碍」的地图上逐段寻路，
      再把整条路径交给真实规则引擎逐步模拟，得到每一步的真实数值。
   2) resolveAutoReqs(level)：把 req:'auto' 的门槛，
      按最优解到达该元素时的真实数值反推出来
         · 中转站门：默认 floor(到达值 × reqFrac)，reqFrac 默认 1.0
           —— 也就是「最优解走到这扇门时的真实数值」，即这扇门的极限数值。
           想让门宽松一点，在门的数据里写 reqFrac: 0.8 即可。
         · 终点门 / 隐藏通关格：到达值本身（策划案要求：最优值即标准值）
      然后带着真实门槛再跑一次 trace 复核，确保一定可通关。
   3) checkAll(specs)：把全部关卡建出来跑一遍，输出可读报告。
   ───────────────────────────────────────────────────────────── */
(function (G) {
  'use strict';

  var M = G.map, R = G.rules;
  var FLOOR = M.FLOOR;

  /* 各关规模下限（对应策划案第 6 节） */
  function sizeMinFor(id) {
    if (id <= 5) return [31, 31];        /* > 30×30 */
    if (id <= 8) return [41, 41];        /* > 40×40 */
    if (id <= 10) return [51, 51];       /* > 50×50 */
    if (id === 11) return [76, 76];      /* > 75×75 */
    if (id === 12) return [121, 121];    /* > 120×120 */
    return [0, 0];                       /* 自定义关卡不做规模限制 */
  }

  /* ── BFS 最短路 ───────────────────────────────────────── */
  function bfsPath(level, sx, sy, tx, ty, blocked) {
    var W = level.w, H = level.h;
    if (sx === tx && sy === ty) return [[sx, sy]];
    var start = sy * W + sx, goal = ty * W + tx;
    if (level.tiles[goal] !== FLOOR) return null;
    var prev = new Int32Array(W * H).fill(-1);
    var seen = new Uint8Array(W * H);
    var q = [start];
    seen[start] = 1;
    var head = 0;
    while (head < q.length) {
      var cur = q[head++];
      var cx = cur % W, cy = (cur - cx) / W;
      var nbs = [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]];
      for (var n = 0; n < 4; n++) {
        var nx = nbs[n][0], ny = nbs[n][1];
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        var k = ny * W + nx;
        if (seen[k]) continue;
        if (level.tiles[k] !== FLOOR) continue;
        if (k !== goal && blocked && blocked(nx, ny)) continue;
        seen[k] = 1;
        prev[k] = cur;
        if (k === goal) {
          var path = [], p = goal;
          while (p !== -1) { var px = p % W, py = (p - px) / W; path.push([px, py]); p = prev[p]; }
          path.reverse();
          return path;
        }
        q.push(k);
      }
    }
    return null;
  }

  function byId(level, id) {
    for (var i = 0; i < level.elements.length; i++) if (level.elements[i].id === id) return level.elements[i];
    return null;
  }

  /* ── 追踪最优解 ───────────────────────────────────────── */
  function trace(level, opts) {
    opts = opts || {};
    var eng = new G.Engine(level);
    var records = [], warnings = [], errors = [], fullPath = [[eng.px, eng.py]];
    var ids = (level.solution || []).slice();
    if (!ids.length) errors.push('关卡 ' + level.id + ' 没有写 solution（最优解顺序）');

    for (var i = 0; i < ids.length; i++) {
      var id = ids[i];
      var el = byId(level, id);
      if (!el) { errors.push('solution 里的 "' + id + '" 在地图上不存在'); break; }
      if (eng.gone[el.id]) { warnings.push(id + ' 在到达之前已被顺路吃掉，跳过'); continue; }

      var blocked = (function (e0) {
        return function (x, y) {
          var e = level.cellMap[y * level.w + x];
          if (!e) return false;
          if (e.filler) return false;
          if (eng.gone[e.id]) return false;
          if (e.id === e0.id) return false;
          return true;
        };
      })(el);

      var path = bfsPath(level, eng.px, eng.py, el.x, el.y, blocked);
      if (!path) {
        /* 宽松模式：允许穿过其它元素（会改变数值，记录下来） */
        path = bfsPath(level, eng.px, eng.py, el.x, el.y, null);
        if (path) {
          var crossed = [];
          for (var pc = 1; pc < path.length - 1; pc++) {
            var ce = eng.elementAt(path[pc][0], path[pc][1]);
            if (ce && !ce.filler) crossed.push(ce.id);
          }
          warnings.push('前往 ' + id + ' 的干净路线不存在，被迫穿过：' + (crossed.join(', ') || '（未知）'));
        }
      }
      if (!path) { errors.push('从当前位置走不到 ' + id + '（' + el.x + ',' + el.y + '）'); break; }

      var preVal = eng.value, lossless = true;
      for (var p = 1; p < path.length; p++) {
        preVal = eng.value;
        var ev = eng.step(path[p][0] - eng.px, path[p][1] - eng.py);
        fullPath.push([eng.px, eng.py]);
        if (ev.kind === 'bowl-block') lossless = false;
        if (eng.status !== 'playing') break;
      }
      records.push({
        id: id, type: el.type, at: [el.x, el.y],
        before: preVal, after: eng.value,
        gainedBowl: !!eng.bowl, status: eng.status, lossless: lossless
      });
      if (eng.status !== 'playing') break;
    }

    return {
      ok: eng.status === 'won',
      status: eng.status,
      reason: eng.reason,
      value: eng.value,
      records: records,
      warnings: warnings,
      errors: errors,
      path: fullPath,
      engine: eng,
      steps: eng.steps
    };
  }

  /* ── 门槛反推：把 'auto' 变成真实数字 ──────────────────
     两遍法：
       第一遍把所有 auto 门槛临时置 0（保证一定能过），跑出每一步的真实到达值；
       第二遍按到达值算出真实门槛，再跑一次复核。
     ──────────────────────────────────────────────────── */
  function resolveAutoReqs(level) {
    var autos = [];
    level.elements.forEach(function (el) {
      var dirty = false;
      if (el.req === 'auto') { el.reqAuto = true; el.req = 0; dirty = true; }
      if (el.reveal === 'auto') { el.revealAuto = true; el.reveal = 0; dirty = true; }
      if (dirty) autos.push(el);
    });
    if (!autos.length) return { tuned: 0, pass1: null, pass2: null };

    var pass1 = trace(level);
    var report = { tuned: 0, pass1: pass1, pass2: null, failed: false };

    if (!pass1.ok) {
      /* 反推失败（例如这一关还没写 solution）：给一个保守门槛，保证还能玩，并让校验器大声报错。
         门用"物理下限"兜底，这样至少不会退化成 1 而连带报出一堆"门没有隔开/没有减少"的假错误。 */
      autos.forEach(function (el) {
        if (el.reqAuto) el.req = (el.type === 'door') ? R.doorFloor(el) : 1;
        if (el.revealAuto) el.reveal = 1;
      });
      report.failed = true;
      report.reason = pass1.errors.length ? pass1.errors.join('；') : ('最优解路线在 ' + pass1.status + ' 结束（' + pass1.reason + '）');
      return report;
    }

    var byRecord = {};
    pass1.records.forEach(function (r) { byRecord[r.id] = r; });

    autos.forEach(function (el) {
      var r = byRecord[el.id];
      if (!r) {
        /* 不在最优解路线上的门：没有"到达值"可反推，用它的物理下限兜底。
           不能留 0 —— 那会变成"随便什么数值都能过、过完把自己算死"的陷阱门。 */
        if (el.type === 'door' && el.reqAuto) { el.req = R.doorFloor(el); el.reqFloor = true; }
        return;
      }
      if (el.reqAuto) {
        var frac = typeof el.reqFrac === 'number' ? el.reqFrac
                 : (el.type === 'door' ? 1.0 : 1.0);
        var req = Math.floor(r.before * frac);
        /* 门的门槛至少 1，避免出现"0 也能过"的退化门 */
        if (el.type === 'door' && req < 1) req = 1;
        if (el.type === 'goal' && req < 1) req = 1;
        el.req = req;
        el.reqResolved = r.before;
      }
      if (el.revealAuto) {
        var rf = typeof el.revealFrac === 'number' ? el.revealFrac : 0.5;
        el.reveal = Math.max(1, Math.floor(r.before * rf));
      }
      report.tuned++;
    });

    var pass2 = trace(level);
    report.pass2 = pass2;
    if (!pass2.ok) report.failed = true;
    return report;
  }

  /* ── 单关完整校验 ─────────────────────────────────────── */
  function checkLevel(level) {
    var base = M.validate(level);
    var errors = base.errors.slice(), warns = base.warns.slice();

    /* 新算法必须先介绍：式子用到的函数，必须在这一关或更早的关卡解锁。
       策划要求"前面没出现过的算法不能没有介绍就出现在新关卡"。 */
    var sched = (G.levels && G.levels.funcSchedule) ? G.levels.funcSchedule : null;
    if (sched && G.expr.funcsUsed) {
      level.elements.forEach(function (el) {
        var srcs = [];
        if (el.expr) srcs.push([el.type === 'door' ? '门' : 'token', el.expr]);
        if (el.cond) srcs.push(['用户条件', el.cond]);
        srcs.forEach(function (pair) {
          var used = G.expr.funcsUsed(pair[1]);
          if (!used) return;
          Object.keys(used).forEach(function (f) {
            var at = sched[f];
            if (at === undefined) {
              errors.push('[' + level.id + '] ' + el.id + ' 用了未登记的算法 ' + f + '()');
            } else if (at > level.id) {
              errors.push('[' + level.id + '] ' + el.id + '（' + pair[0] + '）用了还没介绍的算法 ' +
                f + '()：它要到第 ' + at + ' 关才解锁');
            }
          });
        });
      });
    }

    /* 规模 */
    var mn = sizeMinFor(level.id);
    if (level.w < mn[0] || level.h < mn[1]) {
      errors.push('[' + level.id + '] 地图 ' + level.w + '×' + level.h + ' 不满足下限 >' + (mn[0] - 1) + '×' + (mn[1] - 1));
    }

    /* 最优解追踪 */
    var t = trace(level);
    errors = errors.concat(t.errors);
    warns = warns.concat(t.warnings);
    if (!t.ok) {
      errors.push('[' + level.id + '] 最优解路线没能通关（结束状态 ' + t.status + '：' + t.reason + '）');
    }

    /* 终点门槛 = 最优值（或 ≤ 最优值） */
    var goal = level.goal;
    var intended = null;
    if (t.ok) {
      var last = t.records[t.records.length - 1];
      intended = last ? last.before : t.value;
      if (goal) {
        if (goal.req > intended) {
          errors.push('[' + level.id + '] 终点门槛 ' + goal.req + ' > 最优解可达值 ' + intended + '，无法通关');
        } else if (goal.req < intended * 0.7) {
          warns.push('[' + level.id + '] 终点门槛 ' + goal.req + ' 明显低于最优值 ' + intended + '（偏松）');
        }
      }
    }

    /* 门口不能"过了就死" */
    level.doors.forEach(function (d) {
      if (d.type !== 'door') return;
      var probe = [d.req, Math.max(d.req, 1), d.req * 2 + 1, d.req * 4 + 3];
      var killers = probe.filter(function (x) { return !(R.doorValue(x, d) > 0); });
      if (killers.length) {
        warns.push('[' + level.id + '] 门 ' + d.id + ' 在 x=' + killers.join('/') + ' 时通过后的数值 ≤ 0（过门即死）');
      }
    });

    /* 每关至少介绍一个新元素 */
    if (!level.intro || !level.intro.length) warns.push('[' + level.id + '] 没有配置开局元素介绍 intro');

    /* 元素类型清单 */
    var types = {};
    level.elements.forEach(function (e) { types[e.type] = (types[e.type] || 0) + 1; });

    return {
      id: level.id, name: level.name, w: level.w, h: level.h,
      ok: errors.length === 0, errors: errors, warns: warns,
      info: base.info, intendedValue: intended,
      goalReq: goal ? goal.req : null,
      trace: {
        status: t.status, steps: t.steps, value: t.value,
        records: t.records.map(function (r) {
          return r.id + '(' + r.before + '→' + r.after + ')';
        })
      },
      types: types,
      autoTune: level.autoTuneReport || null
    };
  }

  /* ── 批量校验 ─────────────────────────────────────────── */
  function checkAll(specs, buildFn) {
    var out = [];
    specs.slice().sort(function (a, b) { return a.id - b.id; }).forEach(function (spec) {
      try {
        var lv = buildFn(spec);
        out.push(checkLevel(lv));
      } catch (e) {
        out.push({
          id: spec.id, name: spec.name, ok: false,
          errors: ['构建失败：' + e.message], warns: [], info: {},
          types: {}, trace: null, intendedValue: null, goalReq: null
        });
      }
    });
    return out;
  }

  function formatReport(reports) {
    var lines = [];
    var bad = 0;
    reports.forEach(function (r) {
      var head = (r.ok ? '✅' : '❌') + ' 第' + r.id + '关 ' + (r.name || '') +
        '　' + r.w + '×' + r.h + '　门槛=' + r.goalReq + '　最优值=' + r.intendedValue;
      if (!r.ok) bad++;
      lines.push(head);
      r.errors.slice(0, 12).forEach(function (e) { lines.push('   ✗ ' + e); });
      r.warns.slice(0, 8).forEach(function (w) { lines.push('   ! ' + w); });
      if (r.trace && r.trace.records && r.trace.records.length) {
        lines.push('   路线：' + r.trace.records.slice(0, 24).join(' → '));
      }
      if (r.types) {
        var ts = Object.keys(r.types).map(function (k) { return k + '×' + r.types[k]; }).join(' ');
        lines.push('   元素：' + ts);
      }
    });
    lines.unshift(bad === 0 ? '全部 ' + reports.length + ' 关通过校验 ✅' : ('有 ' + bad + ' 关未通过 ❌'));
    return lines.join('\n');
  }

  G.verify = {
    bfsPath: bfsPath,
    trace: trace,
    resolveAutoReqs: resolveAutoReqs,
    checkLevel: checkLevel,
    checkAll: checkAll,
    formatReport: formatReport,
    sizeMinFor: sizeMinFor,
    byId: byId
  };
})(typeof window !== 'undefined' ? (window.DSF = window.DSF || {}) : (globalThis.DSF = globalThis.DSF || {}));

</script>
<script>
/* ─────────────────────────────────────────────────────────────
